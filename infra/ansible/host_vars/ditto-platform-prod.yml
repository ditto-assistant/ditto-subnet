---
# Per-VM config for the prod app VM. inventory_hostname = the GCE instance name.
platform_env: prod
platform_branch: main
platform_domain: platform-api.heyditto.ai

# Origin minted into every v7 inference grant's proxy_url. Served by the same
# Caddy vhost as platform_domain (it is in platform_alias_domains below), so
# this is a naming change, not a routing change. Kept separate from
# platform_domain so it can move without changing the primary vhost/cert.
#
# TWO-SIDED CONTRACT: the validator broker rejects any activation whose
# proxy_url is not byte-identical to its own
# DITTOBENCH_PLATFORM_INFERENCE_PROXY_URL. Never change this without shipping
# the matching ditto-subnet value. No trailing slash.
platform_inference_public_base_url: https://dittobench.ai

platform_alias_domains:
  - subnet.heyditto.ai
  - dittobench.ai
  - www.dittobench.ai
  - api.dittobench.ai
  - dittobench.com
  - www.dittobench.com
  - api.dittobench.com
platform_db_name: ditto_platform_prod
platform_bucket: ditto-platform-agents-prod

# Private Hippius bucket for miner profile pictures. Keep it private — the
# dashboard loads /api/v1/public/miners/{hotkey}/avatar, not a world-readable
# s3.hippius.com URL. EU cache matches the upcoming EU Platform infra.
# Still needs Secret Manager versions for platform-hippius-access-key-id and
# platform-hippius-secret-access-key before converge can enable uploads.
platform_hippius_bucket: ditto-subnet
platform_hippius_endpoint: "https://eu-central-1.hippius.com"

# Inference trace capture: the Go relays spool every brokered call (bodies,
# provider exchange, usage, grant context) under /opt/ditto-platform-relay/
# traces and ship it to the PRIVATE Hippius bucket ditto-subnet-traces --
# a different bucket from the avatars on purpose (different audience, a
# different partition scheme, and a graded benchmark catalog burns on
# exposure). Same hip_ credentials; the relay creates the bucket if it is
# missing. Add the Backblaze mirror by pinning platform_trace_backblaze_*
# once platform-backblaze-key-id / -application-key have versions.
platform_trace_enabled: true
platform_trace_hippius_bucket: ditto-subnet-traces

# Route /api/v1/inference/* to the ditto-api-relay-{1,2} pm2 processes instead
# of the single-core `ditto-api` event loop. These ports mirror RELAY_PORTS in
# ditto-platform scripts/ecosystem.config.js; the relays are already running and
# healthy on this host. Prod only — ditto-platform-dev stays single-process.
#
# Setting this back to [] and re-converging is the durable rollback: it restores
# the byte-exact pre-relay Caddyfile.
platform_inference_relay_ports: [8010, 8011]

# Per-env Secret Manager secret ids (shared ones are in the platform_app role).
# Deploy-owned runtime values live separately in /opt/ditto-platform/.env.deploy.
secret_pylon_token: platform-prod-pylon-open-access-token

# Production remains explicitly dark while the development-only storage
# configuration canary runs. Do not inherit a future role-default change.
platform_coding_catalog_enabled: false
platform_coding_evidence_enabled: false
platform_coding_storage_readiness_enabled: false

# Platform-operated screener auth: allowlist the dedicated prod screener hotkey
# and share its bearer token (the same SCREENER_API_TOKEN configured on
# ditto-screener-prod). This replaces the validator-permit gate, so the screener
# key holds no stake and needs no on-chain registration.
platform_screener_hotkey: "5G6fGXnXFYdLM3ZyAm9whUbCY4ziQzcbMiTEqZB5c9KekTtR"
secret_screener_api_token: "screener-api-token-prod"
# Terraform creates the secret container and grants the Platform identity read
# access. Operators add the payload before converging this host.
secret_screener_controller_api_token: "screener-controller-api-token-prod"

# In-process Targon screening. Terraform grants this VM's attached identity
# secretAccessor on TARGON_API_KEY; Ansible folds the value into .env.
secret_targon_api_key: TARGON_API_KEY
platform_targon_public_url: https://platform-api.heyditto.ai
platform_targon_submission_builder_image: us-central1-docker.pkg.dev/ditto-app-dev/ditto-public-builders/submission-builder
platform_targon_candidate_push_sa: ditto-screening-candidate-push@ditto-app-dev.iam.gserviceaccount.com
platform_targon_candidate_pull_sa: ditto-screening-candidate-pull@ditto-app-dev.iam.gserviceaccount.com
platform_targon_bootstrap_sa: ditto-screener-bootstrap@ditto-app-dev.iam.gserviceaccount.com
platform_targon_source_review_secret: projects/ditto-app-dev/secrets/validator-openrouter-key
platform_cloudrun_project: ditto-app-dev
platform_cloudrun_region: us-central1
platform_cloudrun_untrusted_sa: ditto-screening-untrusted@ditto-app-dev.iam.gserviceaccount.com
platform_cloudrun_invoker_sa: ditto-platform-api@ditto-app-dev.iam.gserviceaccount.com

# Publish the screening backlog (waiting_screening + screening) to Cloud
# Monitoring every 60s — the prod screener fleet's autoscaling signal
# (terraform infra/terraform/stacks/gcp-platform/screener-fleet.tf). Needs the metricWriter
# grant from enable_screener_fleet applied first.
screening_queue_metric_enabled: true
