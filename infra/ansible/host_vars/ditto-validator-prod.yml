---
# Non-secret production intent. Supply the reviewed monorepo SHA and generated
# public hotkey to the play through VALIDATOR_STACK_REVISION and
# VALIDATOR_PROD_HOTKEY. Neither value is signing material.
validator_stack_revision: "{{ lookup('env', 'VALIDATOR_STACK_REVISION') | default('', true) }}"
validator_stack_hotkey: "{{ lookup('env', 'VALIDATOR_PROD_HOTKEY') | default('', true) }}"
validator_stack_hotkey_secret: validator-prod-hotkey-mnemonic
validator_stack_hotkey_secret_version: "{{ lookup('env', 'VALIDATOR_PROD_HOTKEY_SECRET_VERSION') | default('', true) }}"
validator_stack_benchmark_capacity: 8
validator_stack_longmem_capacity: 4
