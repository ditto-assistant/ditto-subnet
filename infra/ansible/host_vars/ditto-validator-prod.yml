---
# Non-secret production intent. Supply the reviewed monorepo SHA and generated
# public hotkey to the play through VALIDATOR_STACK_REVISION and
# VALIDATOR_PROD_HOTKEY. Neither value is signing material.
validator_stack_revision: "{{ lookup('env', 'VALIDATOR_STACK_REVISION') | default('', true) }}"
validator_stack_hotkey: "{{ lookup('env', 'VALIDATOR_PROD_HOTKEY') | default('', true) }}"
validator_stack_hotkey_secret: validator-prod-hotkey-mnemonic
validator_stack_hotkey_secret_version: "{{ lookup('env', 'VALIDATOR_PROD_HOTKEY_SECRET_VERSION') | default('', true) }}"
validator_stack_benchmark_capacity: 8
# Paid Finney provider (same as Platform's SUBTENSOR_ARCHIVE_RPC_URL); its key is
# platform-subtensor-archive-rpc-api-key. The public entrypoint 429s under load.
validator_stack_subtensor_rpc_url: wss://api-bittensor-mainnet.n.dwellir.com
validator_stack_subtensor_rpc_auth_mode: path
validator_stack_longmem_capacity: 4
# Managed Gamma guard (runtime revision 20: emission approval rev 11, collector
# policy rev 9). The role defaults disable it, so these must stay in durable
# intent or any unrelated converge strips Pylon and the validator of the guard
# and Platform stops producing enforcing epochs. Stage the matching public
# approval at the fixed path before converging; changing pins requires
# validator_stack_treasury_allow_guard_change=true for that one converge.
validator_stack_treasury_guard_enabled: true
validator_stack_treasury_policy_digest: fb32519ac263e3388c888d7d654d084d4a8313decf2f194bbe9d5713a11a64f1
validator_stack_treasury_collector_policy_digest: 3e8d100a252dbf5918feefa3253ebd86af0b0bf974d78c6c981aa3a01cc1ccfd
