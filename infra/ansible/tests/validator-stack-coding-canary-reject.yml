---
# One invalid certification canary profile. The shared validation task must be
# the task that fails; accepting the profile fails this test.
- name: Reject {{ case.name }}
  vars:
    validator_stack_coding_canary_enabled: "{{ case.validator | default(false) }}"
    validator_stack_dittobench_coding_canary_enabled: "{{ case.scorer | default(true) }}"
    validator_stack_coding_canary_poll_seconds: "{{ case.poll | default(10) }}"
    validator_stack_coding_runtime_image_repository: "{{ case.repository | default(valid_repository) }}"
    validator_stack_coding_runtime_image_digest: "{{ case.digest | default(valid_digest) }}"
    validator_stack_coding_docker_host: "{{ case.docker_host | default(valid_docker_host) }}"
    validator_stack_coding_egress_network: "{{ case.egress_network | default(valid_egress_network) }}"
    validator_stack_coding_egress_proxy: "{{ case.egress_proxy | default(valid_egress_proxy) }}"
    validator_stack_coding_host_gateway_ip: "{{ case.host_gateway_ip | default(valid_host_gateway_ip) }}"
    validator_stack_coding_canary_targets: "{{ case.targets | default(valid_targets) }}"
    validator_stack_coding_canary_validator_hotkey: "{{ case.canary_hotkey | default(valid_hotkey) }}"
    validator_stack_hotkey: "{{ case.hotkey | default(valid_hotkey) }}"
    validator_stack_coding_executor_connectivity_canary_enabled: "{{ case.connectivity | default(false) }}"
    validator_stack_coding_executor_connectivity_canary_run_enabled: "{{ case.connectivity_run | default(false) }}"
  block:
    - name: Evaluate {{ case.name }}
      ansible.builtin.include_tasks: ../roles/validator_stack/tasks/validate_coding_canary.yml

    - name: Invalid profile was accepted
      ansible.builtin.fail:
        msg: "{{ case.name }} must be rejected"
  rescue:
    - name: Require the canary validation to be the rejecting task
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Validate the default-off certification canary profile'
        fail_msg: "{{ case.name }} was accepted or failed for another reason"
