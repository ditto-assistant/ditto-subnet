---
# Reached only when the gate in main.yml froze true. This role reads the worker
# credential files on the host, inside the module, only to derive search
# needles in memory; the module returns only integers and booleans, and every
# message here is constant or renders only those counts and the validated
# revision.

# --start-at-task can begin at main.yml's gate freeze and skip its static preset
# refusal, but it cannot enter this dynamically included file, so the refusal is
# repeated here together with the raw enabled flag.
- name: Refuse a preset internal name, a preset gate or a credential-named variable
  ansible.builtin.assert:
    that:
      - (coding_hosted_worker_credentials_journal_check_enabled | default(false, true)) is sameas true
      - >-
        lookup('ansible.builtin.varnames', '^coding_hosted_worker_credentials_journal_check_', wantlist=True)
        | sort == ['coding_hosted_worker_credentials_journal_check_confirmation',
        'coding_hosted_worker_credentials_journal_check_enabled',
        'coding_hosted_worker_credentials_journal_check_gate',
        'coding_hosted_worker_credentials_journal_check_source_revision']
      - >-
        lookup('ansible.builtin.varnames',
        '(?i)^(DITTO_CODING_WORKER_|DITTO_CODING_HIPPIUS_)', wantlist=True) | length == 0
    fail_msg: >-
      Enable the spot-check only with coding_hosted_worker_credentials_journal_check_enabled=true
      and the documented inputs; a preset gate, registered result or a credential-named Ansible
      variable is set, or --start-at-task skipped the enable flag. Nothing was read.
    quiet: true

# Accident guard only. The supported entry point,
# infra/scripts/coding-hosted-guarded-run.py, verifies the reviewed checkout,
# refuses exported credentials and every ANSIBLE_* override, builds the enabled
# flag, confirmation and revision itself, and sets this marker in ansible's
# environment. Anyone able to run ansible-playbook can set the same variable,
# so the marker proves nothing about the caller: it only stops an accidental
# direct run, which is unsupported.
- name: Require the guarded entry point marker, an accident guard only
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'DITTO_CODING_HOSTED_GUARDED_RUN') == 'worker-credentials-journal-check'
    fail_msg: >-
      Run this only through uv run --locked --script infra/scripts/coding-hosted-guarded-run.py
      worker-credentials-journal-check REVIEWED_REVISION; direct ansible-playbook runs are
      unsupported. Nothing was read.
    quiet: true

- name: Require the run to target exactly the one dedicated host
  ansible.builtin.assert:
    that:
      - ansible_play_batch == ['ditto-coding-hosted-v2']
      - ansible_play_hosts_all == ['ditto-coding-hosted-v2']
    fail_msg: >-
      Run this only against the single dedicated host with
      --limit ditto-coding-hosted-v2; the play targets more than that host. Nothing was read.
    quiet: true

# The module reads credential files into memory on the host. It carries no
# secret argument, but with pipelining off its AnsiballZ file would sit in the
# login user's remote tmp and be scanned as a leftover entry, so the same
# pipelining guard as the materialization applies.
- name: Require SSH pipelining on and no kept remote files before reading credentials
  ansible.builtin.assert:
    that:
      - (ansible_pipelining | default(false)) is sameas true
      - ansible_ssh_pipelining is not defined or (ansible_ssh_pipelining is sameas true)
      - not (lookup('config', 'DEFAULT_KEEP_REMOTE_FILES') is sameas true)
    fail_msg: >-
      Run with SSH pipelining on (the playbook sets ansible_pipelining) and without
      ANSIBLE_KEEP_REMOTE_FILES or a -e that turns pipelining off. Nothing was read.
    quiet: true

- name: Refuse check mode for an enabled spot-check
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: The spot-check must scan for real; the disabled fixture covers check mode.
    quiet: true

- name: Freeze the confirmation and source revision once
  ansible.builtin.set_fact:
    coding_hosted_worker_credentials_journal_check_gate_confirmation: >-
      {{ coding_hosted_worker_credentials_journal_check_confirmation | default('', true) }}
    coding_hosted_worker_credentials_journal_check_gate_source_revision: >-
      {{ coding_hosted_worker_credentials_journal_check_source_revision | default('', true) }}
  no_log: true

- name: Require the exact confirmation and source revision as frozen literals
  ansible.builtin.assert:
    that:
      - coding_hosted_worker_credentials_journal_check_gate_confirmation is string
      - coding_hosted_worker_credentials_journal_check_gate_confirmation == 'CHECK NATIVE CODING WORKER CREDENTIAL JOURNAL'
      - coding_hosted_worker_credentials_journal_check_gate_source_revision is string
      - coding_hosted_worker_credentials_journal_check_gate_source_revision is match('^[0-9a-f]{40}$')
      - coding_hosted_worker_credentials_journal_check_gate_source_revision | length == 40
    fail_msg: Require the exact spot-check confirmation and a 40-character lowercase-hex source revision. Nothing was read.
    quiet: true

- name: Probe this machine's identity into a result extra vars cannot preset
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', platform, distribution]
  register: coding_hosted_worker_credentials_journal_check_identity

- name: Require the dedicated host
  ansible.builtin.assert:
    that:
      - coding_hosted_worker_credentials_journal_check_identity.ansible_facts.ansible_hostname == 'ditto-coding-hosted-v2'
      - coding_hosted_worker_credentials_journal_check_identity.ansible_facts.ansible_architecture == 'x86_64'
      - coding_hosted_worker_credentials_journal_check_identity.ansible_facts.ansible_distribution == 'Debian'
      - coding_hosted_worker_credentials_journal_check_identity.ansible_facts.ansible_distribution_major_version == '13'
    fail_msg: Require the dedicated Debian 13 x86_64 host ditto-coding-hosted-v2 in role_coding_hosted. Nothing was read.
    quiet: true

# The module opens the three files through pinned descriptors, derives needles
# in memory, streams the whole journal in export format, the text logs and the
# Ansible temp locations, and returns only integers and booleans. Every
# argument is a literal and none is secret; the task is still no_log so no
# invocation line or result reaches the journal or -vvv, and failed_when is
# false so the next task can show the module's constant refusal message.
- name: Count credential names and value fingerprints in the host logs without returning any
  coding_hosted_worker_credentials_journal_check:
    private_dir: /var/lib/ditto-coding-hosted/private
    owner: ditto-coding-hosted
    journal_argv: [/usr/bin/journalctl, --no-pager, --quiet, --output=export]
    log_dir: /var/log
    log_prefixes: [syslog, messages, auth.log, daemon.log, user.log, kern.log, debug, sudo]
    temp_dirs: [/root/.ansible/tmp, /tmp, /var/tmp]
    home_parent: /home
  register: coding_hosted_worker_credentials_journal_check_helper
  no_log: true
  failed_when: false

- name: Require the spot-check module to have scanned every source
  ansible.builtin.assert:
    that:
      - coding_hosted_worker_credentials_journal_check_helper.clean is defined
    fail_msg: >-
      The worker credential log spot-check module did not finish; it names only states, never a
      value: {{ coding_hosted_worker_credentials_journal_check_helper.msg
      | default('no receipt; inspect the host by hand') }}
    quiet: true

- name: Report only per-class counts and whether the host logs are clean
  ansible.builtin.debug:
    msg: >-
      Native Coding worker credential log spot-check;
      source_revision={{ coding_hosted_worker_credentials_journal_check_gate_source_revision }};
      clean={{ coding_hosted_worker_credentials_journal_check_helper.clean | to_json }};
      journal_scanned={{ coding_hosted_worker_credentials_journal_check_helper.sources.journal.scanned | to_json }};
      totals={{ coding_hosted_worker_credentials_journal_check_helper.totals | to_json }};
      journal={{ coding_hosted_worker_credentials_journal_check_helper.sources.journal.counts | to_json }};
      text_logs={{ coding_hosted_worker_credentials_journal_check_helper.sources.text_logs.counts | to_json }};
      text_log_files={{ coding_hosted_worker_credentials_journal_check_helper.sources.text_logs.files | to_json }};
      ansible_temp={{ coding_hosted_worker_credentials_journal_check_helper.sources.ansible_temp.counts | to_json }};
      ansible_temp_entries={{ coding_hosted_worker_credentials_journal_check_helper.sources.ansible_temp.entries | to_json }};
      values_below_minimum_length={{ coding_hosted_worker_credentials_journal_check_helper.values_below_minimum_length | to_json }};
      matching lines, values, needles and digests not shown.

- name: Refuse if a forbidden name, value fingerprint or leftover Ansible temp entry appeared
  ansible.builtin.assert:
    that:
      - coding_hosted_worker_credentials_journal_check_helper.clean is sameas true
    fail_msg: >-
      The spot-check found a forbidden name, a value fingerprint or a leftover Ansible temp entry,
      could not read the journal, or a value was too short to search; see the counts above. Treat
      a value class count as an exposure: revoke and rotate at the issuer.
    quiet: true
