---
- name: reload systemd for screener capacity
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart screener capacity controller
  ansible.builtin.systemd:
    name: "{{ screener_capacity_unit }}"
    state: restarted
    daemon_reload: true

- name: restart trusted image builder
  ansible.builtin.systemd:
    name: "{{ screener_capacity_builder_unit }}"
    state: restarted
    daemon_reload: true
