---
screener_capacity_owner: "{{ deploy_user | default('deploy') }}"
screener_capacity_group: "{{ deploy_group | default('ditto') }}"
screener_capacity_checkout: /opt/ditto-subnet
screener_capacity_service_dir: "{{ screener_capacity_checkout }}/services/screener-orchestrator"
screener_capacity_repo_url: https://github.com/ditto-assistant/ditto-subnet.git
screener_capacity_branch: main
screener_capacity_venv: "{{ screener_capacity_service_dir }}/.venv"
screener_capacity_state_dir: /var/lib/ditto-screener-capacity
screener_capacity_config_dir: /etc/ditto-screener-capacity
screener_capacity_unit: ditto-screener-capacity

screener_capacity_environment: prod
screener_capacity_platform_url: https://platform-api.heyditto.ai
screener_capacity_global_cap: 6
screener_capacity_jobs_per_slot: 6
screener_capacity_interval_seconds: 30
screener_capacity_gce_project: ditto-app-dev
screener_capacity_gce_region: us-central1
screener_capacity_gce_mig: ditto-screener-fleet
screener_capacity_platform_token_secret: screener-controller-api-token-prod
