---
- name: Assert immutable screener fleet inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] in ['12', '13']
      - >-
        (screener_fleet_runtime_enabled and
         screener_fleet_node_id is regex('^subnet-screener-[1-9][0-9]*$')) or
        (not screener_fleet_runtime_enabled and
         screener_fleet_node_id is regex('^subnet-screener(?:-dev)?-[1-9][0-9]*$'))
      - screener_fleet_debian_cloud_image_url.startswith('https://')
      - screener_fleet_debian_cloud_image_sha256 | length == 64
      - screener_fleet_worker_processes | int >= 1
      - screener_fleet_worker_processes | int <= 16
      - screener_fleet_vm_memory_mib | int >= 8192
      - screener_fleet_vm_memory_mib | int <= 12288
    fail_msg: >-
      Use a supported Debian 12/13 host, a valid dedicated or rehearsal node
      id, and a digest-verified Debian guest image before preparing the host.

- name: Assert immutable screener runtime inputs
  ansible.builtin.assert:
    that:
      - screener_fleet_provider_resource_id | length > 0
      - screener_fleet_release_sha is regex('^[0-9a-f]{40}$')
      - screener_fleet_builder_image is regex('^[a-z0-9.-]+(?::[0-9]+)?/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      Runtime convergence requires the Robot server id, immutable release SHA,
      and digest-pinned builder image. Rehearsal mode deliberately requires no
      production identity or source-review secret.
  when: screener_fleet_runtime_enabled

- name: Set the dedicated host name
  ansible.builtin.hostname:
    name: "{{ screener_fleet_node_id }}"

- name: Install KVM, libvirt, cloud-init image, and trusted-container tools
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - cloud-image-utils
      - libguestfs-tools
      - docker.io
      - git
      - curl
      - ca-certificates
      - openssl
      - util-linux
      - python3-debian
    state: present
    update_cache: true

- name: Install the Docker CLI split from docker.io on Debian 13
  ansible.builtin.apt:
    name: docker-cli
    state: present
  when: ansible_facts['distribution_major_version'] == '13'

- name: Ensure the dedicated screener service group
  ansible.builtin.group:
    name: "{{ screener_fleet_group }}"
    system: true
    state: present

- name: Ensure the dedicated screener service user
  ansible.builtin.user:
    name: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    groups: kvm,libvirt,docker
    append: true
    system: true
    create_home: false
    home: "{{ screener_fleet_root }}"
    shell: /usr/sbin/nologin

- name: Ensure the dedicated Google secret materializer user
  ansible.builtin.user:
    name: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    system: true
    create_home: false
    home: "{{ screener_fleet_x509_identity_dir }}"
    shell: /usr/sbin/nologin
  when: screener_fleet_x509_enabled

- name: Allow libvirt QEMU to read disposable screener disks
  ansible.builtin.user:
    name: libvirt-qemu
    groups: "{{ screener_fleet_group }}"
    append: true

- name: Ensure screener fleet directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(screener_fleet_user) }}"
    group: "{{ item.group | default(screener_fleet_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ screener_fleet_root }}", mode: "0755" }
    - { path: "{{ screener_fleet_bittensor_dir }}", mode: "0700" }
    - { path: "{{ screener_fleet_releases_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_release_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_config_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_state_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_jobs_dir }}", mode: "0770" }
    - { path: "{{ screener_fleet_images_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_logs_dir }}", mode: "0750" }
    - { path: "{{ screener_fleet_update_state_dir }}", mode: "0700", owner: root, group: root }

- name: Ensure private X.509 identity and shared secret directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ screener_fleet_x509_identity_dir }}", mode: "0700" }
    - { path: "{{ screener_fleet_x509_cloudsdk_config }}", mode: "0700" }
    - { path: "{{ screener_fleet_secrets_dir }}", mode: "0750" }
  when: screener_fleet_x509_enabled

- name: Generate the non-exported X.509 client private key
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - RSA
      - -pkeyopt
      - rsa_keygen_bits:3072
      - -out
      - "{{ screener_fleet_x509_private_key_file }}"
    creates: "{{ screener_fleet_x509_private_key_file }}"
  become_user: "{{ screener_fleet_secret_agent_user }}"
  no_log: true
  when: screener_fleet_x509_enabled

- name: Restrict the X.509 private key
  ansible.builtin.file:
    path: "{{ screener_fleet_x509_private_key_file }}"
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0400"
  when: screener_fleet_x509_enabled

- name: Generate the exact-subject X.509 signing request
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - "{{ screener_fleet_x509_private_key_file }}"
      - -out
      - "{{ screener_fleet_x509_csr_file }}"
      - -subj
      - /CN=subnet-screener-1
      - -addext
      - "subjectAltName=URI:{{ screener_fleet_x509_subject }}"
      - -addext
      - extendedKeyUsage=clientAuth
      - -addext
      - keyUsage=critical,digitalSignature,keyEncipherment
    creates: "{{ screener_fleet_x509_csr_file }}"
  become_user: "{{ screener_fleet_secret_agent_user }}"
  when: screener_fleet_x509_enabled

- name: Restrict the X.509 signing request
  ansible.builtin.file:
    path: "{{ screener_fleet_x509_csr_file }}"
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0440"
  when: screener_fleet_x509_enabled

- name: Ensure per-worker private state directories
  ansible.builtin.file:
    path: "{{ screener_fleet_state_dir }}/workers/{{ item }}"
    state: directory
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0700"
  loop: "{{ range(1, screener_fleet_worker_processes + 1) | list }}"
  when: screener_fleet_runtime_enabled

- name: Clone or update the public subnet monorepo
  ansible.builtin.git:
    repo: "{{ screener_fleet_repo_url }}"
    dest: "{{ screener_fleet_checkout }}"
    version: "{{ screener_fleet_release_sha }}"
    force: true
  become_user: "{{ screener_fleet_user }}"
  register: screener_fleet_checkout_result
  when: screener_fleet_runtime_enabled

- name: Inspect the screening worker environment
  ansible.builtin.stat:
    path: "{{ screener_fleet_worker_venv }}/bin/ditto-screener"
  register: screener_fleet_worker_environment
  when: screener_fleet_runtime_enabled

- name: Sync the screening worker environment
  ansible.builtin.command:
    cmd: /usr/local/bin/uv sync --frozen
    chdir: "{{ screener_fleet_worker_dir }}"
  become_user: "{{ screener_fleet_user }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ screener_fleet_worker_venv }}"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_checkout_result.changed or not screener_fleet_worker_environment.stat.exists
  changed_when: true
  notify: Restart screener fleet workers

- name: Inspect the fleet-agent environment
  ansible.builtin.stat:
    path: "{{ screener_fleet_orchestrator_venv }}/bin/python"
  register: screener_fleet_agent_environment
  when: screener_fleet_runtime_enabled

- name: Sync the fleet-agent environment
  ansible.builtin.command:
    cmd: /usr/local/bin/uv sync --frozen
    chdir: "{{ screener_fleet_orchestrator_dir }}"
  become_user: "{{ screener_fleet_user }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ screener_fleet_orchestrator_venv }}"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_checkout_result.changed or not screener_fleet_agent_environment.stat.exists
  changed_when: true
  notify: Restart screener fleet agent

- name: Inspect the active fleet release link
  ansible.builtin.stat:
    path: "{{ screener_fleet_current }}"
    follow: false
  register: screener_fleet_current_state
  when: screener_fleet_runtime_enabled

- name: Point a new host at the prepared bootstrap revision
  ansible.builtin.file:
    src: "releases/{{ screener_fleet_release_sha }}"
    dest: "{{ screener_fleet_current }}"
    state: link
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    force: false
  when:
    - screener_fleet_runtime_enabled
    - not screener_fleet_current_state.stat.exists
  notify:
    - Restart screener fleet agent
    - Restart screener fleet workers

- name: Download the verified Debian cloud base
  ansible.builtin.get_url:
    url: "{{ screener_fleet_debian_cloud_image_url }}"
    dest: "{{ screener_fleet_images_dir }}/debian-cloud-source.qcow2"
    checksum: "sha256:{{ screener_fleet_debian_cloud_image_sha256 }}"
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0640"
  register: screener_fleet_cloud_image

- name: Inspect the customized disposable guest base
  ansible.builtin.stat:
    path: "{{ screener_fleet_base_image }}"
  register: screener_fleet_base_image_state

- name: Copy the cloud image before customization
  ansible.builtin.copy:
    src: "{{ screener_fleet_images_dir }}/debian-cloud-source.qcow2"
    dest: "{{ screener_fleet_base_image }}"
    remote_src: true
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0644"
  when:
    - screener_fleet_cloud_image.changed or not screener_fleet_base_image_state.stat.exists
  register: screener_fleet_base_image_copy

- name: Install the disposable-guest runtime in the base image
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ screener_fleet_base_image }}"
      - --install
      - docker.io,curl,ca-certificates
      - --run-command
      - systemctl enable docker
      - --truncate
      - /etc/machine-id
  environment:
    LIBGUESTFS_BACKEND: direct
  when: screener_fleet_base_image_copy.changed
  changed_when: true

- name: Keep the public guest base readable after libvirt ownership changes
  ansible.builtin.file:
    path: "{{ screener_fleet_base_image }}"
    state: file
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0644"

- name: Render the isolated libvirt NAT network
  ansible.builtin.template:
    src: libvirt-network.xml.j2
    dest: "{{ screener_fleet_config_dir }}/libvirt-network.xml"
    owner: root
    group: root
    mode: "0644"
  register: screener_fleet_network_xml

- name: Inspect the libvirt NAT network
  ansible.builtin.command: virsh net-info ditto-screener-nat
  register: screener_fleet_network
  changed_when: false
  failed_when: false

- name: Define the libvirt NAT network
  ansible.builtin.command: >-
    virsh net-define {{ screener_fleet_config_dir }}/libvirt-network.xml
  when: screener_fleet_network.rc != 0
  changed_when: true

- name: Autostart the libvirt NAT network
  ansible.builtin.command: virsh net-autostart ditto-screener-nat
  changed_when: false

- name: Start the libvirt NAT network
  ansible.builtin.command: virsh net-start ditto-screener-nat
  register: screener_fleet_network_start
  changed_when: screener_fleet_network_start.rc == 0
  failed_when:
    - screener_fleet_network_start.rc != 0
    - "'already active' not in screener_fleet_network_start.stderr"

- name: Inspect enrolled node credential
  ansible.builtin.stat:
    path: "{{ screener_fleet_credential_file }}"
  register: screener_fleet_credential
  when: screener_fleet_runtime_enabled

- name: Require one-time registration authority before initial enrollment
  ansible.builtin.assert:
    that: screener_fleet_registration_token | length >= 43
    fail_msg: >-
      Pass screener_fleet_registration_token through Ansible Vault for the
      first converge. It is consumed and removed after enrollment.
  when:
    - screener_fleet_runtime_enabled
    - not screener_fleet_credential.stat.exists
  no_log: true

- name: Write the one-time registration token
  ansible.builtin.copy:
    content: "{{ screener_fleet_registration_token }}\n"
    dest: "{{ screener_fleet_registration_token_file }}"
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0600"
  when:
    - screener_fleet_runtime_enabled
    - not screener_fleet_credential.stat.exists
  no_log: true

- name: Inspect the installed X.509 public trust anchor
  ansible.builtin.stat:
    path: "{{ screener_fleet_x509_ca_certificate_file }}"
  register: screener_fleet_x509_ca_certificate_state
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Inspect the installed X.509 client certificate
  ansible.builtin.stat:
    path: "{{ screener_fleet_x509_certificate_file }}"
  register: screener_fleet_x509_certificate_state
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Require the exact X.509 federation contract
  ansible.builtin.assert:
    that:
      - screener_fleet_x509_subject == 'spiffe://dittobench.ai/screener/subnet-screener-1'
      - screener_fleet_x509_provider is regex('^projects/[0-9]+/locations/global/workloadIdentityPools/screener-fleet-x509/providers/subnet-screener-1$')
      - screener_fleet_x509_service_account_email is regex('^subnet-screener-1@[a-z][a-z0-9-]+\\.iam\\.gserviceaccount\\.com$')
      - >-
        (('BEGIN CERTIFICATE' in screener_fleet_x509_ca_certificate_pem) and
         ('PRIVATE KEY' not in screener_fleet_x509_ca_certificate_pem) and
         ('BEGIN CERTIFICATE' in screener_fleet_x509_certificate_pem) and
         ('PRIVATE KEY' not in screener_fleet_x509_certificate_pem)) or
        ((screener_fleet_x509_ca_certificate_pem | length == 0) and
         (screener_fleet_x509_certificate_pem | length == 0) and
         screener_fleet_x509_ca_certificate_state.stat.isreg and
         screener_fleet_x509_certificate_state.stat.isreg)
    fail_msg: >-
      Runtime X.509 federation requires the exact Terraform provider output,
      dedicated service account output, public offline-CA certificate, and a
      signed leaf certificate for subnet-screener-1. No private key belongs in
      inventory, Vault, Terraform, or Git.
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Install the X.509 public trust anchor
  ansible.builtin.copy:
    content: "{{ screener_fleet_x509_ca_certificate_pem }}"
    dest: "{{ screener_fleet_x509_ca_certificate_file }}"
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0440"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled
    - screener_fleet_x509_ca_certificate_pem | length > 0

- name: Install the signed X.509 client certificate
  ansible.builtin.copy:
    content: "{{ screener_fleet_x509_certificate_pem }}"
    dest: "{{ screener_fleet_x509_certificate_file }}"
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0440"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled
    - screener_fleet_x509_certificate_pem | length > 0

- name: Verify the client certificate chain and purpose
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -purpose
      - sslclient
      - -CAfile
      - "{{ screener_fleet_x509_ca_certificate_file }}"
      - "{{ screener_fleet_x509_certificate_file }}"
  changed_when: false
  check_mode: false
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Require at least fourteen days of client certificate validity
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "1209600"
      - -noout
      - -in
      - "{{ screener_fleet_x509_certificate_file }}"
  changed_when: false
  check_mode: false
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Read the client certificate URI SAN
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ screener_fleet_x509_certificate_file }}"
      - -noout
      - -ext
      - subjectAltName
  register: screener_fleet_x509_san
  changed_when: false
  check_mode: false
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Require the exact subnet-screener-1 URI SAN
  ansible.builtin.assert:
    that:
      - "('URI:' + screener_fleet_x509_subject) in screener_fleet_x509_san.stdout"
    fail_msg: The client certificate does not contain the exact permitted URI SAN
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Read the private-key public modulus
  ansible.builtin.command:
    argv:
      - openssl
      - rsa
      - -in
      - "{{ screener_fleet_x509_private_key_file }}"
      - -noout
      - -modulus
  register: screener_fleet_x509_key_modulus
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Read the certificate public modulus
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ screener_fleet_x509_certificate_file }}"
      - -noout
      - -modulus
  register: screener_fleet_x509_certificate_modulus
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Require the host-generated key to match the signed certificate
  ansible.builtin.assert:
    that:
      - screener_fleet_x509_key_modulus.stdout == screener_fleet_x509_certificate_modulus.stdout
    fail_msg: The signed client certificate does not match this host's private key
  no_log: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Ensure gcloud is available for X.509 federation
  ansible.builtin.command: gcloud --version
  register: screener_fleet_gcloud_check
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Install Google Cloud CLI for X.509 federation
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled
    - screener_fleet_gcloud_check.rc != 0
  block:
    - name: Add Google Cloud apt key for the secret materializer
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/google-cloud.gpg
        mode: "0644"

    - name: Add Google Cloud apt repository for the secret materializer
      ansible.builtin.deb822_repository:
        name: google-cloud-sdk
        types: [deb]
        uris: https://packages.cloud.google.com/apt
        suites: [cloud-sdk]
        components: [main]
        signed_by: /usr/share/keyrings/google-cloud.gpg
        state: present

    - name: Install Google Cloud CLI for the secret materializer
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present
        update_cache: true

- name: Render the non-secret X.509 external-account configuration
  ansible.builtin.command:
    argv:
      - gcloud
      - iam
      - workload-identity-pools
      - create-cred-config
      - "{{ screener_fleet_x509_provider }}"
      - "--service-account={{ screener_fleet_x509_service_account_email }}"
      - --service-account-token-lifetime-seconds=900
      - "--credential-cert-path={{ screener_fleet_x509_certificate_file }}"
      - "--credential-cert-private-key-path={{ screener_fleet_x509_private_key_file }}"
      - "--output-file={{ screener_fleet_x509_credential_file }}"
    creates: "{{ screener_fleet_x509_credential_file }}"
  become_user: "{{ screener_fleet_secret_agent_user }}"
  environment:
    HOME: "{{ screener_fleet_x509_identity_dir }}"
    CLOUDSDK_CONFIG: "{{ screener_fleet_x509_cloudsdk_config }}"
  no_log: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Restrict the external-account and certificate configurations
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ screener_fleet_secret_agent_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0400"
  loop:
    - "{{ screener_fleet_x509_credential_file }}"
    - "{{ screener_fleet_x509_cloudsdk_config }}/certificate_config.json"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Install the source-review secret materializer
  ansible.builtin.template:
    src: materialize-source-review-secret.sh.j2
    dest: /usr/local/sbin/ditto-screener-source-review-secret
    owner: root
    group: root
    mode: "0755"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Install source-review secret materializer units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: ditto-screener-source-review-secret.service.j2, dest: ditto-screener-source-review-secret.service }
    - { src: ditto-screener-source-review-secret.timer.j2, dest: ditto-screener-source-review-secret.timer }
  notify: Reload systemd for screener fleet
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Materialize the source-review secret without exposing its value
  ansible.builtin.systemd:
    name: ditto-screener-source-review-secret
    state: started
    daemon_reload: true
  no_log: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Enable periodic source-review secret refresh
  ansible.builtin.systemd:
    name: ditto-screener-source-review-secret.timer
    enabled: true
    state: started
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_x509_enabled

- name: Inspect source-review API key file
  ansible.builtin.stat:
    path: "{{ screener_fleet_source_review_key_file }}"
  register: screener_fleet_source_review_key
  when: screener_fleet_runtime_enabled

- name: Require source-review authority before initial converge
  ansible.builtin.assert:
    that: screener_fleet_source_review_api_key | length >= 16
    fail_msg: >-
      Pass screener_fleet_source_review_api_key through Ansible Vault; it is
      stored mode 0600 and never forwarded to a build or smoke guest.
  when:
    - screener_fleet_runtime_enabled
    - not screener_fleet_x509_enabled
    - not screener_fleet_source_review_key.stat.exists
  no_log: true

- name: Write the source-review API key
  ansible.builtin.copy:
    content: "{{ screener_fleet_source_review_api_key }}\n"
    dest: "{{ screener_fleet_source_review_key_file }}"
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0600"
  when:
    - screener_fleet_runtime_enabled
    - not screener_fleet_x509_enabled
    - not screener_fleet_source_review_key.stat.exists
  no_log: true

- name: Render the screener fleet environment
  ansible.builtin.template:
    src: fleet.env.j2
    dest: "{{ screener_fleet_env_file }}"
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0600"
  notify:
    - Restart screener fleet agent
    - Restart screener fleet workers
  when: screener_fleet_runtime_enabled

- name: Render the immutable fleet release environment
  ansible.builtin.template:
    src: release.env.j2
    dest: "{{ screener_fleet_release_env_file }}"
    owner: "{{ screener_fleet_user }}"
    group: "{{ screener_fleet_group }}"
    mode: "0600"
    force: false
  notify: Restart screener fleet agent
  when: screener_fleet_runtime_enabled

- name: Install checksum-pinned Cosign verifier
  ansible.builtin.get_url:
    url: https://github.com/sigstore/cosign/releases/download/{{ screener_fleet_cosign_version }}/cosign-linux-amd64
    dest: /usr/local/bin/cosign
    checksum: sha256:{{ screener_fleet_cosign_linux_amd64_sha256 }}
    owner: root
    group: root
    mode: "0755"
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_auto_update_enabled

- name: Install the authenticated fleet pull updater
  ansible.builtin.copy:
    src: "{{ screener_fleet_checkout }}/scripts/screener-fleet-auto-update.sh"
    dest: "{{ screener_fleet_updater_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    force: false
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_auto_update_enabled

- name: Install screener fleet updater units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: ditto-screener-fleet-auto-update.service.j2, dest: ditto-screener-fleet-auto-update.service }
    - { src: ditto-screener-fleet-auto-update.timer.j2, dest: ditto-screener-fleet-auto-update.timer }
  notify: Reload systemd for screener fleet
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_auto_update_enabled

- name: Install screener fleet systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: ditto-screener-enroll.service.j2, dest: ditto-screener-enroll.service }
    - { src: ditto-screener-fleet-agent.service.j2, dest: ditto-screener-fleet-agent.service }
    - { src: ditto-screener-worker@.service.j2, dest: ditto-screener-worker@.service }
  notify: Reload systemd for screener fleet
  when: screener_fleet_runtime_enabled

- name: Enable and run one-time node enrollment
  ansible.builtin.systemd:
    name: ditto-screener-enroll
    enabled: true
    state: started
    daemon_reload: true
  when: screener_fleet_runtime_enabled

- name: Enable and start the fleet lane agent
  ansible.builtin.systemd:
    name: ditto-screener-fleet-agent
    enabled: true
    state: started
  when: screener_fleet_runtime_enabled

- name: Enable and start full screening workers
  ansible.builtin.systemd:
    name: "ditto-screener-worker@{{ item }}"
    enabled: true
    state: started
  loop: "{{ range(1, screener_fleet_worker_processes + 1) | list }}"
  when: screener_fleet_runtime_enabled

- name: Enable the outbound-only authenticated fleet updater
  ansible.builtin.systemd:
    name: ditto-screener-fleet-auto-update.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - screener_fleet_runtime_enabled
    - screener_fleet_auto_update_enabled
