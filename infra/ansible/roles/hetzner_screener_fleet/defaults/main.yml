---
screener_fleet_node_id: subnet-screener-1
screener_fleet_runtime_enabled: true
screener_fleet_environment: prod
screener_fleet_provider_resource_id: ""
screener_fleet_platform_url: https://platform-api.heyditto.ai
screener_fleet_netuid: 118

screener_fleet_user: ditto-screener
screener_fleet_group: ditto-screener
screener_fleet_root: /opt/ditto/screener-fleet
screener_fleet_bittensor_dir: "{{ screener_fleet_root }}/.bittensor"
screener_fleet_releases_dir: "{{ screener_fleet_root }}/releases"
screener_fleet_release_dir: "{{ screener_fleet_releases_dir }}/{{ screener_fleet_release_sha }}"
screener_fleet_current: "{{ screener_fleet_root }}/current"
screener_fleet_checkout: "{{ screener_fleet_release_dir }}/src"
screener_fleet_worker_dir: "{{ screener_fleet_checkout }}/workers/screener"
screener_fleet_orchestrator_dir: "{{ screener_fleet_checkout }}/services/screener-orchestrator"
screener_fleet_worker_venv: "{{ screener_fleet_release_dir }}/worker-venv"
screener_fleet_orchestrator_venv: "{{ screener_fleet_release_dir }}/orchestrator-venv"
screener_fleet_active_worker_dir: "{{ screener_fleet_current }}/src/workers/screener"
screener_fleet_active_orchestrator_dir: "{{ screener_fleet_current }}/src/services/screener-orchestrator"
screener_fleet_active_worker_venv: "{{ screener_fleet_current }}/worker-venv"
screener_fleet_active_orchestrator_venv: "{{ screener_fleet_current }}/orchestrator-venv"
screener_fleet_state_dir: /var/lib/ditto-screener-fleet
screener_fleet_config_dir: /etc/ditto-screener-fleet
screener_fleet_secret_agent_user: ditto-screener-secrets
screener_fleet_x509_enabled: false
screener_fleet_x509_subject: spiffe://dittobench.ai/screener/subnet-screener-1
screener_fleet_x509_provider: ""
screener_fleet_x509_service_account_email: ""
screener_fleet_x509_ca_certificate_pem: ""
screener_fleet_x509_certificate_pem: ""
screener_fleet_x509_identity_dir: "{{ screener_fleet_config_dir }}/google-identity"
screener_fleet_x509_private_key_file: "{{ screener_fleet_x509_identity_dir }}/client.key"
screener_fleet_x509_csr_file: "{{ screener_fleet_x509_identity_dir }}/client.csr"
screener_fleet_x509_certificate_file: "{{ screener_fleet_x509_identity_dir }}/client.crt"
screener_fleet_x509_ca_certificate_file: "{{ screener_fleet_x509_identity_dir }}/ca.crt"
screener_fleet_x509_credential_file: "{{ screener_fleet_x509_identity_dir }}/credentials.json"
screener_fleet_x509_cloudsdk_config: "{{ screener_fleet_x509_identity_dir }}/gcloud"
screener_fleet_secrets_dir: "{{ screener_fleet_state_dir }}/secrets"
screener_fleet_gcp_project: ditto-app-dev
screener_fleet_source_review_secret_id: validator-openrouter-key
screener_fleet_jobs_dir: "{{ screener_fleet_state_dir }}/jobs"
screener_fleet_images_dir: "{{ screener_fleet_state_dir }}/images"
screener_fleet_logs_dir: /var/log/ditto-screener-fleet
# Rootless Docker runs outside each worker's PrivateTmp namespace. Keep this
# host-visible directory outside /tmp and /var/tmp, which systemd replaces in
# the worker mount namespace even when ReadWritePaths names a subdirectory.
# The shared parent is traversable only by the screener and rootless executor.
screener_fleet_l2_workspace_root: /var/lib/ditto-screener-l2-workspaces
screener_fleet_rootless_docker_host: unix:///run/ditto-screener-docker/docker.sock
screener_fleet_executor_user: ditto-builder
screener_fleet_executor_group: ditto-builder
screener_fleet_executor_home: /var/lib/ditto-screener-docker
# The rootless daemon cannot traverse the screener's private state tree. This
# shared parent is owned by the daemon identity while the screener has group
# write access; each gateway invocation still creates a unique 0711 child.
screener_fleet_gateway_state_root: /var/lib/ditto-screener-gateway-state
screener_fleet_credential_file: "{{ screener_fleet_config_dir }}/node.json"
screener_fleet_registration_token_file: "{{ screener_fleet_config_dir }}/registration-token"
screener_fleet_source_review_key_file: >-
  {{ screener_fleet_secrets_dir + '/source-review-api-key'
     if screener_fleet_x509_enabled
     else screener_fleet_config_dir + '/source-review-api-key' }}
screener_fleet_env_file: "{{ screener_fleet_config_dir }}/fleet.env"
screener_fleet_release_env_file: "{{ screener_fleet_config_dir }}/release.env"
screener_fleet_update_state_dir: "{{ screener_fleet_state_dir }}/updater"
screener_fleet_updater_path: >-
  {{ screener_fleet_update_state_dir }}/ditto-screener-fleet-auto-update

screener_fleet_repo_url: https://github.com/ditto-assistant/ditto-subnet.git
# Exact public release commit to run. Mutable branches are deliberately rejected.
screener_fleet_release_sha: ""
# Safe first-converge/canary posture. Raise this alongside the audited
# Backroom screening concurrency only after the lower setting is proven.
screener_fleet_worker_processes: 1
screener_fleet_agent_workers: 12
screener_fleet_poll_seconds: 2
screener_fleet_build_timeout_seconds: 2400
screener_fleet_runtime_timeout_seconds: 300
screener_fleet_source_review_timeout_seconds: 1800
screener_fleet_vm_memory_mib: 10240
screener_fleet_vm_vcpus: 8
screener_fleet_vm_disk_gib: 80

# Both images execute trusted Ditto code and must be immutable release digests.
screener_fleet_builder_image: ""
screener_fleet_auto_update_enabled: true
screener_fleet_release_channel: ghcr.io/ditto-assistant/ditto-subnet-stack:screener-fleet-stable-1
screener_fleet_cosign_version: v3.0.6
screener_fleet_cosign_linux_amd64_sha256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74

# Pin an official Debian genericcloud image by digest in private inventory.
screener_fleet_debian_cloud_image_url: ""
screener_fleet_debian_cloud_image_sha256: ""
screener_fleet_base_image: "{{ screener_fleet_images_dir }}/debian-12-docker.qcow2"

# Supply these only for first converge, preferably through Ansible Vault.
# The registration token is consumed and deleted by ditto-screener-enroll.
screener_fleet_registration_token: ""
screener_fleet_source_review_api_key: ""
