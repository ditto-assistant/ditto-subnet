---
# Defaults for the platform_app role — the ditto-platform (SN118 API) app host.
# The app runs as a host process under pm2/uv (scripts/ecosystem.config.js) with
# Pylon as a Docker sidecar (docker-compose `pylon` service). Per-VM values
# (platform_env, platform_branch, platform_domain, platform_db_name,
# platform_bucket, per-env secret ids) come from host_vars; shared TF-output
# values (platform_pg_host, platform_storage_access_key) from
# group_vars/role_platform_app.yml.

# --- Preflight manifest: REQUIRED vs legitimately OPTIONAL -------------------
# Which env-sourced values must be real before anything is rendered, and which
# are genuinely opt-in. Reified here so the distinction is a deliberate,
# reviewable decision instead of an accident of which Jinja `default(…)` someone
# happened to type in group_vars. Consumed by tasks/preflight.yml.
#
# Add a row here whenever a new `lookup('env', …)` value joins
# group_vars/role_platform_app.yml. If nobody remembers to, the postflight
# env_render_guard still catches any TODO_ placeholder that reaches the file —
# this list only buys the earlier, better-worded failure.
platform_required_env_values:
  - var: platform_pg_host
    env: PLATFORM_PG_HOST
    tf_output: pg_internal_ip
    renders: POSTGRES_HOST
    impact: >-
      the app cannot resolve or reach Postgres: the API dies at its next restart
      (asyncpg socket.gaierror) and every Alembic migration fails.
  - var: platform_storage_access_key
    env: PLATFORM_STORAGE_ACCESS_KEY
    tf_output: storage_hmac_access_id
    renders: STORAGE_ACCESS_KEY
    impact: >-
      every agent-tarball upload, download and presign against GCS fails to
      authenticate.

# OPTIONAL by documented design — "empty = disabled, opt-in". These must NOT
# hard-fail a converge (dev hosts legitimately run without them), but an empty
# value silently turns a feature off, so preflight warns loudly about each one.
platform_optional_env_values:
  - var: platform_embedder_url
    env: PLATFORM_EMBEDDER_URL
    tf_output: embedder_url
    renders: CODE_EMBEDDER_URL
    disabled: >-
      no code embeddings are computed — the anti-copy semantic tier is off and
      agents.code_embedding stays null.
  - var: platform_datapipeline_url
    env: PLATFORM_DATAPIPELINE_URL
    tf_output: datapipeline_url
    renders: DATA_PIPELINE_URL
    disabled: >-
      no per-submission dataset is pinned — scores carry no on-chain seed
      provenance and no reproduction command (v7 requires dataset pinning).

# Pinned so the compose project identity does not follow the checkout path.
# See templates/platform.env.j2 for why this is not left to compose's default.
platform_compose_project_name: ditto-platform

platform_checkout_root: /opt/ditto-subnet
platform_root: "{{ platform_checkout_root }}/apps/platform"
platform_repo_url: "git@github.com:ditto-assistant/ditto-subnet.git"
platform_owner: "{{ deploy_user | default('deploy') }}"
platform_group: "{{ deploy_group | default('ditto') }}"

# Python sampling profiler installed as an isolated uv tool. It is not placed
# in the application environment, so profiling dependencies cannot perturb the
# API lockfile or import graph.
platform_py_spy_version: "0.4.2"
platform_uv_tool_dir: /opt/uv-tools

# App listen port (Caddy reverse-proxies the public 443 -> here).
#
# This ALSO renders API_PORT into /opt/ditto-platform/.env, which
# scripts/update.sh greps to build `ditto-api`'s post-deploy health URL. Do not
# repurpose it for the relay pool below — moving it would silently point the
# deploy verifier at the wrong process.
platform_api_port: 8000

# --- Go request-plane pool (inference plus narrow upload admission) ----------
# Local ports of the DITTO_ROLE=relay pm2 processes. Must mirror RELAY_PORTS
# in apps/platform/scripts/ecosystem.config.js and the
# DITTO_RELAY_PORTS default in apps/platform/scripts/update.sh; those define
# which ports the relays actually bind.
#
# EMPTY LIST MEANS NO RELAY. The Caddyfile then renders a single bare
# `reverse_proxy localhost:{{ platform_api_port }}`, byte-identical to the
# pre-relay file. That is both the default for any host that has not stood the
# relays up (dev runs single-process) and the durable rollback target for both
# inference and Go upload admission: set this back to [] and re-converge.
platform_inference_relay_ports: []

# Separate activation gate for the Go upload-admission slice. Keep false until
# every configured relay slot reports the release SHA that contains the upload
# handlers; then set true and converge. Turning only this flag back off rolls
# uploads back to Python without disturbing the already-live inference plane.
platform_upload_admission_relay_enabled: false

# Additional public hostnames served by the same Caddy vhost. Keep aliases in
# host_vars so each environment explicitly owns its certificate/SNI surface.
platform_alias_domains: []

# Postgres connection (host/db come from group_vars + host_vars).
platform_pg_port: 5432
platform_pg_user: ditto

# SQLAlchemy pool bounds. The old 2/10 default starved under concurrent miner
# uploads (each holds a session across the tarball read + fingerprinting) and
# caused the 2026-07-16 prod outage; 5/30 matches the live hotfix. Postgres
# max_connections is 100 on the shared pg VM, so dev+prod at 30 each still
# leave headroom.
platform_pg_pool_min_size: 5
platform_pg_pool_max_size: 30

# GCS S3-interop object storage. The access key is the HMAC access id
# (group_vars); the secret comes from Secret Manager at render time.
platform_storage_endpoint: "https://storage.googleapis.com"
platform_storage_region: auto

# Optional private Hippius bucket for miner profile pictures. Empty bucket
# disables the feature (set/clear return 503; the rest of Platform boots).
# Do not make this bucket public: Hippius SDK-direct PUT/GET fail
# SignatureDoesNotMatch, and avatars are served through Platform.
# Host vars pin the live bucket name and the regional cache closest to the
# Platform VMs. Access keys must start with hip_.
platform_hippius_endpoint: "https://s3.hippius.com"
platform_hippius_region: decentralized
platform_hippius_bucket: ""
secret_hippius_access_key_id: platform-hippius-access-key-id
secret_hippius_secret_access_key: platform-hippius-secret-access-key

# Inference trace capture (services/model-relay internal/traces): every
# brokered call's bodies, provider exchange, usage and timing, spooled on the
# relay host and shipped to S3-compatible buckets. Off until a host pins
# platform_trace_enabled; then the Hippius sink reuses the HIPPIUS_* creds
# above and needs only its own PRIVATE bucket, and an optional Backblaze B2
# mirror is added when platform_trace_backblaze_bucket is set (its keys come
# from Secret Manager: platform-backblaze-key-id / -application-key). The
# relay refuses to boot if an enabled sink is unreachable.
platform_trace_enabled: false
platform_trace_spool_dir: /opt/ditto-platform-relay/traces
platform_trace_hippius_bucket: ditto-subnet-traces
platform_trace_backblaze_bucket: ""
platform_trace_backblaze_endpoint: ""
platform_trace_backblaze_region: ""
platform_trace_backblaze_required: false
platform_trace_embedding_vectors: true
secret_backblaze_key_id: platform-backblaze-key-id
secret_backblaze_application_key: platform-backblaze-application-key

# Private Coding catalog. This is deliberately a separate read-only S3
# authority, never the miner-upload or avatar bucket. It remains disabled
# until an operator creates the private bucket, installs the two secret
# versions, and explicitly enables it in environment host_vars.
platform_coding_catalog_enabled: false
platform_coding_catalog_endpoint: "https://s3.hippius.com"
platform_coding_catalog_region: decentralized
platform_coding_catalog_bucket: ""
platform_coding_catalog_use_tls: true
platform_coding_catalog_max_record_bytes: 2097152
platform_coding_catalog_timeout_seconds: 10
secret_coding_catalog_access_key: platform-coding-catalog-access-key
secret_coding_catalog_secret_key: platform-coding-catalog-secret-key

# Shadow coding transport and its two caller-driven admin controls. They are
# deliberately independent: the transport also serves the public capability
# canary, while reconciliation and k=3 ticket issuance remain explicit admin
# actions. Every switch ships false; changing a host var and converging is the
# only way this role can render an active value.
platform_coding_shadow_enabled: false
platform_coding_shadow_reconciliation_enabled: false
platform_coding_shadow_ticket_set_enabled: false
platform_coding_shadow_selection_delay_blocks: 20
platform_coding_shadow_ticket_lease_seconds: 3600
platform_coding_shadow_inference_policy_file: >-
  {{ platform_checkout_root }}/packages/dittobench-coding-contract/testdata/coding_inference_policy_locked_v1.json
platform_coding_shadow_inference_policy_sha256: "6dd79225817b56ebf155f8344cd5faf752c8dd57802b21d6d2cbbae9cc2ff0b4"
platform_coding_shadow_inference_exchange_url: >-
  {{ platform_inference_public_base_url }}/api/v1/validator/coding-shadow/inference-exchange
platform_coding_shadow_inference_proxy_url: >-
  {{ platform_inference_public_base_url }}/api/v1/inference/coding/chat/completions
platform_coding_shadow_inference_revoke_url: >-
  {{ platform_inference_public_base_url }}/api/v1/validator/coding-shadow/inference-revoke-capability

# Hippius-only sealed Coding evidence custody. Disabled until two dedicated
# credential versions and the protected probe/public-key files are installed.
platform_coding_hippius_evidence_enabled: false
platform_coding_hippius_endpoint: "https://s3.hippius.com"
platform_coding_hippius_region: decentralized
platform_coding_hippius_evidence_bucket: ""
platform_coding_hippius_evidence_timeout_seconds: 20
platform_coding_hippius_probe_receipt_path: /etc/ditto-platform/coding/hippius-probe.json
platform_coding_hippius_evidence_wrapping_public_key_path: /etc/ditto-platform/coding/evidence-wrap-public.pem
platform_coding_hippius_evidence_spool_root: /var/lib/ditto-platform/coding-evidence-spool
secret_coding_hippius_evidence_access_key: platform-coding-hippius-evidence-access-key
secret_coding_hippius_evidence_secret_key: platform-coding-hippius-evidence-secret-key

# Protected one-shot Hippius canary helper proxies. This independent gate
# installs no backend service and is false until three separate service
# identities expose reviewed local Unix sockets.
platform_coding_hippius_canary_helpers_enabled: false
platform_coding_hippius_canary_install_root: /opt/ditto-platform-canary
platform_coding_hippius_canary_config_root: /etc/ditto-platform/coding/hippius-canary
platform_coding_hippius_canary_work_root: /var/lib/ditto-platform/coding-canary
platform_coding_hippius_canary_operator_env_path: /etc/ditto-platform/coding/hippius-canary/operator.env
platform_coding_hippius_canary_plan_path: /etc/ditto-platform/coding/hippius-canary/plan.json
platform_coding_hippius_canary_deployed_source_path: "{{ platform_root }}/logs/deployed-source.sha"
platform_coding_hippius_private_input_manifest_path: /etc/ditto-platform/coding/hippius-canary/private-input-manifest.json
platform_coding_hippius_private_input_publication_receipt_path: /etc/ditto-platform/coding/hippius-canary/private-input-publication.json
platform_coding_hippius_curator_public_key_path: /etc/ditto-platform/coding/hippius-canary/curator-public.pem
platform_coding_hippius_private_input_curator_access_key: ""
platform_coding_hippius_canary_unwrap_socket: /run/ditto-hippius-canary-unwrap/unwrap.sock
platform_coding_hippius_canary_authoring_socket: ""
platform_coding_hippius_canary_grading_socket: ""
platform_coding_hippius_canary_unwrap_uid: 0
platform_coding_hippius_canary_authoring_uid: 0
platform_coding_hippius_canary_grading_uid: 0
platform_coding_hippius_canary_unwrap_gid: 0
platform_coding_hippius_canary_authoring_gid: 0
platform_coding_hippius_canary_grading_gid: 0
platform_coding_hippius_canary_helper_timeout_seconds: 7200

# Isolated unwrap backend. Installation and socket activation are separate so
# the service identity can exist before operators install its mode-0400 key and
# one-shot authority file. Both gates ship false.
platform_coding_hippius_canary_unwrap_installed: false
platform_coding_hippius_canary_unwrap_service_enabled: false
platform_coding_hippius_canary_unwrap_user: ditto-canary-unwrap
platform_coding_hippius_canary_unwrap_group: ditto-canary-unwrap
platform_coding_hippius_canary_unwrap_service_path: "{{ platform_coding_hippius_canary_install_root }}/backend/hippius-canary-unwrap-service"
platform_coding_hippius_canary_unwrap_authority_path: "{{ platform_coding_hippius_canary_config_root }}/unwrap-service/authority.json"
platform_coding_hippius_canary_unwrap_private_key_path: "{{ platform_coding_hippius_canary_config_root }}/unwrap-service/private-key.pem"
platform_coding_hippius_canary_unwrap_service_env_path: "{{ platform_coding_hippius_canary_config_root }}/unwrap-service/service.env"
platform_coding_hippius_canary_unwrap_openssl_path: /usr/bin/openssl
platform_coding_hippius_canary_unwrap_socket_timeout_seconds: 30

# Subnet / pricing config (mirrors .env.example defaults).
platform_netuid: 118
platform_subtensor_network: finney
platform_upload_fee_usd: 5
platform_upload_fee_buffer: 1.4

# --- Code-embedding (anti-copy semantic tier) ---
# The embedder runs as a scale-to-zero Cloud Run service (see infra/terraform/stacks/gcp-platform/
# embedder.tf). DISABLED unless platform_embedder_url is set (the Terraform
# embedder_url output, threaded via group_vars from $PLATFORM_EMBEDDER_URL): with
# it empty the platform embeds nothing (null column, no behavior change). The model
# must match the baked image (docker/embedder MODEL_ID); leave dim "" for
# jina-v2-base-code (native 768 width; Qwen3 would use 256 MRL).
platform_embedder_model: jinaai/jina-embeddings-v2-base-code
platform_embedder_auth: gcp_id_token
platform_embedder_timeout_seconds: 30
platform_embedder_dim: ""

# --- Per-submission dataset generation (on-chain seed provenance) ---
# The generate service runs as a scale-to-zero Cloud Run service (see
# infra/terraform/stacks/gcp-platform/datapipeline.tf). DISABLED unless platform_datapipeline_url
# is set (the Terraform datapipeline_url output, threaded via group_vars from
# $PLATFORM_DATAPIPELINE_URL): with it empty the platform pins no dataset
# (pre-k3 behavior, no provenance shown). When set, a generation failure blocks
# the agent's promotion rather than pinning a null dataset, so only enable it
# with the service deployed and invokable by the platform SA. run_size must
# match what validators score (the worker runs full).
platform_datapipeline_auth: gcp_id_token
platform_datapipeline_run_size: full
platform_datapipeline_timeout_seconds: 60

# ACME contact for Caddy's managed cert.
platform_caddy_email: peyton@omniaura.ai

# Shared Secret Manager secret ids (per-env ones are set in host_vars).
secret_db_password: platform-db-password
secret_hmac_secret: platform-storage-hmac-secret
secret_github_deploy_key: platform-github-deploy-key
# Shared with trusted internal operator tools. The value already exists in
# Secret Manager; Terraform only grants this VM's runtime identity read access.
secret_admin_api_token: ADMIN_API_PASSWORD
# Separate bearer used only by the provider-mutating capacity controller.
secret_screener_controller_api_token: ""
# Targon Rentals. Empty public URL disables the in-process rental loop.
secret_targon_api_key: TARGON_API_KEY
platform_targon_public_url: ""
platform_targon_submission_builder_image: ""
platform_targon_org_slug: ditto
platform_targon_resource: cpu-small
platform_targon_candidate_push_sa: ""
platform_targon_candidate_pull_sa: ""
platform_targon_bootstrap_sa: ""
platform_targon_source_review_secret: ""
platform_targon_environment: prod
platform_targon_max_inflight: 10
platform_targon_smoke_provision_timeout_seconds: 30
platform_cloudrun_project: ""
platform_cloudrun_region: us-central1
platform_cloudrun_untrusted_sa: ""
platform_cloudrun_invoker_sa: ""

# Platform-owned inference stays dark until the coordinated rollout enables it.
platform_inference_proxy_enabled: false
platform_inference_proxy_required: false
secret_platform_openrouter_key: validator-openrouter-key
platform_inference_allowed_models: qwen/qwen3-32b,openai/gpt-oss-20b
platform_inference_provider: nebius
# Initial v7 mode: one reviewed logical route, OpenRouter speed sorting, and
# healthy fallback. The DB-backed per-provider optimizer remains dark.
platform_inference_routing_mode: aggregate_throughput
platform_inference_discovery_interval_seconds: 300
platform_inference_route_speed_weight: 0.65
platform_inference_route_cost_weight: 0.25
platform_inference_route_exploration_weight: 0.10
platform_inference_route_ewma_alpha: 0.20
platform_inference_route_min_tool_accuracy: 0.55
platform_inference_route_min_composite: 0.15
platform_inference_route_min_calibration_samples: 60
platform_inference_route_exploration_tickets: 3
platform_inference_route_max_error_rate: 0.25
platform_inference_route_max_timeout_rate: 0.15
platform_inference_route_cooldown_seconds: 30
platform_inference_ticket_rpm: 1920
platform_inference_validator_rpm: 7680
platform_inference_global_rpm: 23040
# Exact SHA-256 of dittobench-api's reviewed aggregate v7 calibration manifest
# (sha256 over the raw embedded internal/efficiency/baselines_v7.json bytes, as
# reported by efficiency.V7CalibrationReadiness). Route admission still fails
# closed if the binary reports a different digest or logical route identity.
#
# The v7 manifest was re-derived with new baseline ids, starter-kit revision,
# allowance/raw-reference fields, and hosted-embedding metadata.
# The logical route identity is UNCHANGED
# (openrouter / openrouter-route-a471cd87ae7df5b9-v1 / openai/gpt-oss-20b).
#
# ORDERING: this value must match the dittobench-api build the VALIDATOR FLEET
# actually runs, which is pinned by DITTOBENCH_BUILD_CONTEXT in
# docker-compose.yml. Do not converge platform hosts with this value until the
# validator fleet runs the matching build, or route admission will fail closed
# against an older binary.
platform_inference_reviewed_calibration_manifest_sha256: "b8c11eff829c4c85b4b1af4f95135e4b5c26da01c8b88f72f726dca26d03d9a7"

# Platform-operated screener auth (per-env in host_vars; both empty = the
# /screener/* endpoints stay disabled and fail closed). platform_screener_hotkey
# is the dedicated no-funds SS58 the platform allowlists; secret_screener_api_token
# is the Secret Manager id of the shared bearer token.
platform_screener_hotkey: ""
secret_screener_api_token: ""
secret_platform_perplexity_key: "PERPLEXITY_API_KEY"

# Docker apt repo (Debian).
platform_docker_apt_arch: amd64
