---
# Provision a ditto-platform app VM: Docker (Pylon sidecar) + Node/pm2 (API
# launcher) on top of base (which already installed uv + Caddy), then clone the
# repo, render .env from Secret Manager, write the Caddy vhost, and first-start.
#
# Day-2 releases do NOT re-run this role — they go through the ditto-platform
# repo's deploy.yml (IAP SSH -> scripts/update.sh).

# --- Preflight: never render a placeholder into a live .env (see preflight.yml
# for the 2026-07-23 incident this guards). Must stay FIRST: it has to fail
# before anything on the host is touched.
- name: Validate env-sourced configuration before rendering anything
  ansible.builtin.import_tasks: preflight.yml

# --- gcloud (used to read secrets via the VM's attached runtime SA / ADC) ---
- name: Ensure gcloud is available (GCE Debian images normally ship it)
  ansible.builtin.command: gcloud --version
  register: platform_gcloud_check
  changed_when: false
  failed_when: false

- name: Install Google Cloud CLI if missing
  when: platform_gcloud_check.rc != 0
  block:
    - name: Add Google Cloud apt key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/cloud.google.gpg
        mode: "0644"

    # apt_repository is deprecated (removed in ansible-core 2.25). The
    # deb822_repository migration is deferred — see roles/README.md
    # "Deferred: apt_repository -> deb822_repository".
    - name: Add Google Cloud apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
        filename: google-cloud-sdk
        state: present

    - name: Install google-cloud-cli
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present
        update_cache: true

# --- Docker engine + compose plugin (for the Pylon sidecar) ---
- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker.asc
    mode: "0644"

# apt_repository is deprecated (removed in ansible-core 2.25). The
# deb822_repository migration is deferred — see roles/README.md
# "Deferred: apt_repository -> deb822_repository".
- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ platform_docker_apt_arch }} signed-by=/usr/share/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Install skopeo for Targon candidate-image promotion
  ansible.builtin.apt:
    name: skopeo
    state: present
  when: platform_targon_public_url | default('') | length > 0

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add the deploy user to the docker group
  ansible.builtin.user:
    name: "{{ platform_owner }}"
    groups: docker
    append: true

# --- Node + pm2 (the API process manager; scripts/ecosystem.config.js) ---
- name: Install Node.js + npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present

- name: Install pm2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present

# --- Python sampling profiler (operator-only, never imported by the API) ---
- name: Read installed py-spy version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/py-spy
      - --version
  register: platform_py_spy_check
  changed_when: false
  failed_when: false

- name: Install pinned py-spy as an isolated uv tool
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - tool
      - install
      - --force
      - "py-spy=={{ platform_py_spy_version }}"
  environment:
    UV_TOOL_BIN_DIR: /usr/local/bin
    UV_TOOL_DIR: "{{ platform_uv_tool_dir }}"
  when: >-
    platform_py_spy_check.rc != 0 or
    ('py-spy ' ~ platform_py_spy_version) not in platform_py_spy_check.stdout

# --- Read-only GitHub deploy key (clone/pull the private repo over SSH) ---
- name: Ensure deploy user .ssh dir
  ansible.builtin.file:
    path: "/home/{{ platform_owner }}/.ssh"
    state: directory
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0700"

- name: Fetch GitHub deploy key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_github_deploy_key }} --project={{ gcp_project }}"
  register: platform_deploy_key
  changed_when: false
  no_log: true

- name: Write GitHub deploy key
  ansible.builtin.copy:
    content: "{{ platform_deploy_key.stdout }}\n"
    dest: "/home/{{ platform_owner }}/.ssh/id_ed25519"
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0600"
  no_log: true

- name: Trust github.com host key
  ansible.builtin.known_hosts:
    path: "/home/{{ platform_owner }}/.ssh/known_hosts"
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
    state: present
  become_user: "{{ platform_owner }}"

# --- Clone / update the repo at the env's branch ---
- name: Ensure monorepo checkout root dir
  ansible.builtin.file:
    path: "{{ platform_checkout_root }}"
    state: directory
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0755"

- name: Clone/checkout ditto-subnet at the env branch
  ansible.builtin.git:
    repo: "{{ platform_repo_url }}"
    dest: "{{ platform_checkout_root }}"
    version: "{{ platform_branch }}"
    accept_hostkey: true
    # Don't clobber working-tree changes a deploy may have made; update.sh owns pulls.
    update: true
    force: false
  become_user: "{{ platform_owner }}"
  environment:
    GIT_SSH_COMMAND: "ssh -i /home/{{ platform_owner }}/.ssh/id_ed25519 -o IdentitiesOnly=yes"

# --- Render apps/platform/.env from Secret Manager + host/group vars ---
- name: Read app secrets from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ item.secret }} --project={{ gcp_project }}"
  register: platform_secret_reads
  changed_when: false
  no_log: true
  loop:
    - { key: db_password, secret: "{{ secret_db_password }}" }
    - { key: hmac_secret, secret: "{{ secret_hmac_secret }}" }
    - { key: pylon_token, secret: "{{ secret_pylon_token }}" }
    - { key: admin_api_token, secret: "{{ secret_admin_api_token }}" }
  loop_control:
    label: "{{ item.key }}"

- name: Assemble secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ dict(platform_secret_reads.results | map(attribute='item.key') | zip(platform_secret_reads.results | map(attribute='stdout'))) }}"
  no_log: true

- name: Read platform OpenRouter key when a Platform inference lane is enabled
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_platform_openrouter_key }} --project={{ gcp_project }}"
  register: platform_openrouter_read
  changed_when: false
  no_log: true
  when: >-
    platform_inference_proxy_enabled | bool or
    platform_coding_shadow_enabled | bool

- name: Fold the platform OpenRouter key into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'openrouter_api_key': platform_openrouter_read.stdout}) }}"
  no_log: true
  when: >-
    platform_inference_proxy_enabled | bool or
    platform_coding_shadow_enabled | bool

- name: Read platform Perplexity key when ticket inference is enabled
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_platform_perplexity_key }} --project={{ gcp_project }}"
  register: platform_perplexity_read
  changed_when: false
  no_log: true
  when: platform_inference_proxy_enabled | bool

- name: Fold the platform Perplexity key into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'perplexity_api_key': platform_perplexity_read.stdout}) }}"
  no_log: true
  when: platform_inference_proxy_enabled | bool

# The screener token is optional (only where a screener is allowlisted), so it is
# read + folded in separately rather than in the required-secrets loop above.
- name: Read screener API token from Secret Manager (when a screener is configured)
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_screener_api_token }} --project={{ gcp_project }}"
  register: platform_screener_token_read
  changed_when: false
  no_log: true
  when: platform_screener_hotkey | length > 0

- name: Fold the screener token into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'screener_api_token': platform_screener_token_read.stdout}) }}"
  no_log: true
  when: platform_screener_hotkey | length > 0

- name: Read screener capacity-controller token from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_screener_controller_api_token }} --project={{ gcp_project }}"
  register: platform_screener_controller_token_read
  changed_when: false
  no_log: true
  when: secret_screener_controller_api_token | length > 0

- name: Fold the capacity-controller token into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'screener_controller_api_token': platform_screener_controller_token_read.stdout}) }}"
  no_log: true
  when: secret_screener_controller_api_token | length > 0

- name: Read Targon API key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_targon_api_key }} --project={{ gcp_project }}"
  register: platform_targon_api_key_read
  changed_when: false
  no_log: true
  when: platform_targon_public_url | default('') | length > 0

- name: Fold the Targon API key into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'targon_api_key': platform_targon_api_key_read.stdout}) }}"
  no_log: true
  when: platform_targon_public_url | default('') | length > 0

- name: Read Hippius access key id when miner avatars are configured
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_hippius_access_key_id }} --project={{ gcp_project }}"
  register: platform_hippius_access_key_read
  changed_when: false
  no_log: true
  when: platform_hippius_bucket | default('') | length > 0

- name: Read Hippius secret access key when miner avatars are configured
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_hippius_secret_access_key }} --project={{ gcp_project }}"
  register: platform_hippius_secret_key_read
  changed_when: false
  no_log: true
  when: platform_hippius_bucket | default('') | length > 0

- name: Fold Hippius credentials into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'hippius_access_key_id': platform_hippius_access_key_read.stdout, 'hippius_secret_access_key': platform_hippius_secret_key_read.stdout}) }}"
  no_log: true
  when: platform_hippius_bucket | default('') | length > 0

- name: Read Backblaze key id when the trace mirror is configured
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_backblaze_key_id }} --project={{ gcp_project }}"
  register: platform_backblaze_key_id_read
  changed_when: false
  no_log: true
  when: platform_trace_enabled | bool and platform_trace_backblaze_bucket | default('') | length > 0

- name: Read Backblaze application key when the trace mirror is configured
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_backblaze_application_key }} --project={{ gcp_project }}"
  register: platform_backblaze_application_key_read
  changed_when: false
  no_log: true
  when: platform_trace_enabled | bool and platform_trace_backblaze_bucket | default('') | length > 0

- name: Fold Backblaze credentials into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'backblaze_key_id': platform_backblaze_key_id_read.stdout, 'backblaze_application_key': platform_backblaze_application_key_read.stdout}) }}"
  no_log: true
  when: platform_trace_enabled | bool and platform_trace_backblaze_bucket | default('') | length > 0

- name: Ensure the relay trace spool directory
  ansible.builtin.file:
    path: "{{ platform_trace_spool_dir }}"
    state: directory
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0750"
  when: platform_trace_enabled | bool

- name: Validate private coding catalog activation
  ansible.builtin.assert:
    that:
      - platform_coding_catalog_bucket | default('') | length > 0
      - platform_coding_catalog_endpoint | default('') | length > 0
      - platform_coding_catalog_region | default('') | length > 0
      - platform_coding_catalog_bucket != platform_bucket
      - platform_coding_catalog_bucket != (platform_hippius_bucket | default(''))
      - secret_coding_catalog_access_key != secret_hmac_secret
      - secret_coding_catalog_secret_key != secret_hmac_secret
      - secret_coding_catalog_access_key != secret_hippius_access_key_id
      - secret_coding_catalog_access_key != secret_hippius_secret_access_key
      - secret_coding_catalog_secret_key != secret_hippius_access_key_id
      - secret_coding_catalog_secret_key != secret_hippius_secret_access_key
      - secret_coding_catalog_access_key != secret_coding_catalog_secret_key
      - platform_coding_catalog_max_record_bytes | int >= 4096
      - platform_coding_catalog_max_record_bytes | int <= 2097152
      - platform_coding_catalog_timeout_seconds | float >= 0.1
      - platform_coding_catalog_timeout_seconds | float <= 60
    fail_msg: >-
      Private coding catalog activation requires a dedicated bucket, endpoint,
      region, distinct Secret Manager identities, and bounded record/timeout
      limits. Do not reuse upload or avatar storage credentials.
  when: platform_coding_catalog_enabled | bool

- name: Read private coding catalog access key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_coding_catalog_access_key }} --project={{ gcp_project }}"
  register: platform_coding_catalog_access_key_read
  changed_when: false
  no_log: true
  when: platform_coding_catalog_enabled | bool

- name: Read private coding catalog secret key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_coding_catalog_secret_key }} --project={{ gcp_project }}"
  register: platform_coding_catalog_secret_key_read
  changed_when: false
  no_log: true
  when: platform_coding_catalog_enabled | bool

- name: Validate private coding catalog credentials
  ansible.builtin.assert:
    that:
      - platform_coding_catalog_access_key_read.stdout | default('') | length > 0
      - platform_coding_catalog_secret_key_read.stdout | default('') | length > 0
      - platform_coding_catalog_access_key_read.stdout != platform_coding_catalog_secret_key_read.stdout
      - platform_coding_catalog_access_key_read.stdout != (platform_secrets.hmac_secret | default(''))
      - platform_coding_catalog_secret_key_read.stdout != (platform_secrets.hmac_secret | default(''))
      - platform_coding_catalog_access_key_read.stdout != (platform_secrets.hippius_access_key_id | default(''))
      - platform_coding_catalog_access_key_read.stdout != (platform_secrets.hippius_secret_access_key | default(''))
      - platform_coding_catalog_secret_key_read.stdout != (platform_secrets.hippius_access_key_id | default(''))
      - platform_coding_catalog_secret_key_read.stdout != (platform_secrets.hippius_secret_access_key | default(''))
    fail_msg: >-
      Private coding catalog credentials must be nonempty and distinct from
      upload HMAC and avatar Hippius credentials.
  when: platform_coding_catalog_enabled | bool
  no_log: true

- name: Fold private coding catalog credentials into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'coding_catalog_access_key': platform_coding_catalog_access_key_read.stdout, 'coding_catalog_secret_key': platform_coding_catalog_secret_key_read.stdout}) }}"
  no_log: true
  when: platform_coding_catalog_enabled | bool

- name: Inspect the locked shadow coding inference policy
  ansible.builtin.stat:
    path: "{{ platform_coding_shadow_inference_policy_file }}"
    checksum_algorithm: sha256
  register: platform_coding_shadow_policy
  changed_when: false
  when: platform_coding_shadow_enabled | bool

- name: Validate shadow coding transport activation
  ansible.builtin.assert:
    that:
      - platform_inference_relay_ports | sort == [8010, 8011]
      - platform_coding_shadow_policy.stat.exists
      - not platform_coding_shadow_policy.stat.isdir
      - >-
        platform_coding_shadow_policy.stat.checksum ==
        platform_coding_shadow_inference_policy_sha256
      - >-
        platform_coding_shadow_inference_exchange_url is match(
        '^https://[^/@?#:]+(?::443)?/api/v1/validator/coding-shadow/inference-exchange$')
      - >-
        platform_coding_shadow_inference_proxy_url is match(
        '^https://[^/@?#:]+(?::443)?/api/v1/inference/coding/chat/completions$')
      - >-
        platform_coding_shadow_inference_revoke_url is match(
        '^https://[^/@?#:]+(?::443)?/api/v1/validator/coding-shadow/inference-revoke-capability$')
      - platform_secrets.openrouter_api_key | default('') | length >= 32
    fail_msg: >-
      Shadow coding transport requires a deployed relay pool, the exact locked
      policy bytes from this checkout, the three reviewed HTTPS URLs, and the
      server-only OpenRouter credential. Leave platform_coding_shadow_enabled
      false until the whole profile has been reviewed.
  when: platform_coding_shadow_enabled | bool
  no_log: true

- name: Validate shadow coding admin controls
  ansible.builtin.assert:
    that:
      - >-
        platform_coding_shadow_selection_delay_blocks | int >= 1 and
        platform_coding_shadow_selection_delay_blocks | int <= 10000
      - >-
        platform_coding_shadow_ticket_lease_seconds | int >= 60 and
        platform_coding_shadow_ticket_lease_seconds | int <= 7200
      - >-
        not (platform_coding_shadow_reconciliation_enabled | bool) or
        (platform_coding_catalog_enabled | bool)
      - >-
        not (
          platform_coding_shadow_reconciliation_enabled | bool or
          platform_coding_shadow_ticket_set_enabled | bool
        ) or platform_secrets.admin_api_token | default('') | length >= 32
    fail_msg: >-
      Shadow coding reconciliation requires the separate private catalog; both
      reconciliation and ticket-set issuance require a valid admin token. Keep
      their switches false until one named shadow run is approved.
  no_log: true
- name: Validate Hippius Coding evidence custody activation
  ansible.builtin.assert:
    that:
      - platform_coding_hippius_evidence_bucket | default('') | length > 0
      - platform_coding_hippius_endpoint == 'https://s3.hippius.com'
      - platform_coding_hippius_region == 'decentralized'
      - platform_coding_hippius_evidence_bucket != platform_bucket
      - platform_coding_hippius_evidence_bucket != (platform_hippius_bucket | default(''))
      - platform_coding_hippius_evidence_bucket != (platform_coding_catalog_bucket | default(''))
      - platform_coding_hippius_evidence_timeout_seconds | float >= 1
      - platform_coding_hippius_evidence_timeout_seconds | float <= 60
      - secret_coding_hippius_evidence_access_key != secret_hmac_secret
      - secret_coding_hippius_evidence_secret_key != secret_hmac_secret
      - secret_coding_hippius_evidence_access_key != secret_hippius_access_key_id
      - secret_coding_hippius_evidence_secret_key != secret_hippius_secret_access_key
      - secret_coding_hippius_evidence_access_key != secret_coding_catalog_access_key
      - secret_coding_hippius_evidence_secret_key != secret_coding_catalog_secret_key
      - secret_coding_hippius_evidence_access_key != secret_coding_hippius_evidence_secret_key
    fail_msg: >-
      Hippius Coding evidence custody requires its dedicated private bucket,
      exact provider origin/region, bounded timeout, and distinct Secret Manager
      identities. It may not reuse upload, avatar, trace, or catalog authority.
  when: platform_coding_hippius_evidence_enabled | bool

- name: Read Hippius Coding evidence access key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_coding_hippius_evidence_access_key }} --project={{ gcp_project }}"
  register: platform_coding_hippius_evidence_access_key_read
  changed_when: false
  no_log: true
  when: platform_coding_hippius_evidence_enabled | bool

- name: Read Hippius Coding evidence secret key from Secret Manager
  ansible.builtin.command: "gcloud secrets versions access latest --secret={{ secret_coding_hippius_evidence_secret_key }} --project={{ gcp_project }}"
  register: platform_coding_hippius_evidence_secret_key_read
  changed_when: false
  no_log: true
  when: platform_coding_hippius_evidence_enabled | bool

- name: Validate Hippius Coding evidence credentials
  ansible.builtin.assert:
    that:
      - platform_coding_hippius_evidence_access_key_read.stdout | default('') | regex_search('^hip_')
      - platform_coding_hippius_evidence_secret_key_read.stdout | default('') | length > 0
      - platform_coding_hippius_evidence_access_key_read.stdout != platform_coding_hippius_evidence_secret_key_read.stdout
      - platform_coding_hippius_evidence_access_key_read.stdout != (platform_secrets.hmac_secret | default(''))
      - platform_coding_hippius_evidence_secret_key_read.stdout != (platform_secrets.hmac_secret | default(''))
      - platform_coding_hippius_evidence_access_key_read.stdout != (platform_secrets.hippius_access_key_id | default(''))
      - platform_coding_hippius_evidence_secret_key_read.stdout != (platform_secrets.hippius_secret_access_key | default(''))
      - platform_coding_hippius_evidence_access_key_read.stdout != (platform_secrets.coding_catalog_access_key | default(''))
      - platform_coding_hippius_evidence_secret_key_read.stdout != (platform_secrets.coding_catalog_secret_key | default(''))
    fail_msg: >-
      Hippius Coding evidence credentials must be nonempty, provider-shaped,
      and distinct from upload, avatar, trace, and private-catalog credentials.
  when: platform_coding_hippius_evidence_enabled | bool
  no_log: true

- name: Verify protected Hippius Coding evidence authority files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_coding_hippius_probe_receipt_path }}"
    - "{{ platform_coding_hippius_evidence_wrapping_public_key_path }}"
  register: platform_coding_hippius_authority_files
  when: platform_coding_hippius_evidence_enabled | bool

- name: Validate protected Hippius Coding evidence authority files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.pw_name == platform_owner
      - item.stat.mode in ['0400', '0600']
    fail_msg: >-
      Hippius probe receipt and evidence wrapping public key must be existing
      regular files owned by the Platform user with mode 0400 or 0600.
  loop: "{{ platform_coding_hippius_authority_files.results }}"
  when: platform_coding_hippius_evidence_enabled | bool

- name: Ensure protected Hippius Coding evidence spool
  ansible.builtin.file:
    path: "{{ platform_coding_hippius_evidence_spool_root }}"
    state: directory
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0700"
  when: platform_coding_hippius_evidence_enabled | bool

- name: Fold Hippius Coding evidence credentials into the secrets map
  ansible.builtin.set_fact:
    platform_secrets: "{{ platform_secrets | combine({'coding_hippius_evidence_access_key': platform_coding_hippius_evidence_access_key_read.stdout, 'coding_hippius_evidence_secret_key': platform_coding_hippius_evidence_secret_key_read.stdout}) }}"
  no_log: true
  when: platform_coding_hippius_evidence_enabled | bool

- name: Ensure isolated Hippius canary unwrap service group
  ansible.builtin.group:
    name: "{{ platform_coding_hippius_canary_unwrap_group }}"
    system: true
    state: present
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Ensure isolated Hippius canary unwrap service user
  ansible.builtin.user:
    name: "{{ platform_coding_hippius_canary_unwrap_user }}"
    group: "{{ platform_coding_hippius_canary_unwrap_group }}"
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    system: true
    state: present
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Resolve isolated Hippius canary unwrap uid
  ansible.builtin.command:
    argv: [id, -u, "{{ platform_coding_hippius_canary_unwrap_user }}"]
  register: platform_coding_hippius_canary_unwrap_uid_lookup
  changed_when: false
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Resolve isolated Hippius canary unwrap gid
  ansible.builtin.command:
    argv: [id, -g, "{{ platform_coding_hippius_canary_unwrap_user }}"]
  register: platform_coding_hippius_canary_unwrap_gid_lookup
  changed_when: false
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Bind helper peer identity to the installed unwrap service
  ansible.builtin.set_fact:
    platform_coding_hippius_canary_unwrap_uid: "{{ platform_coding_hippius_canary_unwrap_uid_lookup.stdout }}"
    platform_coding_hippius_canary_unwrap_gid: "{{ platform_coding_hippius_canary_unwrap_gid_lookup.stdout }}"
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Resolve Platform owner uid for Hippius canary helper isolation
  ansible.builtin.command:
    argv: [id, -u, "{{ platform_owner }}"]
  register: platform_coding_hippius_canary_owner_lookup
  changed_when: false
  when: >-
    platform_coding_hippius_canary_helpers_enabled | bool or
    platform_coding_hippius_canary_unwrap_installed | bool

- name: Resolve Platform owner primary gid for Hippius canary unwrap peer checks
  ansible.builtin.command:
    argv: [id, -g, "{{ platform_owner }}"]
  register: platform_coding_hippius_canary_owner_primary_gid
  changed_when: false
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Resolve Platform group gid for Hippius canary helper sockets
  ansible.builtin.command:
    argv: [getent, group, "{{ platform_group }}"]
  register: platform_coding_hippius_canary_group_record
  changed_when: false
  when: >-
    platform_coding_hippius_canary_helpers_enabled | bool or
    platform_coding_hippius_canary_unwrap_installed | bool

- name: Extract Platform group gid for Hippius canary helper sockets
  ansible.builtin.set_fact:
    platform_coding_hippius_canary_group_gid: "{{ platform_coding_hippius_canary_group_record.stdout.split(':')[2] }}"
  when: >-
    platform_coding_hippius_canary_helpers_enabled | bool or
    platform_coding_hippius_canary_unwrap_installed | bool

- name: Validate isolated Hippius canary unwrap installation
  ansible.builtin.assert:
    that:
      - platform_coding_hippius_canary_unwrap_user != platform_owner
      - platform_coding_hippius_canary_unwrap_group != platform_group
      - platform_coding_hippius_canary_unwrap_socket.startswith('/run/')
      - platform_coding_hippius_canary_unwrap_authority_path.startswith('/')
      - platform_coding_hippius_canary_unwrap_private_key_path.startswith('/')
      - platform_coding_hippius_canary_unwrap_service_path.startswith('/')
      - platform_coding_hippius_canary_unwrap_service_env_path.startswith('/')
      - platform_coding_hippius_canary_unwrap_openssl_path == '/usr/bin/openssl'
      - platform_coding_hippius_canary_unwrap_socket_timeout_seconds | int >= 1
      - platform_coding_hippius_canary_unwrap_socket_timeout_seconds | int <= 300
      - not (platform_coding_hippius_canary_unwrap_service_enabled | bool) or (platform_coding_hippius_canary_unwrap_installed | bool)
    fail_msg: >-
      The canary unwrap package requires a dedicated user/group, absolute
      protected paths, the fixed root-owned OpenSSL binary, and bounded socket
      timeouts. Service activation cannot precede installation.
  when: >-
    platform_coding_hippius_canary_unwrap_installed | bool or
    platform_coding_hippius_canary_unwrap_service_enabled | bool

- name: Ensure isolated Hippius canary unwrap installation directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ platform_coding_hippius_canary_install_root }}", owner: root, group: "{{ platform_group }}", mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_install_root }}/backend", owner: root, group: "{{ platform_coding_hippius_canary_unwrap_group }}", mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_config_root }}", owner: root, group: "{{ platform_group }}", mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_config_root }}/unwrap-service", owner: root, group: "{{ platform_coding_hippius_canary_unwrap_group }}", mode: "0750" }
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Install isolated Hippius canary unwrap service executable
  ansible.builtin.copy:
    src: "{{ platform_root }}/scripts/hippius_canary_unwrap_service.py"
    dest: "{{ platform_coding_hippius_canary_unwrap_service_path }}"
    remote_src: true
    owner: root
    group: "{{ platform_coding_hippius_canary_unwrap_group }}"
    mode: "0555"
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Render isolated Hippius canary unwrap service environment
  ansible.builtin.template:
    src: hippius-canary-unwrap-service.env.j2
    dest: "{{ platform_coding_hippius_canary_unwrap_service_env_path }}"
    owner: root
    group: "{{ platform_coding_hippius_canary_unwrap_group }}"
    mode: "0440"
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Install isolated Hippius canary unwrap systemd service
  ansible.builtin.template:
    src: ditto-hippius-canary-unwrap.service.j2
    dest: /etc/systemd/system/ditto-hippius-canary-unwrap.service
    owner: root
    group: root
    mode: "0644"
  register: platform_coding_hippius_canary_unwrap_service_unit
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Install isolated Hippius canary unwrap systemd socket
  ansible.builtin.template:
    src: ditto-hippius-canary-unwrap.socket.j2
    dest: /etc/systemd/system/ditto-hippius-canary-unwrap.socket
    owner: root
    group: root
    mode: "0644"
  register: platform_coding_hippius_canary_unwrap_socket_unit
  when: platform_coding_hippius_canary_unwrap_installed | bool

- name: Reload systemd for isolated Hippius canary unwrap units
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    platform_coding_hippius_canary_unwrap_installed | bool and
    (platform_coding_hippius_canary_unwrap_service_unit.changed or
    platform_coding_hippius_canary_unwrap_socket_unit.changed)

- name: Inspect isolated Hippius canary unwrap key and authority
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_coding_hippius_canary_unwrap_private_key_path }}"
    - "{{ platform_coding_hippius_canary_unwrap_authority_path }}"
  register: platform_coding_hippius_canary_unwrap_private_files
  when: platform_coding_hippius_canary_unwrap_service_enabled | bool

- name: Validate isolated Hippius canary unwrap key and authority
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.pw_name == platform_coding_hippius_canary_unwrap_user
      - item.stat.gr_name == platform_coding_hippius_canary_unwrap_group
      - item.stat.mode == '0400'
      - item.stat.nlink == 1
    fail_msg: >-
      The canary unwrap authority and private key must be existing single-link
      mode-0400 files owned only by the isolated unwrap identity.
  loop: "{{ platform_coding_hippius_canary_unwrap_private_files.results }}"
  no_log: true
  when: platform_coding_hippius_canary_unwrap_service_enabled | bool

- name: Enable isolated Hippius canary unwrap socket
  ansible.builtin.systemd:
    name: ditto-hippius-canary-unwrap.socket
    enabled: true
    state: started
  when: platform_coding_hippius_canary_unwrap_service_enabled | bool

- name: Disable isolated Hippius canary unwrap socket
  ansible.builtin.systemd:
    name: ditto-hippius-canary-unwrap.socket
    enabled: false
    state: stopped
  when: >-
    platform_coding_hippius_canary_unwrap_installed | bool and
    not (platform_coding_hippius_canary_unwrap_service_enabled | bool)

- name: Disable isolated Hippius canary unwrap service
  ansible.builtin.systemd:
    name: ditto-hippius-canary-unwrap.service
    enabled: false
    state: stopped
  when: >-
    platform_coding_hippius_canary_unwrap_installed | bool and
    not (platform_coding_hippius_canary_unwrap_service_enabled | bool)

- name: Validate Hippius canary helper activation
  ansible.builtin.assert:
    that:
      - platform_coding_catalog_enabled | bool
      - platform_coding_hippius_evidence_enabled | bool
      - platform_coding_hippius_canary_unwrap_service_enabled | bool
      - platform_coding_hippius_private_input_curator_access_key.startswith('hip_')
      - platform_coding_hippius_private_input_curator_access_key != platform_secrets.coding_catalog_access_key
      - platform_coding_hippius_canary_helper_timeout_seconds | int >= 1
      - platform_coding_hippius_canary_helper_timeout_seconds | int <= 7200
      - platform_coding_hippius_canary_install_root.startswith('/')
      - platform_coding_hippius_canary_config_root == '/etc/ditto-platform/coding/hippius-canary'
      - platform_coding_hippius_canary_work_root.startswith('/')
      - platform_coding_hippius_canary_operator_env_path.startswith('/')
      - platform_coding_hippius_canary_install_root != platform_coding_hippius_canary_config_root
      - platform_coding_hippius_canary_install_root != platform_coding_hippius_canary_work_root
      - platform_coding_hippius_canary_config_root != platform_coding_hippius_canary_work_root
      - platform_coding_hippius_canary_plan_path.startswith('/')
      - platform_coding_hippius_canary_deployed_source_path.startswith('/')
      - platform_coding_hippius_private_input_manifest_path.startswith('/')
      - platform_coding_hippius_private_input_publication_receipt_path.startswith('/')
      - platform_coding_hippius_curator_public_key_path.startswith('/')
      - platform_coding_hippius_canary_unwrap_socket.startswith('/run/')
      - platform_coding_hippius_canary_authoring_socket.startswith('/run/')
      - platform_coding_hippius_canary_grading_socket.startswith('/run/')
      - platform_coding_hippius_canary_unwrap_socket != platform_coding_hippius_canary_authoring_socket
      - platform_coding_hippius_canary_unwrap_socket != platform_coding_hippius_canary_grading_socket
      - platform_coding_hippius_canary_authoring_socket != platform_coding_hippius_canary_grading_socket
      - platform_coding_hippius_canary_unwrap_uid | int > 0
      - platform_coding_hippius_canary_authoring_uid | int > 0
      - platform_coding_hippius_canary_grading_uid | int > 0
      - platform_coding_hippius_canary_unwrap_gid | int > 0
      - platform_coding_hippius_canary_authoring_gid | int > 0
      - platform_coding_hippius_canary_grading_gid | int > 0
      - platform_coding_hippius_canary_unwrap_gid | int != platform_coding_hippius_canary_group_gid | int
      - platform_coding_hippius_canary_authoring_gid | int != platform_coding_hippius_canary_group_gid | int
      - platform_coding_hippius_canary_grading_gid | int != platform_coding_hippius_canary_group_gid | int
      - platform_coding_hippius_canary_unwrap_gid | int != platform_coding_hippius_canary_authoring_gid | int
      - platform_coding_hippius_canary_unwrap_gid | int != platform_coding_hippius_canary_grading_gid | int
      - platform_coding_hippius_canary_authoring_gid | int != platform_coding_hippius_canary_grading_gid | int
      - platform_coding_hippius_canary_unwrap_uid | int != platform_coding_hippius_canary_authoring_uid | int
      - platform_coding_hippius_canary_unwrap_uid | int != platform_coding_hippius_canary_grading_uid | int
      - platform_coding_hippius_canary_authoring_uid | int != platform_coding_hippius_canary_grading_uid | int
      - platform_coding_hippius_canary_unwrap_uid | int != platform_coding_hippius_canary_owner_lookup.stdout | int
      - platform_coding_hippius_canary_authoring_uid | int != platform_coding_hippius_canary_owner_lookup.stdout | int
      - platform_coding_hippius_canary_grading_uid | int != platform_coding_hippius_canary_owner_lookup.stdout | int
    fail_msg: >-
      Hippius canary helpers require enabled private-input/evidence boundaries,
      one distinct curator identity, three absolute /run sockets, three backend
      service UIDs distinct from Platform and each other, and bounded paths and
      timeouts.
  no_log: true
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Inspect Hippius canary proxy source
  ansible.builtin.stat:
    path: "{{ platform_root }}/scripts/hippius_canary_helper_proxy.py"
  register: platform_coding_hippius_canary_proxy_source
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Validate Hippius canary proxy source
  ansible.builtin.assert:
    that:
      - platform_coding_hippius_canary_proxy_source.stat.exists
      - platform_coding_hippius_canary_proxy_source.stat.isreg
      - platform_coding_hippius_canary_proxy_source.stat.pw_name == platform_owner
      - platform_coding_hippius_canary_proxy_source.stat.mode == '0644'
    fail_msg: >-
      The checked-out canary proxy must be a regular Platform-owned mode-0644
      source file before root-owned installation.
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Inspect protected Hippius canary authority files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_coding_hippius_canary_plan_path }}"
    - "{{ platform_coding_hippius_canary_deployed_source_path }}"
    - "{{ platform_coding_hippius_private_input_manifest_path }}"
    - "{{ platform_coding_hippius_private_input_publication_receipt_path }}"
    - "{{ platform_coding_hippius_curator_public_key_path }}"
  register: platform_coding_hippius_canary_authority_files
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Validate protected Hippius canary source and authority files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.pw_name == platform_owner
      - item.stat.mode in ['0400', '0600']
    fail_msg: >-
      Every canary authority file must be regular, Platform-owned, and mode
      0400 or 0600.
  loop: "{{ platform_coding_hippius_canary_authority_files.results }}"
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Inspect Hippius canary backend sockets
  ansible.builtin.stat:
    path: "{{ item.socket }}"
  loop:
    - { role: unwrap, socket: "{{ platform_coding_hippius_canary_unwrap_socket }}", uid: "{{ platform_coding_hippius_canary_unwrap_uid }}" }
    - { role: authoring, socket: "{{ platform_coding_hippius_canary_authoring_socket }}", uid: "{{ platform_coding_hippius_canary_authoring_uid }}" }
    - { role: grading, socket: "{{ platform_coding_hippius_canary_grading_socket }}", uid: "{{ platform_coding_hippius_canary_grading_uid }}" }
  register: platform_coding_hippius_canary_sockets
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Validate Hippius canary backend socket authorities
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.issock
      - item.stat.uid | int == item.item.uid | int
      - item.stat.gid | int == platform_coding_hippius_canary_group_gid | int
      - item.stat.mode == '0660'
    fail_msg: >-
      Each canary backend must expose one mode-0660 Unix socket owned by its
      configured service UID and the Platform group.
  loop: "{{ platform_coding_hippius_canary_sockets.results }}"
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Ensure Hippius canary helper installation directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ platform_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ platform_coding_hippius_canary_install_root }}", owner: root, mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_install_root }}/bin", owner: root, mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_config_root }}", owner: root, mode: "0750" }
    - { path: "{{ platform_coding_hippius_canary_work_root }}", owner: "{{ platform_owner }}", mode: "0700" }
    - { path: "{{ platform_coding_hippius_canary_work_root }}/unwrap", owner: "{{ platform_owner }}", mode: "0700" }
    - { path: "{{ platform_coding_hippius_canary_work_root }}/authoring", owner: "{{ platform_owner }}", mode: "0700" }
    - { path: "{{ platform_coding_hippius_canary_work_root }}/grading", owner: "{{ platform_owner }}", mode: "0700" }
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Install distinct root-owned Hippius canary helper proxies
  ansible.builtin.copy:
    src: "{{ platform_root }}/scripts/hippius_canary_helper_proxy.py"
    dest: "{{ platform_coding_hippius_canary_install_root }}/bin/hippius-canary-{{ item }}"
    remote_src: true
    owner: root
    group: "{{ platform_group }}"
    mode: "0550"
  loop: [unwrap, authoring, grading]
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Render Hippius canary helper proxy configurations
  ansible.builtin.template:
    src: coding-hippius-canary-helper.json.j2
    dest: "{{ platform_coding_hippius_canary_config_root }}/{{ item.role }}.json"
    owner: root
    group: "{{ platform_group }}"
    mode: "0440"
  loop:
    - { role: unwrap, socket: "{{ platform_coding_hippius_canary_unwrap_socket }}", uid: "{{ platform_coding_hippius_canary_unwrap_uid }}", gid: "{{ platform_coding_hippius_canary_unwrap_gid }}", request_bytes: 65536, response_bytes: 65536 }
    - { role: authoring, socket: "{{ platform_coding_hippius_canary_authoring_socket }}", uid: "{{ platform_coding_hippius_canary_authoring_uid }}", gid: "{{ platform_coding_hippius_canary_authoring_gid }}", request_bytes: 16777216, response_bytes: 25165824 }
    - { role: grading, socket: "{{ platform_coding_hippius_canary_grading_socket }}", uid: "{{ platform_coding_hippius_canary_grading_uid }}", gid: "{{ platform_coding_hippius_canary_grading_gid }}", request_bytes: 16777216, response_bytes: 25165824 }
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Render protected Hippius canary operator environment
  ansible.builtin.template:
    src: coding-hippius-canary-operator.env.j2
    dest: "{{ platform_coding_hippius_canary_operator_env_path }}"
    owner: root
    group: "{{ platform_group }}"
    mode: "0440"
  no_log: true
  when: platform_coding_hippius_canary_helpers_enabled | bool

- name: Remove disabled Hippius canary helper entry points
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ platform_coding_hippius_canary_operator_env_path }}"
    - "{{ platform_coding_hippius_canary_config_root }}/unwrap.json"
    - "{{ platform_coding_hippius_canary_config_root }}/authoring.json"
    - "{{ platform_coding_hippius_canary_config_root }}/grading.json"
    - "{{ platform_coding_hippius_canary_install_root }}/bin/hippius-canary-unwrap"
    - "{{ platform_coding_hippius_canary_install_root }}/bin/hippius-canary-authoring"
    - "{{ platform_coding_hippius_canary_install_root }}/bin/hippius-canary-grading"
  when: not (platform_coding_hippius_canary_helpers_enabled | bool)

- name: Render .env
  ansible.builtin.template:
    src: platform.env.j2
    dest: "{{ platform_root }}/.env"
    owner: "{{ platform_owner }}"
    group: "{{ platform_group }}"
    mode: "0640"
  no_log: true

# Postflight backstop for the whole placeholder class, including variables
# nobody thought to register in platform_required_env_values.
- name: Guard the rendered .env against unresolved placeholders
  ansible.builtin.include_role:
    name: env_render_guard
  vars:
    env_render_guard_path: "{{ platform_root }}/.env"
    env_render_guard_label: "{{ platform_root }}/.env on {{ inventory_hostname }}"
    env_render_guard_hint: >-
      Export the Terraform-derived values first:
      `source infra/ansible/scripts/platform-app-env.sh`
      (see infra/ansible/playbooks/gcp-platform-app.yml for the full invocation).

# What got turned off by an empty optional value, restated at the end of the run
# so it is not buried under 50 ok= lines (this is how silently-disabled dataset
# pinning went unnoticed on 2026-07-23).
- name: Report integrations rendered as DISABLED
  ansible.builtin.debug:
    msg: >-
      .env rendered, but these optional integrations are DISABLED on
      {{ inventory_hostname }} (their PLATFORM_* env vars were empty):
      {{ platform_disabled_integrations | join(', ') }}.
      See the WARNING earlier in this run for what each one turns off.
  when: platform_disabled_integrations | default([]) | length > 0

# --- Caddy vhost (base installed the binary; we own this VM's Caddyfile) ---
# A caddy-owned log dir so Caddy can both write AND roll (create new files). The
# shared /opt/ditto/logs is deploy:ditto and not caddy-writable.
- name: Ensure caddy log directory exists
  ansible.builtin.file:
    path: /opt/ditto/logs/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

- name: Write Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
  notify: reload caddy

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started

# NOTE: this role does NOT start the app. The app needs DITTO_UPLOAD_PAYMENT_ADDRESS
# (injected from the ditto-platform GitHub environment into a separate
# deploy-owned .env.deploy file). That first deploy brings up Pylon,
# migrates, and pm2-starts. We only install the pm2 boot unit here so that once
# the deploy has `pm2 save`d, the app resurrects across reboots.
- name: Generate pm2 systemd startup unit (survive reboots)
  ansible.builtin.command: "pm2 startup systemd -u {{ platform_owner }} --hp /home/{{ platform_owner }}"
  register: platform_pm2_startup
  changed_when: "'already' not in platform_pm2_startup.stdout | lower"
