---
# Imported from tasks/main.yml when platform_api_service_identity_enabled, right
# after the hosted signer guard and before any task that sets ownership to
# ditto-api (the Hippius evidence authority files and spool, the environment
# copy). tasks/api_service_identity.yml installs everything else.
#
# `ditto-api` runs the API and alone may read the control-signer seed;
# `ditto-api-build` builds release environments and reads no secret. Both are
# system users with no login, no sudo and no supplementary group.

- name: Require distinct deploy and dedicated accounts before creating them
  ansible.builtin.assert:
    that:
      - platform_owner is match('^[a-z_][a-z0-9_-]*$')
      - platform_owner not in ['root', 'ditto-api', 'ditto-api-build']
      - platform_api_process_user == 'ditto-api'
    fail_msg: >-
      The deploy user must be a non-root account distinct from ditto-api and
      ditto-api-build.
    quiet: true

- name: Ensure the dedicated service groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - ditto-api
    - ditto-api-build

- name: Ensure the locked-down ditto-api and ditto-api-build users
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    # Exactly no supplementary group: not docker, ditto, sudo, adm or
    # systemd-journal.
    groups: []
    append: false
    system: true
    shell: /usr/sbin/nologin
    home: "{{ item.home }}"
    create_home: false
    password: "!"
    comment: "{{ item.comment }}"
    state: present
  loop:
    - name: ditto-api
      home: /var/lib/ditto-platform-api
      comment: Ditto Platform API (hosted control signer)
    - name: ditto-api-build
      home: /var/lib/ditto-platform-api-build
      comment: Ditto Platform API release builder
  loop_control:
    label: "{{ item.name }}"

- name: Read group membership for the dedicated users
  ansible.builtin.getent:
    database: group

- name: Refuse privileged group membership for the dedicated users
  ansible.builtin.assert:
    that:
      - >-
        item.1 not in
        (ansible_facts['getent_group'].get(item.0, ['', '', ''])[2] | default('') | split(','))
    fail_msg: "{{ item.1 }} must not be a member of {{ item.0 }}."
    quiet: true
  loop: >-
    {{ ['docker', 'sudo', 'adm', 'systemd-journal', 'google-sudoers',
        deploy_group | default('ditto'), platform_group, platform_owner]
       | unique | product(['ditto-api', 'ditto-api-build']) | list }}
  loop_control:
    label: "{{ item.1 }} not in {{ item.0 }}"
