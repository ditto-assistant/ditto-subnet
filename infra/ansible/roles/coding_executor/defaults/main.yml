---
# Dedicated rootless Docker daemon for a future shadow-coding executor host.
# The role does nothing unless an operator explicitly enables it in protected
# host configuration after the optional three-host Terraform cohort exists.
coding_executor_daemon_enabled: false

coding_executor_user: ditto-coding-executor
coding_executor_group: ditto-coding-executor
# Future trusted scorer/worker services join this group in their own reviewed
# role. Keeping it empty in this layer proves the daemon starts with no client
# process, credential, or candidate workload.
coding_executor_client_group: ditto-coding-client
coding_executor_home: /var/lib/ditto-coding-executor
coding_executor_runtime_dir: /run/ditto-coding-executor
coding_executor_docker_host: unix:///run/ditto-coding-executor/docker.sock
coding_executor_unit: ditto-coding-executor-docker
coding_executor_egress_guard_unit: ditto-coding-executor-egress-guard

# These are daemon-envelope bounds, not candidate budgets. A future coding
# scorer still gets all resource limits from the signed task/grader authority.
coding_executor_daemon_memory_max: 24G
coding_executor_daemon_tasks_max: 8192
coding_executor_docker_apt_arch: amd64

# A repository-specific production supervisor and trusted test driver are a
# separate private-artifact deliverable. The staging control can only verify a
# bundle that an operator has already staged through the protected host path and
# pinned by its complete manifest SHA-256 in reviewed host configuration. It
# never pulls, loads, runs, or grants socket access to that bundle.
coding_executor_runtime_bundle_enabled: false
coding_executor_runtime_staging_dir: /var/lib/ditto-coding-executor/staged
coding_executor_runtime_manifest_path: /var/lib/ditto-coding-executor/staged/runtime-manifest.json
coding_executor_runtime_archive_path: /var/lib/ditto-coding-executor/staged/supervisor.oci.tar
coding_executor_runtime_manifest_sha256: ""

# Loading is a separate authority transition from staging. It is still disabled
# by default and only writes an attestation after Docker proves the loaded image
# is the exact, non-fixture production image described by the staged manifest.
coding_executor_runtime_image_load_enabled: false
coding_executor_attestation_dir: /var/lib/ditto-coding-executor/attestations
coding_executor_runtime_image_attestation_path: /var/lib/ditto-coding-executor/attestations/runtime-image-attestation.json

# The first non-root socket client is a local attestation guard, not a scorer.
# It can inspect only the already-attested image and exits on any drift. A
# later reviewed scorer release/transport must replace this guard before any
# ticket, Platform, or candidate authority can reach the executor.
coding_executor_client_guard_enabled: false
coding_executor_scorer_user: ditto-coding-scorer
coding_executor_scorer_group: ditto-coding-scorer
coding_executor_scorer_home: /var/lib/ditto-coding-scorer
coding_executor_client_guard_unit: ditto-coding-executor-client-guard

# The signed scorer service bundle has a disjoint staging tree and authority
# from the private supervisor runtime bundle above. Verification never loads or
# starts the scorer image.
coding_executor_scorer_bundle_enabled: false
coding_executor_scorer_staging_dir: /var/lib/ditto-coding-executor/scorer-staged
coding_executor_scorer_release_manifest_path: /var/lib/ditto-coding-executor/scorer-staged/scorer.release.json
coding_executor_scorer_bundle_manifest_path: /var/lib/ditto-coding-executor/scorer-staged/scorer.bundle.json
coding_executor_scorer_archive_path: /var/lib/ditto-coding-executor/scorer-staged/scorer.oci.tar
coding_executor_scorer_bundle_manifest_sha256: ""

# Loading the signed scorer archive is an independent, default-off authority
# transition. It writes a client-readable attestation only after the rootless
# daemon proves the exact release digest and immutable image configuration. It
# never creates or starts a container.
coding_executor_scorer_image_load_enabled: false
coding_executor_scorer_image_attestation_path: /var/lib/ditto-coding-executor/attestations/scorer-image-attestation.json

# Materializing the signed scorer binary and policy onto the host is separate
# from loading its image and from installing any systemd service. It remains
# default-off and creates no process, listener, token, client identity, or
# network rule. The later service consumes only this root-owned runtime.
coding_executor_scorer_runtime_materialize_enabled: false
coding_executor_scorer_runtime_binary_path: /usr/local/lib/ditto-coding-executor/dittobench-coding-executor-scorer
coding_executor_scorer_runtime_policy_path: /opt/ditto/coding/coding_inference_policy_locked_v1.json
coding_executor_scorer_runtime_attestation_path: /var/lib/ditto-coding-executor/attestations/scorer-runtime-attestation.json

# The rootless daemon starts default-deny. A later scorer may explicitly allow
# only its fixed capability gateway and port; this control never opens general
# Internet, Platform, validator, metadata, or peer-container access.
coding_executor_capability_egress_enabled: false
coding_executor_capability_gateway: ""
coding_executor_capability_port: 11438
