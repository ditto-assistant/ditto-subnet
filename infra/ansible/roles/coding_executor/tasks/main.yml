---
- name: Reject runtime-bundle staging without the dedicated daemon
  ansible.builtin.assert:
    that:
      - not (coding_executor_runtime_bundle_enabled | bool) or coding_executor_daemon_enabled | bool
    fail_msg: >-
      Runtime-bundle verification requires the dedicated rootless daemon to be
      explicitly enabled in reviewed host configuration. It cannot be enabled
      as a standalone image-staging path.

- name: Reject runtime-image loading without a verified staged bundle
  ansible.builtin.assert:
    that:
      - not (coding_executor_runtime_image_load_enabled | bool) or coding_executor_runtime_bundle_enabled | bool
    fail_msg: >-
      Runtime-image loading requires the verified runtime-bundle control. It
      cannot pull from a registry or load an unverified archive.

- name: Reject client guard without an attested runtime image
  ansible.builtin.assert:
    that:
      - not (coding_executor_client_guard_enabled | bool) or coding_executor_runtime_image_load_enabled | bool
    fail_msg: >-
      The dedicated Docker client guard requires the attested runtime-image
      control. It cannot treat an unverified image as a scorer authority.

- name: Reject scorer-bundle staging without the dedicated daemon
  ansible.builtin.assert:
    that:
      - not (coding_executor_scorer_bundle_enabled | bool) or coding_executor_daemon_enabled | bool
    fail_msg: Scorer-bundle staging requires the dedicated coding executor host.

- name: Reject scorer-image loading without a verified staged bundle
  ansible.builtin.assert:
    that:
      - not (coding_executor_scorer_image_load_enabled | bool) or coding_executor_scorer_bundle_enabled | bool
    fail_msg: >-
      Scorer-image loading requires the verified scorer-bundle control. It
      cannot pull from a registry or load an unverified archive.

- name: Reject scorer-runtime materialization without an attested scorer image
  ansible.builtin.assert:
    that:
      - not (coding_executor_scorer_runtime_materialize_enabled | bool) or coding_executor_scorer_image_load_enabled | bool
    fail_msg: >-
      Scorer-runtime materialization requires the attested scorer-image
      control. It cannot extract an unverified image or fetch a runtime from a
      registry.

- name: Reject capability egress before scorer runtime materialization
  ansible.builtin.assert:
    that:
      - not (coding_executor_capability_egress_enabled | bool) or coding_executor_scorer_runtime_materialize_enabled | bool
    fail_msg: >-
      Capability egress requires the materialized attested scorer runtime. It
      cannot pre-authorize arbitrary rootless daemon network access.

- name: Reject an invalid capability egress configuration
  ansible.builtin.assert:
    that:
      - not (coding_executor_capability_egress_enabled | bool) or coding_executor_capability_gateway is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - not (coding_executor_capability_egress_enabled | bool) or coding_executor_capability_port | int == 11438
    fail_msg: >-
      Capability egress accepts only one reviewed IPv4 gateway on the fixed
      scorer capability port. The guard rejects every other daemon destination.

- name: Reject capability ingress before matching egress
  ansible.builtin.assert:
    that:
      - not (coding_executor_capability_ingress_enabled | bool) or coding_executor_capability_egress_enabled | bool
    fail_msg: >-
      Capability ingress requires the matching default-deny egress control. It
      cannot expose a scorer capability listener on its own.

- name: Reject an invalid capability ingress configuration
  ansible.builtin.assert:
    that:
      - not (coding_executor_capability_ingress_enabled | bool) or coding_executor_capability_gateway is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - not (coding_executor_capability_ingress_enabled | bool) or coding_executor_capability_source_cidr is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/([0-9]|[12][0-9]|3[0-2])$')
      - not (coding_executor_capability_ingress_enabled | bool) or coding_executor_capability_port | int == 11438
    fail_msg: >-
      Capability ingress accepts only one reviewed private IPv4 candidate CIDR
      on the fixed scorer capability port.

- name: Reject scorer service before its runtime and capability guards
  ansible.builtin.assert:
    that:
      - not (coding_executor_scorer_service_enabled | bool) or coding_executor_scorer_runtime_materialize_enabled | bool
      - not (coding_executor_scorer_service_enabled | bool) or coding_executor_capability_egress_enabled | bool
      - not (coding_executor_scorer_service_enabled | bool) or coding_executor_capability_ingress_enabled | bool
      - not (coding_executor_scorer_service_enabled | bool) or coding_executor_client_guard_enabled | bool
    fail_msg: >-
      The scorer service requires materialized attested runtime files, both
      capability guards, and the temporary runtime-image client guard. It
      cannot be an independent socket or network authority.

- name: Reject mTLS identity staging before scorer runtime materialization
  ansible.builtin.assert:
    that:
      - not (coding_executor_mtls_identity_enabled | bool) or coding_executor_scorer_runtime_materialize_enabled | bool
    fail_msg: >-
      mTLS identity staging requires the materialized attested scorer runtime.
      It cannot establish a transport identity for an unverified host binary.

- name: Report that the coding executor daemon is deliberately disabled
  ansible.builtin.debug:
    msg: >-
      Dedicated coding executor daemon is disabled on {{ inventory_hostname }}.
      No Docker daemon, socket, scorer, worker, image, secret, ticket, or
      coding gate is configured by this role until
      coding_executor_daemon_enabled=true is set in reviewed host variables.
  when: not (coding_executor_daemon_enabled | bool)

- name: Provision the dedicated rootless coding executor daemon
  when: coding_executor_daemon_enabled | bool
  block:
    - name: Require the dedicated coding executor host profile
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == 'x86_64'
          - coding_executor_user == 'ditto-coding-executor'
          - coding_executor_group == 'ditto-coding-executor'
          - coding_executor_client_group == 'ditto-coding-client'
          - coding_executor_home == '/var/lib/ditto-coding-executor'
          - coding_executor_runtime_dir == '/run/ditto-coding-executor'
          - coding_executor_docker_host == 'unix:///run/ditto-coding-executor/docker.sock'
          - coding_executor_attestation_dir == '/var/lib/ditto-coding-executor/attestations'
          - coding_executor_daemon_memory_max == '24G'
          - coding_executor_daemon_tasks_max | int == 8192
          - coding_executor_docker_apt_arch == 'amd64'
        fail_msg: >-
          Rootless coding execution is pinned to the dedicated empty identity,
          socket, and bounded daemon profile. Do not repurpose a validator,
          Platform, screener, or rootful Docker host for this role.

    - name: Add Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /usr/share/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ coding_executor_docker_apt_arch }}
          signed-by=/usr/share/keyrings/docker.asc]
          https://download.docker.com/linux/debian
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Install rootless Docker daemon prerequisites
      ansible.builtin.apt:
        name:
          - dbus-user-session
          - docker-ce-cli
          - docker-ce-rootless-extras
          - iptables
          - slirp4netns
          - uidmap
        state: present
        update_cache: true

    - name: Ensure the dedicated daemon policy directory
      ansible.builtin.file:
        path: /usr/local/lib/ditto-coding-executor
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Inspect the dedicated rootless daemon unit
      ansible.builtin.stat:
        path: "{{ coding_executor_home }}/.config/systemd/user/{{ coding_executor_unit }}.service"
      register: coding_executor_user_unit

    - name: Install the dedicated daemon policy files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/lib/ditto-coding-executor/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - executor-capability-ingress-guard.sh
        - executor-egress-guard.sh
        - install-rootless-docker.sh
      register: coding_executor_policy_files

    - name: Install the dedicated daemon configuration
      ansible.builtin.copy:
        src: rootless-daemon.json
        dest: /usr/local/lib/ditto-coding-executor/rootless-daemon.json
        owner: root
        group: root
        mode: "0644"
      register: coding_executor_daemon_config

    - name: Install the rootless daemon egress-guard service
      ansible.builtin.template:
        src: ditto-coding-executor-egress-guard.service.j2
        dest: "/etc/systemd/system/{{ coding_executor_egress_guard_unit }}.service"
        owner: root
        group: root
        mode: "0644"
      register: coding_executor_guard_unit

    - name: Install the scorer capability ingress-guard service
      ansible.builtin.template:
        src: ditto-coding-executor-capability-ingress-guard.service.j2
        dest: "/etc/systemd/system/{{ coding_executor_capability_ingress_guard_unit }}.service"
        owner: root
        group: root
        mode: "0644"
      register: coding_executor_ingress_guard_unit

    - name: Enable the scorer capability ingress guard
      ansible.builtin.systemd_service:
        name: "{{ coding_executor_capability_ingress_guard_unit }}.service"
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Install and verify the dedicated rootless daemon
      ansible.builtin.command:
        cmd: /usr/local/lib/ditto-coding-executor/install-rootless-docker.sh
      environment:
        CODING_EXECUTOR_USER: "{{ coding_executor_user }}"
        CODING_EXECUTOR_GROUP: "{{ coding_executor_group }}"
        CODING_EXECUTOR_CLIENT_GROUP: "{{ coding_executor_client_group }}"
        CODING_EXECUTOR_HOME: "{{ coding_executor_home }}"
        CODING_EXECUTOR_RUNTIME_DIR: "{{ coding_executor_runtime_dir }}"
        CODING_EXECUTOR_UNIT: "{{ coding_executor_unit }}"
        CODING_EXECUTOR_EGRESS_GUARD_UNIT: "{{ coding_executor_egress_guard_unit }}"
        CODING_EXECUTOR_DAEMON_MEMORY_MAX: "{{ coding_executor_daemon_memory_max }}"
        CODING_EXECUTOR_DAEMON_TASKS_MAX: "{{ coding_executor_daemon_tasks_max }}"
      register: coding_executor_rootless_install
      changed_when: true
      when: >-
        not coding_executor_user_unit.stat.exists or
        coding_executor_policy_files.changed or
        coding_executor_daemon_config.changed or
        coding_executor_guard_unit.changed

    - name: Read the rootless daemon identity
      ansible.builtin.command:
        cmd: >-
          runuser -u {{ coding_executor_user }} -- env
          DOCKER_HOST={{ coding_executor_docker_host }} docker info
      register: coding_executor_daemon_info
      changed_when: false

    - name: Assert the rootless daemon has the required identity
      ansible.builtin.assert:
        that:
          - "'rootless' in coding_executor_daemon_info.stdout | lower"
          - "'io.heyditto.dittobench.isolated=true' in coding_executor_daemon_info.stdout"
        fail_msg: Dedicated coding executor did not prove its rootless isolated daemon identity.

    - name: Create the root-owned protected runtime-bundle staging directory
      ansible.builtin.file:
        path: "{{ coding_executor_runtime_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create the root-owned client-readable attestation directory
      ansible.builtin.file:
        path: "{{ coding_executor_attestation_dir }}"
        state: directory
        owner: root
        group: "{{ coding_executor_client_group }}"
        mode: "0750"

    - name: Install the credential-free runtime-bundle staging helpers
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/lib/ditto-coding-executor/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - load-scorer-bundle.py
        - load-runtime-bundle.py
        - materialize-scorer-runtime.py
        - stage-runtime-bundle.sh
        - verify-runtime-bundle.py
        - verify-scorer-bundle.py

    - name: Verify the separately staged coding executor scorer bundle
      when: coding_executor_scorer_bundle_enabled | bool
      block:
        - name: Require the fixed scorer-bundle staging profile
          ansible.builtin.assert:
            that:
              - coding_executor_scorer_staging_dir == '/var/lib/ditto-coding-executor/scorer-staged'
              - coding_executor_scorer_release_manifest_path == '/var/lib/ditto-coding-executor/scorer-staged/scorer.release.json'
              - coding_executor_scorer_bundle_manifest_path == '/var/lib/ditto-coding-executor/scorer-staged/scorer.bundle.json'
              - coding_executor_scorer_archive_path == '/var/lib/ditto-coding-executor/scorer-staged/scorer.oci.tar'
              - coding_executor_scorer_bundle_manifest_sha256 is match('^[0-9a-f]{64}$')
            fail_msg: >-
              Scorer-bundle staging requires the fixed root-only paths and a
              complete protected bundle-manifest SHA-256.

        - name: Create the root-owned scorer-bundle staging directory
          ansible.builtin.file:
            path: "{{ coding_executor_scorer_staging_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Verify the staged scorer bundle without loading it
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/verify-scorer-bundle.py
              - --release-manifest
              - "{{ coding_executor_scorer_release_manifest_path }}"
              - --bundle-manifest
              - "{{ coding_executor_scorer_bundle_manifest_path }}"
              - --archive
              - "{{ coding_executor_scorer_archive_path }}"
              - --expected-bundle-sha256
              - "{{ coding_executor_scorer_bundle_manifest_sha256 }}"
          changed_when: false

    - name: Load and attest the verified coding executor scorer image
      when: coding_executor_scorer_image_load_enabled | bool
      block:
        - name: Require the fixed scorer-image attestation profile
          ansible.builtin.assert:
            that:
              - coding_executor_attestation_dir == '/var/lib/ditto-coding-executor/attestations'
              - coding_executor_scorer_image_attestation_path == '/var/lib/ditto-coding-executor/attestations/scorer-image-attestation.json'
            fail_msg: >-
              Scorer-image attestation must remain in the fixed root-owned,
              client-readable attestation directory.

        - name: Load and attest the verified scorer image without starting it
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/load-scorer-bundle.py
              - --release-manifest
              - "{{ coding_executor_scorer_release_manifest_path }}"
              - --bundle-manifest
              - "{{ coding_executor_scorer_bundle_manifest_path }}"
              - --archive
              - "{{ coding_executor_scorer_archive_path }}"
              - --expected-bundle-sha256
              - "{{ coding_executor_scorer_bundle_manifest_sha256 }}"
              - --docker-host
              - "{{ coding_executor_docker_host }}"
              - --attestation
              - "{{ coding_executor_scorer_image_attestation_path }}"
          register: coding_executor_scorer_image_load
          changed_when: "'changed=true' in coding_executor_scorer_image_load.stdout"

    - name: Materialize the attested scorer runtime without starting it
      when: coding_executor_scorer_runtime_materialize_enabled | bool
      block:
        - name: Require the fixed scorer-runtime materialization profile
          ansible.builtin.assert:
            that:
              - coding_executor_scorer_runtime_binary_path == '/usr/local/lib/ditto-coding-executor/dittobench-coding-executor-scorer'
              - coding_executor_scorer_runtime_policy_path == '/opt/ditto/coding/coding_inference_policy_locked_v1.json'
              - coding_executor_scorer_runtime_attestation_path == '/var/lib/ditto-coding-executor/attestations/scorer-runtime-attestation.json'
            fail_msg: >-
              Scorer runtime files and their attestation must remain at fixed
              root-owned paths. Do not make a caller-selected binary or policy
              authoritative.

        - name: Create the fixed scorer policy directory
          ansible.builtin.file:
            path: /opt/ditto/coding
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Materialize the exact scorer binary and locked policy
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/materialize-scorer-runtime.py
          register: coding_executor_scorer_runtime_materialize
          changed_when: "'changed=true' in coding_executor_scorer_runtime_materialize.stdout"

    - name: Verify a protected staged coding runtime bundle without loading it
      when: coding_executor_runtime_bundle_enabled | bool
      block:
        - name: Require the fixed protected runtime-bundle staging profile
          ansible.builtin.assert:
            that:
              - coding_executor_runtime_staging_dir == '/var/lib/ditto-coding-executor/staged'
              - coding_executor_runtime_manifest_path == '/var/lib/ditto-coding-executor/staged/runtime-manifest.json'
              - coding_executor_runtime_archive_path == '/var/lib/ditto-coding-executor/staged/supervisor.oci.tar'
              - coding_executor_runtime_manifest_sha256 is match('^[0-9a-f]{64}$')
            fail_msg: >-
              Runtime-bundle staging requires the fixed root-owned paths and a
              complete protected manifest SHA-256. Do not use a mutable
              registry reference, an Ansible variable carrying bundle bytes, or
              an unpinned manifest.

        - name: Verify the staged runtime-bundle manifest and archive
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/verify-runtime-bundle.py
              - --manifest
              - "{{ coding_executor_runtime_manifest_path }}"
              - --archive
              - "{{ coding_executor_runtime_archive_path }}"
              - --expected-manifest-sha256
              - "{{ coding_executor_runtime_manifest_sha256 }}"
          changed_when: false

    - name: Load and attest a verified coding runtime image without starting it
      when: coding_executor_runtime_image_load_enabled | bool
      block:
        - name: Require the fixed runtime-image attestation path
          ansible.builtin.assert:
            that:
              - coding_executor_attestation_dir == '/var/lib/ditto-coding-executor/attestations'
              - coding_executor_runtime_image_attestation_path == '/var/lib/ditto-coding-executor/attestations/runtime-image-attestation.json'
            fail_msg: >-
              Runtime-image attestation must remain in the fixed root-owned,
              client-readable attestation directory. Do not make an unreviewed
              image or attestation path authoritative.

        - name: Load and attest the verified runtime image
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/load-runtime-bundle.py
              - --manifest
              - "{{ coding_executor_runtime_manifest_path }}"
              - --archive
              - "{{ coding_executor_runtime_archive_path }}"
              - --expected-manifest-sha256
              - "{{ coding_executor_runtime_manifest_sha256 }}"
              - --docker-host
              - "{{ coding_executor_docker_host }}"
              - --attestation
              - "{{ coding_executor_runtime_image_attestation_path }}"
          changed_when: true

    - name: Install the attestation-bound dedicated Docker client guard
      when: coding_executor_client_guard_enabled | bool
      block:
        - name: Require the fixed client-guard identity and attestation profile
          ansible.builtin.assert:
            that:
              - coding_executor_scorer_user == 'ditto-coding-scorer'
              - coding_executor_scorer_group == 'ditto-coding-scorer'
              - coding_executor_scorer_home == '/var/lib/ditto-coding-scorer'
              - coding_executor_client_guard_unit == 'ditto-coding-executor-client-guard'
              - coding_executor_attestation_dir == '/var/lib/ditto-coding-executor/attestations'
              - coding_executor_runtime_image_attestation_path == '/var/lib/ditto-coding-executor/attestations/runtime-image-attestation.json'
            fail_msg: >-
              The first dedicated Docker client is pinned to the narrow scorer
              identity and rootless runtime attestation. Do not repurpose a
              validator, Platform, screener, or operator identity as a client.

        - name: Create the dedicated scorer primary group
          ansible.builtin.group:
            name: "{{ coding_executor_scorer_group }}"
            system: true

        - name: Create the dedicated scorer identity with only Docker client access
          ansible.builtin.user:
            name: "{{ coding_executor_scorer_user }}"
            group: "{{ coding_executor_scorer_group }}"
            groups: "{{ coding_executor_client_group }}"
            append: true
            system: true
            create_home: true
            home: "{{ coding_executor_scorer_home }}"
            shell: /usr/sbin/nologin

        - name: Install the dedicated Docker client guard
          ansible.builtin.copy:
            src: coding-executor-client-guard.py
            dest: /usr/local/lib/ditto-coding-executor/coding-executor-client-guard.py
            owner: root
            group: root
            mode: "0755"

        - name: Install the dedicated Docker client guard unit
          ansible.builtin.template:
            src: ditto-coding-executor-client-guard.service.j2
            dest: "/etc/systemd/system/{{ coding_executor_client_guard_unit }}.service"
            owner: root
            group: root
            mode: "0644"

        - name: Prove the dedicated client guard accepts only the attested image
          ansible.builtin.command:
            argv:
              - runuser
              - -u
              - "{{ coding_executor_scorer_user }}"
              - --
              - /usr/local/lib/ditto-coding-executor/coding-executor-client-guard.py
              - --once
          changed_when: false

        - name: Enable the attestation-bound dedicated Docker client guard
          ansible.builtin.systemd_service:
            name: "{{ coding_executor_client_guard_unit }}.service"
            enabled: true
            state: restarted
            daemon_reload: true

    - name: Install the default-off attestation-bound scorer service
      when: coding_executor_scorer_service_enabled | bool
      block:
        - name: Require the fixed scorer service profile
          ansible.builtin.assert:
            that:
              - coding_executor_scorer_service_unit == 'ditto-coding-executor-scorer'
              - coding_executor_scorer_token_directory == '/var/lib/ditto-coding-executor/credentials'
              - coding_executor_scorer_token_source_path == '/var/lib/ditto-coding-executor/credentials/scorer-control-token'
              - coding_executor_scorer_private_root == '/var/lib/ditto-coding-scorer/private'
              - coding_executor_scorer_runtime_binary_path == '/usr/local/lib/ditto-coding-executor/dittobench-coding-executor-scorer'
              - coding_executor_scorer_runtime_policy_path == '/opt/ditto/coding/coding_inference_policy_locked_v1.json'
              - coding_executor_scorer_runtime_attestation_path == '/var/lib/ditto-coding-executor/attestations/scorer-runtime-attestation.json'
              - coding_executor_capability_port | int == 11438
            fail_msg: >-
              The scorer service uses fixed runtime, credential, and capability
              paths. Do not make a caller-selected binary, token, or listener
              authoritative.

        - name: Create the root-only scorer credential directory
          ansible.builtin.file:
            path: "{{ coding_executor_scorer_token_directory }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Inspect the pre-positioned scorer control token
          ansible.builtin.stat:
            path: "{{ coding_executor_scorer_token_source_path }}"
            follow: false
          register: coding_executor_scorer_token

        - name: Require the protected scorer control token source
          ansible.builtin.assert:
            that:
              - coding_executor_scorer_token.stat.exists
              - coding_executor_scorer_token.stat.isreg
              - not coding_executor_scorer_token.stat.islnk
              - coding_executor_scorer_token.stat.uid == 0
              - coding_executor_scorer_token.stat.gid == 0
              - coding_executor_scorer_token.stat.mode == '0400'
              - coding_executor_scorer_token.stat.size | int >= 32
            fail_msg: >-
              The scorer control token must already be one root-only regular
              file at the fixed credential path. It is never copied through
              Ansible or placed in a service environment.

        - name: Create scorer private state root
          ansible.builtin.file:
            path: "{{ coding_executor_scorer_private_root }}"
            state: directory
            owner: "{{ coding_executor_scorer_user }}"
            group: "{{ coding_executor_scorer_group }}"
            mode: "0700"

        - name: Install scorer service preflight helpers
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/usr/local/lib/ditto-coding-executor/{{ item }}"
            owner: root
            group: root
            mode: "0755"
          loop:
            - verify-scorer-service.py
            - run-scorer-service.py

        - name: Install the attestation-bound scorer service unit
          ansible.builtin.template:
            src: ditto-coding-executor-scorer.service.j2
            dest: "/etc/systemd/system/{{ coding_executor_scorer_service_unit }}.service"
            owner: root
            group: root
            mode: "0644"

        - name: Start the scorer only after its preflight succeeds
          ansible.builtin.systemd_service:
            name: "{{ coding_executor_scorer_service_unit }}.service"
            enabled: true
            state: started
            daemon_reload: true

        - name: Retire the temporary client guard after scorer startup
          ansible.builtin.systemd_service:
            name: "{{ coding_executor_client_guard_unit }}.service"
            enabled: false
            state: stopped

    - name: Stage the default-off scorer mTLS identity without listening
      when: coding_executor_mtls_identity_enabled | bool
      block:
        - name: Require the fixed scorer mTLS identity profile
          ansible.builtin.assert:
            that:
              - coding_executor_mtls_identity_directory == '/var/lib/ditto-coding-executor/mtls'
              - coding_executor_mtls_ca_certificate_path == '/var/lib/ditto-coding-executor/mtls/validator-ca.pem'
              - coding_executor_mtls_server_certificate_path == '/var/lib/ditto-coding-executor/mtls/scorer-server.pem'
              - coding_executor_mtls_server_key_path == '/var/lib/ditto-coding-executor/mtls/scorer-server-key.pem'
            fail_msg: >-
              The mTLS identity paths are fixed and root-only. Do not make a
              caller-selected certificate or key authoritative.

        - name: Create the root-only scorer mTLS directory
          ansible.builtin.file:
            path: "{{ coding_executor_mtls_identity_directory }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Inspect staged scorer mTLS files
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ coding_executor_mtls_ca_certificate_path }}"
            - "{{ coding_executor_mtls_server_certificate_path }}"
            - "{{ coding_executor_mtls_server_key_path }}"
          register: coding_executor_mtls_files

        - name: Require root-only scorer mTLS files
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.isreg
              - not item.stat.islnk
              - item.stat.uid == 0
              - item.stat.gid == 0
              - item.stat.mode == '0400'
              - item.stat.size | int > 0
            fail_msg: >-
              mTLS CA, server certificate, and server key must already be
              root-only regular files. Ansible never copies their contents.
          loop: "{{ coding_executor_mtls_files.results }}"

        - name: Install the scorer mTLS identity verifier
          ansible.builtin.copy:
            src: verify-scorer-mtls-identity.sh
            dest: /usr/local/lib/ditto-coding-executor/verify-scorer-mtls-identity.sh
            owner: root
            group: root
            mode: "0755"

        - name: Verify scorer mTLS chain and private key match
          ansible.builtin.command:
            argv:
              - /usr/local/lib/ditto-coding-executor/verify-scorer-mtls-identity.sh
          changed_when: false

    - name: Report that task-serving scorer and worker activation remain disabled
      ansible.builtin.debug:
        msg: >-
          Dedicated rootless daemon is ready on {{ coding_executor_docker_host }},
          and an optional local guard may inspect an attested image, but no
          task-serving scorer, validator, wallet, Platform control, ticket,
          network listener, or coding gate has been installed or enabled.
