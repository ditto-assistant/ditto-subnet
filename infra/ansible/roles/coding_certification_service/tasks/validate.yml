---
# Pure input validation for the render-only certification service role.
- name: Validate the certification service render profile
  vars:
    render_root: "{{ coding_certification_service_render_root | string }}"
    bip: "{{ coding_certification_service_bip | string }}"
    private_ipv4: '(?:10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){2}'
  ansible.builtin.assert:
    that:
      - render_root is match('^/[A-Za-z0-9._/-]+\Z')
      - render_root is not search('(^|/)\.\.?(/|$)|//')
      - render_root is not match('^/(etc|usr|run|var|lib|lib64|bin|sbin|boot|proc|sys|dev|srv|opt|root)(/|\Z)')
      - coding_certification_service_user is match('^[a-z_][a-z0-9_-]{0,31}\Z')
      - coding_certification_service_client_group is match('^[a-z_][a-z0-9_-]{0,31}\Z')
      - coding_certification_service_client_group != coding_certification_service_user
      - coding_certification_service_uid | string is match('^[1-9][0-9]{0,9}\Z')
      - coding_certification_service_client_gid | string is match('^[1-9][0-9]{0,9}\Z')
      - (coding_certification_service_uid | int) < 2147483647
      - (coding_certification_service_client_gid | int) < 2147483647
      # bip is the gateway address with its prefix, e.g. 10.203.0.1/24.
      - bip is match('^' + private_ipv4 + '/(?:1[6-9]|2[0-9]|30)\Z')
      - coding_certification_service_router_port | string is match('^[1-9][0-9]{3,4}\Z')
      - (coding_certification_service_router_port | int) <= 65535
      - coding_certification_service_egress_network | string is match('^[a-z0-9_][a-z0-9_-]{0,127}\Z')
      - coding_certification_service_egress_proxy | string is match('^http://' + private_ipv4 + ':[1-9][0-9]{0,4}\Z')
      - ((coding_certification_service_egress_proxy | string).split(':')[-1] | int) <= 65535
      - coding_certification_service_runtime_image_repository | string is match('^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*(?::[0-9]{1,5})?/)?[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*\Z')
      - coding_certification_service_runtime_image_digest | string is match('^sha256:[0-9a-f]{64}\Z')
      - coding_certification_service_pack_manifest_sha256 | string is match('^[0-9a-f]{64}\Z')
      - coding_certification_service_router_helper_sha256 | string is match('^[0-9a-f]{64}\Z')
    fail_msg: >-
      The certification service render needs an explicit controller-local
      render root outside system locations, non-root numeric ids, distinct
      user and client group names, a private IPv4 bip, a private IPv4 egress
      proxy, a Docker-grammar runtime repository, a sha256 runtime image digest
      the pinned canary manifest digest and the pinned router helper digest.
    quiet: true
