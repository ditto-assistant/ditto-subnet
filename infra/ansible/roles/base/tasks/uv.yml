---
- name: Check for /usr/local/bin/uv
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: uv_stat

- name: Install pinned uv
  ansible.builtin.shell: |
    set -euo pipefail
    installer=/tmp/uv-installer-0.11.28.sh
    curl --fail --silent --show-error --location \
      --output "$installer" \
      https://github.com/astral-sh/uv/releases/download/0.11.28/uv-installer.sh
    echo "b7b3fe80cad1142a2a5794050b7db7b3291d1bac1423b0732571dd9366e8ca8b  $installer" \
      | sha256sum --check
    sh "$installer"
    cp "$HOME/.local/bin/uv" /usr/local/bin/uv
    chmod 755 /usr/local/bin/uv
  args:
    creates: /usr/local/bin/uv
  when: not uv_stat.stat.exists
