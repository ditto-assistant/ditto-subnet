---
- name: Restrict partition preparation to the canonical primary host
  ansible.builtin.assert:
    that: inventory_hostname == 'subnet-screener-1'
- name: Prepare graceful-drain overrides before any release update
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.d'
    state: directory
    mode: '0755'
  loop: "{{ ['ditto-screener-fleet-auto-update.service'] + screener_partition_worker_units }}"
# A stop must outlast the longest legitimate signed worker review.
# SendSIGKILL=no still means a timeout never kills a review.
- name: Signal only primary parent processes and never escalate to SIGKILL
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.d/drain-safety.conf'
    mode: '0644'
    content: |
      [Service]
      KillMode=mixed
      SendSIGKILL=no
      TimeoutStopSec=120min
  loop: "{{ screener_partition_worker_units }}"
# Release preparation (~20 min) + the 70 min lease-bound drain + a rollback
# drain of the same bound must fit. An abort still restarts the fleet.
- name: Let the updater finish a bounded drain and its rollback
  ansible.builtin.copy:
    dest: /etc/systemd/system/ditto-screener-fleet-auto-update.service.d/drain-safety.conf
    mode: '0644'
    content: |
      [Service]
      TimeoutStartSec=180min
- name: Load drain policy without restarting any primary process
  ansible.builtin.systemd:
    daemon_reload: true
- name: End preparation before runtime partition changes when requested
  ansible.builtin.meta: end_host
  when: screener_partition_prepare_only | bool
- name: Verify rootless daemon identity before installing numeric user-unit override
  ansible.builtin.command: id -u ditto-builder
  register: builder_uid
  changed_when: false
- name: Require the expected rootless daemon owner
  ansible.builtin.assert:
    that: builder_uid.stdout == '1005'
- name: Require the canonical screener host
  ansible.builtin.assert:
    that: inventory_hostname == 'subnet-screener-1'
- name: Verify CI guest is powered off before expanding screening memory
  ansible.builtin.command: virsh --connect qemu:///system domstate ditto-screener-ci-1
  register: screener_ci_state
  changed_when: false
- name: Refuse overlapping screening and CI memory allocations
  ansible.builtin.assert:
    that: screener_ci_state.stdout | trim == 'shut off'
    fail_msg: Drain and power off the CI guest before allocating 52 GiB to screening.
- name: Install bounded primary resource slice
  ansible.builtin.template:
    src: dittoscreener.slice.j2
    dest: /etc/systemd/system/dittoscreener.slice
    mode: '0644'
- name: Create persistent primary unit overrides
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.d'
    state: directory
    mode: '0755'
  loop: "{{ ['user@1005.service'] + screener_partition_worker_units }}"
- name: Put primary workers under the aggregate cap and preserve graceful drain
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.d/partition.conf'
    mode: '0644'
    content: |
      [Service]
      Slice={{ 'user-1005.slice' if item == 'user@1005.service' else 'dittoscreener.slice' }}
      TimeoutStopSec=120min
      SendSIGKILL=no
      {{ 'KillMode=mixed' if item != 'user@1005.service' else '' }}
  loop: "{{ ['user@1005.service'] + screener_partition_worker_units }}"
- name: Preserve rootless ownership discovery with a separately bounded native user slice
  ansible.builtin.file:
    path: /etc/systemd/system/user-1005.slice.d
    state: directory
    mode: '0755'
- name: Bound rootless runtime alongside the 24 GiB primary lane slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/user-1005.slice.d/partition.conf
    mode: '0644'
    content: |
      [Slice]
      CPUAccounting=yes
      CPUQuota=1600%
      CPUWeight=200
      MemoryAccounting=yes
      MemoryHigh=26G
      MemoryMax=28G
      TasksMax=infinity
- name: Persist four workers for normal release updater restarts
  ansible.builtin.copy:
    dest: /etc/systemd/system/ditto-screener-fleet-auto-update.service.d/partition.conf
    mode: '0644'
    content: |
      [Service]
      Environment=SCREENER_FLEET_WORKER_PROCESSES=4
- name: Reload primary partition metadata without restarting jobs
  ansible.builtin.systemd:
    daemon_reload: true
- name: Install serialized graceful activation helper
  ansible.builtin.copy:
    src: activate-partition.sh
    dest: /usr/local/sbin/ditto-screener-partition-activate
    owner: root
    group: root
    mode: '0755'
- name: Activate with existing updater lock and graceful primary drain
  ansible.builtin.command: /usr/local/sbin/ditto-screener-partition-activate
  when: screener_partition_activate | bool
