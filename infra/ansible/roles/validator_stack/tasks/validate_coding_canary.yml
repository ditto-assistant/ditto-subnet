---
# Pure input validation for the default-off certification canary. It runs before
# the role mutates the host and is exercised on localhost by
# infra/ansible/tests/validator-stack-coding-canary.yml.
#
# The repository pattern is the Docker reference grammar for a repository name
# (lowercase), shared with codingexecutor.validImageRepository. The coding
# daemon endpoint must be a local Unix socket that is not a conventional rootful
# socket, shared with codingexecutor.ValidDedicatedDockerHost; the scorer also
# refuses the stack's own DOCKER_HOST and proves rootless isolation live.
- name: Validate the default-off certification canary profile
  vars:
    canary_validator: "{{ validator_stack_coding_canary_enabled | bool }}"
    canary_scorer: "{{ validator_stack_dittobench_coding_canary_enabled | bool }}"
    canary_docker_host: "{{ validator_stack_coding_docker_host | string }}"
    canary_targets: "{{ validator_stack_coding_canary_targets }}"
    # RFC 1918 IPv4 literal in canonical dotted-decimal form (no leading zeros).
    canary_private_ipv4: '^(?:10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){2}\Z'
  ansible.builtin.assert:
    that:
      - not canary_validator or canary_scorer
      - not canary_validator or not (validator_stack_coding_executor_connectivity_canary_enabled | bool)
      - not canary_validator or not (validator_stack_coding_executor_connectivity_canary_run_enabled | bool)
      - not canary_validator or (validator_stack_coding_canary_poll_seconds | float >= 1 and validator_stack_coding_canary_poll_seconds | float <= 300)
      - not canary_scorer or validator_stack_coding_runtime_image_digest is match('^sha256:[0-9a-f]{64}\Z')
      - not canary_scorer or validator_stack_coding_runtime_image_repository | length <= 255
      - not canary_scorer or validator_stack_coding_runtime_image_repository is match('^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*(?::[0-9]{1,5})?/)?[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*)*\Z')
      # A certification attempt needs the dedicated rootless coding daemon. The
      # stack's only daemon today is the privileged rootful sandbox-docker.
      - not (canary_scorer or canary_validator) or canary_docker_host is match('^unix:///[A-Za-z0-9._/-]+\.sock\Z')
      - not (canary_scorer or canary_validator) or canary_docker_host | length <= 114
      - not (canary_scorer or canary_validator) or canary_docker_host[7:] is not search('//|/\.\.?/')
      - not (canary_scorer or canary_validator) or canary_docker_host not in ['unix:///var/run/docker.sock', 'unix:///run/docker.sock']
      # The coding runtime's own egress network, proxy and gateway, shared with
      # sandbox.NewCodingRuntimeDocker. Private IPv4 literals only; no fallback
      # to the ordinary scorer's sandbox settings and no CA bundle.
      - not (canary_scorer or canary_validator) or (validator_stack_coding_egress_network | string) is match('^[a-z0-9_][a-z0-9_-]{0,127}\Z')
      - not (canary_scorer or canary_validator) or (validator_stack_coding_host_gateway_ip | string) is match(canary_private_ipv4)
      - not (canary_scorer or canary_validator) or (validator_stack_coding_egress_proxy | string) is match('^http://' + canary_private_ipv4[1:-2] + ':(?:[1-9][0-9]{0,4})\Z')
      - not (canary_scorer or canary_validator) or ((validator_stack_coding_egress_proxy | string).split(':')[-1] | int) <= 65535
      # Exact targets: 1-16 unique (agent_id, artifact_sha256,
      # screened_image_sha256) mappings bound to this validator's own hotkey,
      # the four fields of one Platform allowlist tuple. The empty defaults
      # refuse every lease. Checks run in order, so shape is proven before any
      # field is read.
      - not canary_validator or (canary_targets is sequence and canary_targets is not string and canary_targets is not mapping)
      - not canary_validator or (canary_targets | length >= 1 and canary_targets | length <= 16)
      - not canary_validator or (canary_targets | reject('mapping') | list | length) == 0
      - not canary_validator or (canary_targets | map('dict2items') | map('map', attribute='key') | map('sort') | map('join', ',') | unique | list) == ['agent_id,artifact_sha256,screened_image_sha256']
      - not canary_validator or (canary_targets | map(attribute='agent_id') | select('string') | select('match', '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z') | list | length) == (canary_targets | length)
      - not canary_validator or '00000000-0000-0000-0000-000000000000' not in (canary_targets | map(attribute='agent_id') | list)
      - not canary_validator or (canary_targets | map(attribute='artifact_sha256') | select('string') | select('match', '^[0-9a-f]{64}\Z') | list | length) == (canary_targets | length)
      - not canary_validator or (canary_targets | map(attribute='screened_image_sha256') | select('string') | select('match', '^[0-9a-f]{64}\Z') | list | length) == (canary_targets | length)
      - not canary_validator or (canary_targets | map(attribute='agent_id') | zip(canary_targets | map(attribute='artifact_sha256'), canary_targets | map(attribute='screened_image_sha256')) | map('join', ':') | unique | list | length) == (canary_targets | length)
      - not canary_validator or validator_stack_coding_canary_validator_hotkey is match('^5[1-9A-HJ-NP-Za-km-z]{47}\Z')
      - not canary_validator or validator_stack_coding_canary_validator_hotkey == validator_stack_hotkey
    fail_msg: >-
      The certification canary requires the scorer canary gate, is exclusive with
      the executor connectivity canary, polls within [1, 300] seconds, and needs
      a Docker-grammar runtime image repository, an immutable sha256 digest, and
      the dedicated rootless coding daemon's local socket (never the rootful
      sandbox-docker daemon) with its own egress network, private-IPv4 proxy
      and gateway. The validator worker also needs 1-16 exact targets, each an
      agent UUID with its artifact and screened-image SHA-256 digests, and a
      target hotkey equal to this validator's hotkey. Keep both
      canary switches false until the rootless coding daemon exists and the
      whole profile has been approved.
