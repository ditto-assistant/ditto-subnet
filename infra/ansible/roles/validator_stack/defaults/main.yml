---
validator_stack_user: "{{ deploy_user | default('deploy') }}"
validator_stack_group: "{{ deploy_group | default('ditto') }}"
validator_stack_project: "{{ gcp_project | default('ditto-app-dev') }}"

validator_stack_root: /opt/ditto/validator-stack
validator_stack_checkout: "{{ validator_stack_root }}/src"
validator_stack_env_file: "{{ validator_stack_checkout }}/.env"
validator_stack_wallet_root: /opt/ditto/validator-hotkey
validator_stack_wallets_dir: "{{ validator_stack_wallet_root }}/wallets"
validator_stack_wallet_name: validator
validator_stack_hotkey_name: gcp-prod
validator_stack_hotkey_file: "{{ validator_stack_wallets_dir }}/{{ validator_stack_wallet_name }}/hotkeys/{{ validator_stack_hotkey_name }}"
validator_stack_materializer: "{{ validator_stack_wallet_root }}/materialize_wallet.py"
validator_stack_pylon_token_file: "{{ validator_stack_wallet_root }}/pylon-token"
validator_stack_broker_token_file: "{{ validator_stack_wallet_root }}/broker-control-token"

validator_stack_repo: https://github.com/ditto-assistant/ditto-subnet.git
validator_stack_revision: ""
validator_stack_hotkey: ""
validator_stack_hotkey_secret: validator-prod-hotkey-mnemonic
validator_stack_hotkey_secret_version: ""
validator_stack_wandb_secret: validator-wandb-key
validator_stack_benchmark_capacity: 8
validator_stack_longmem_capacity: 4

validator_stack_platform_api_url: https://platform-api.heyditto.ai/
validator_stack_subtensor_network: finney
validator_stack_disk_percent_ceiling: 90
validator_stack_memory_percent_ceiling: 90
validator_stack_cpu_percent_ceiling: 0

# Dedicated coding execution remains independently double-gated. Identity
# staging verifies only pre-positioned root-owned files; Ansible never copies
# certificate or key contents. Every runtime value ships false/empty.
validator_stack_coding_shadow_enabled: false
validator_stack_coding_shadow_instance_id: coding-shadow-primary
validator_stack_coding_shadow_run_id: ""
validator_stack_coding_shadow_poll_seconds: 10
validator_stack_coding_executor_identity_enabled: false
validator_stack_coding_executor_remote_enabled: false
validator_stack_coding_executor_connectivity_canary_enabled: false
validator_stack_coding_executor_connectivity_canary_run_enabled: false
validator_stack_coding_executor_connectivity_canary_timeout_seconds: 120
validator_stack_coding_executor_connectivity_canary_directory: /var/lib/ditto-validator/coding-executor-canary
validator_stack_coding_executor_connectivity_canary_receipt_path: /var/lib/ditto-validator/coding-executor-canary/receipt.json
validator_stack_coding_executor_managed_release_directory: "{{ validator_stack_checkout }}/.validator-stack-update/current"
validator_stack_coding_executor_base_url: ""
validator_stack_coding_executor_timeout_seconds: 30
validator_stack_coding_executor_identity_directory: /var/lib/ditto-validator/coding-executor-mtls
validator_stack_coding_executor_ca_path: /var/lib/ditto-validator/coding-executor-mtls/executor-ca.pem
validator_stack_coding_executor_client_cert_path: /var/lib/ditto-validator/coding-executor-mtls/validator-client.pem
validator_stack_coding_executor_client_key_path: /var/lib/ditto-validator/coding-executor-mtls/validator-client-key.pem

# Hosted-v2 validator control trust. Default-off and empty: only
# `python -m ditto.validator.coding_hosted_control` reads these, never the
# worker, and it refuses to run unless both are set. The hotkey is the PUBLIC
# SS58 address of the dedicated Platform control signer, reviewed in Git and
# distributed independently of Platform; it can never equal
# validator_stack_hotkey. Validators trust only this configured address.
validator_stack_coding_hosted_control_enabled: false
validator_stack_coding_hosted_platform_hotkey: ""

# Contract-v1 public certification canary, off by default.
#
# The validator switch issues and claims certification leases against the host
# certification service (infra/docs/coding-certification-service.md), reached
# only over its fixed Unix socket. It requires exact targets, and the worker
# still refuses before issue unless that service's readiness probe reports the
# pack, rootless topology, listener namespace, control socket, executor daemon
# and pinned runtime image as ready. The Compose scorer's certification route
# and its scorer switch are retired.
validator_stack_coding_canary_enabled: false
validator_stack_coding_canary_poll_seconds: 10
# Exact certification canary targets. The empty defaults refuse every lease.
# Each target is one mapping with exactly agent_id (canonical UUID),
# artifact_sha256 and screened_image_sha256 (lowercase 64-hex), the same fields
# as one Platform certification allowlist tuple; the fourth field is the
# validator hotkey below. A lease whose artifact or screened-image digest
# differs from a listed target is refused before any execution. The hotkey
# must equal validator_stack_hotkey, so the targets cannot be reused on another
# validator.
validator_stack_coding_canary_targets: []
validator_stack_coding_canary_validator_hotkey: ""
# The host certification service's socket route, rendered only while the
# validator switch is on (infra/docs/coding-certification-service.md). The
# validator container bind-mounts the socket's parent directory,
# /run/ditto-coding-certification, read-only, never the socket file, so a
# service restart that recreates the socket keeps working; the service unit
# preserves that directory across restarts. Off, the mount source is /dev/null.
#
# socket_uid and socket_gid pin the service user and the client group that
# must own the directory and socket (the coding_certification_service role's
# coding_certification_service_uid and coding_certification_service_client_gid).
# runtime_image_digest and pack_manifest_sha256 must equal the service's pins.
validator_stack_coding_certification_socket_uid: 0
validator_stack_coding_certification_socket_gid: 0
# Host path of the certification bearer file, for example the file the service
# unit loads as its credential. Compose mounts it read-only as a secret at
# /run/secrets/coding-certification-control-token and the validator reads it
# through VALIDATOR_CODING_CERTIFICATION_CONTROL_TOKEN_FILE. The bearer is
# never read, rendered or passed as an environment value by this role, because
# container environment values are visible to docker inspect.
validator_stack_coding_certification_control_token_path: ""
validator_stack_coding_certification_runtime_image_digest: ""
validator_stack_coding_certification_pack_manifest_sha256: ""

validator_stack_cosign_version: v3.0.6
validator_stack_cosign_linux_amd64_sha256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
validator_stack_uv_bin: /usr/local/bin/uv
