---
# AWS: the EC2 instance role is federated into GCP Workload Identity
# (gcp-platform/generator-scorer.tf, generator_scorer_aws_*). gcloud signs an
# STS GetCallerIdentity request with the instance-role credentials from IMDSv2
# and exchanges it for a federated token that can read only this secret. The
# credential configuration names the provider and IMDS endpoints; it holds no
# secret.
- name: Require the federation audience
  ansible.builtin.assert:
    that:
      - generator_scorer_gcp_project_number | string is match('^[0-9]+$')
      - generator_scorer_gcp_wif_pool | length > 0
      - generator_scorer_gcp_wif_provider | length > 0
    fail_msg: aws-wif needs generator_scorer_gcp_project_number, generator_scorer_gcp_wif_pool and generator_scorer_gcp_wif_provider
    quiet: true

- name: Check for the Google Cloud CLI
  ansible.builtin.command: gcloud --version
  register: generator_scorer_gcloud_check
  changed_when: false
  failed_when: false

- name: Install the Google Cloud CLI
  when: generator_scorer_gcloud_check.rc != 0
  block:
    - name: Install deb822 repository support
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: Add the Google Cloud apt key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/google-cloud.gpg
        mode: "0644"
        checksum: "sha256:{{ generator_scorer_google_cloud_apt_key_sha256 }}"

    - name: Add the Google Cloud apt repository
      ansible.builtin.deb822_repository:
        name: google-cloud-sdk
        types: [deb]
        uris: https://packages.cloud.google.com/apt
        suites: [cloud-sdk]
        components: [main]
        signed_by: /usr/share/keyrings/google-cloud.gpg
        state: present

    - name: Install the Google Cloud CLI
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present
        update_cache: true

- name: Ensure the federation configuration directory
  ansible.builtin.file:
    path: "{{ generator_scorer_gcp_wif_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render the non-secret AWS external-account configuration
  ansible.builtin.command:
    argv:
      - gcloud
      - iam
      - workload-identity-pools
      - create-cred-config
      - "projects/{{ generator_scorer_gcp_project_number }}/locations/global/workloadIdentityPools/{{ generator_scorer_gcp_wif_pool }}/providers/{{ generator_scorer_gcp_wif_provider }}"
      - --aws
      - --enable-imdsv2
      - "--output-file={{ generator_scorer_gcp_wif_dir }}/credential.json"
  environment:
    CLOUDSDK_CONFIG: "{{ generator_scorer_gcp_wif_dir }}/gcloud"
  # Rendered every converge so a changed audience takes effect; the output is
  # a deterministic function of the inputs above.
  changed_when: false

- name: Restrict the external-account configuration
  ansible.builtin.file:
    path: "{{ generator_scorer_gcp_wif_dir }}/credential.json"
    owner: root
    group: root
    mode: "0600"

- name: Read the Platform bearer through the federated instance role
  ansible.builtin.command: >-
    gcloud secrets versions access latest
    --secret={{ generator_scorer_token_secret }} --project={{ generator_scorer_gcp_project }}
  environment:
    CLOUDSDK_CONFIG: "{{ generator_scorer_gcp_wif_dir }}/gcloud"
    CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: "{{ generator_scorer_gcp_wif_dir }}/credential.json"
  register: generator_scorer_token_read
  changed_when: false
  no_log: true
