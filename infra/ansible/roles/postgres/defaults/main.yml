---
# Logical app role; password is generated/stored on the box, NOT in the repo.
postgres_app_user: ditto

# Must postgres_app_password be supplied externally (normally from
# $DITTO_PG_PASSWORD via group_vars)? false = the Hetzner dittobox behaviour,
# where the box-generated random password below is the correct answer.
#
# The GCP VMs set this true (group_vars/role_postgres.yml,
# role_platform_postgres.yml): there the password MUST equal the one Terraform
# baked into the Cloud Run connection-URI secrets / the platform-db-password
# Secret Manager entry. Generating a box-local random one there is silently
# wrong in exactly the way the 2026-07-23 .env placeholder incident was — the
# converge succeeds and the breakage surfaces later, as auth failures nobody can
# explain because no one holds the generated password.
postgres_app_password_required: false

# Databases. Each is created idempotently with the standard extension set.
postgres_databases:
  - ditto_prod
  - ditto_staging
  - ditto_staging_2
  - ditto_staging_3
  - ditto_staging_4
  - ditto_staging_5
  - ditto_staging_6
  - ditto_staging_7
  - ditto_staging_8

# --- Logging-collector retention (issue #1745) --------------------------------
# log_rotation_age / log_rotation_size below only START a new log file; PostgreSQL
# never deletes one. With one 635 MB file per day and no retention, the collector
# directory reached 12 GB and filled ditto-pg-platform's 30 GB root filesystem on
# 2026-09-08, crash-looping the cluster for 5.5 hours.
#
# log_truncate_on_rotation is deliberately NOT used: it only truncates on
# time-based rotation when the new name collides with an existing file, which
# never happens with a '%Y-%m-%d' log_filename, and it would not reclaim the
# files already on disk. A systemd timer that rotates AND reclaims is the same
# shape as screener_cache_gc_* on the screener hosts, so it is reused here.
#
# Two explicit bounds, applied in that order by the script:
#   retention_days — normal policy; matches the 7 days the incident recovery kept;
#   max_total_mb   — hard ceiling, oldest-first, so a burst cannot outrun the age
#                    policy. 6144 MB covers ~7 days at the measured 635 MB/day
#                    with headroom, and is ~6% of the 100 GB boot disk.
# The live file the collector is writing is never deleted, so the directory is
# bounded by max_total_mb plus one day's active file.
postgres_log_gc_enabled: true # false stops and disables the timer
postgres_log_gc_unit: ditto-postgres-log-gc
postgres_log_gc_bin: /usr/local/sbin/ditto-postgres-log-gc
# Must equal log_directory in postgres_tuning (unquoted).
postgres_log_gc_dir: "{{ ditto_logs | default('/opt/ditto/logs') }}/postgresql"
# Must match log_filename in postgres_tuning (unquoted). Only files matching this
# pattern, directly in the directory above, are ever deleted.
postgres_log_gc_glob: "postgresql-*.log"
postgres_log_gc_retention_days: 7
postgres_log_gc_max_total_mb: 6144
# The collector's live-file map; every path it names is protected. Resolved from
# the discovered cluster version in tasks/main.yml.
postgres_log_gc_current_logfiles: ""
postgres_log_gc_data_dir: /var/lib/postgresql
postgres_log_gc_on_calendar: hourly # systemd OnCalendar cadence
postgres_log_gc_randomized_delay: 5min
# true logs the policy and the full deletion plan but deletes nothing (rehearsal).
postgres_log_gc_dry_run: false

# --- Attached persistent data disk (DEFAULT OFF, issue #1745) ------------------
# Terraform attaches ditto-pg-platform-data but nothing formatted or mounted it,
# so PGDATA, WAL, and the collector logs all share the boot disk. Enabling this
# mounts the volume only; it never relocates the cluster. See
# roles/postgres/tasks/data_disk.yml and the release-ops platform-host-disk
# reference for the offline migration runbook.
postgres_data_disk_enabled: false
# GCE exposes an attached disk by its device_name under /dev/disk/by-id. That is
# stable across reboots; /dev/sdb is not.
postgres_data_disk_device: /dev/disk/by-id/google-ditto-pg-platform-data
postgres_data_disk_fstype: ext4
postgres_data_disk_mountpoint: /opt/ditto/pgdata
postgres_data_disk_mount_opts: "defaults,noatime,nofail"
# Second, independent gate: mkfs runs only with this true AND blkid reporting no
# existing filesystem. An already-formatted disk is never reformatted.
postgres_data_disk_allow_format: false

postgres_extensions:
  - { name: vector,             schema: public }
  - { name: pg_stat_statements, schema: extensions }
  - { name: uuid-ossp,          schema: extensions }
  - { name: pgcrypto,           schema: extensions }

# Tuning for 64 GB RAM + NVMe. shared_buffers / effective_cache_size match the
# values measured live on ditto-prod-1 (2026-06-17): the box runs 20GB / 60GB,
# not the original 16GB / 48GB — bumped here so a converge is a no-op against live.
postgres_tuning:
  listen_addresses: "'localhost'"
  shared_buffers: "20GB"
  effective_cache_size: "60GB"
  work_mem: "16MB"
  maintenance_work_mem: "2GB"
  wal_buffers: "64MB"
  huge_pages: "try"
  wal_level: "replica"
  max_wal_senders: 3
  wal_keep_size: "2GB"
  max_wal_size: "4GB"
  min_wal_size: "1GB"
  checkpoint_timeout: "15min"
  checkpoint_completion_target: 0.9
  random_page_cost: 1.1
  effective_io_concurrency: 200
  seq_page_cost: 1.0
  max_parallel_workers: 8
  max_parallel_workers_per_gather: 4
  max_parallel_maintenance_workers: 4
  max_connections: 200
  autovacuum_vacuum_scale_factor: 0.05
  autovacuum_analyze_scale_factor: 0.025
  autovacuum_vacuum_cost_delay: "2ms"
  log_min_duration_statement: 500
  log_checkpoints: "on"
  log_lock_waits: "on"
  log_temp_files: 0
  log_directory: "'/opt/ditto/logs/postgresql'"
  logging_collector: "on"
  log_filename: "'postgresql-%Y-%m-%d.log'"
  log_rotation_age: "1d"
  log_rotation_size: "100MB"
  # Bind parameters in DETAIL lines are capped so one slow statement cannot
  # write kilobytes of payload per execution (PostgreSQL 15+). The statement
  # text itself is still logged whole.
  log_parameter_max_length: 1024
  shared_preload_libraries: "'pg_stat_statements'"

# Collector-log retention. The 2026-09-08 outage was the 30 GB boot disk
# filling with 12 GB of daily slow-query logs that nothing pruned (about
# 600 MB/day at log_min_duration_statement=500). A daily timer gzips finished
# day files and deletes anything older than the retention window.
postgres_log_retention_days: 7
postgres_log_compress_after_days: 1
postgres_log_prune_on_calendar: "*-*-* 01:15:00"
