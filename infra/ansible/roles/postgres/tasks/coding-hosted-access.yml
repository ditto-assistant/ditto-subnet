---
- name: Require exact reviewed native Coding database admission
  ansible.builtin.assert:
    that:
      - coding_hosted_postgres_enabled is boolean
      - inventory_hostname == 'ditto-pg-platform'
      - inventory_hostname in groups.get('role_platform_postgres', [])
      - coding_hosted_postgres_client_ip is string
      - coding_hosted_postgres_client_ip | trim == coding_hosted_postgres_client_ip
      - coding_hosted_postgres_client_ip is match('^10[.]33[.]0[.]([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-3])$')
      - postgres_app_user | default('ditto') == 'ditto'
      - "'ditto_platform_prod' in postgres_databases"
    fail_msg: Require the exact native-host IP from the reviewed Terraform output and the existing Platform production database principal.
  when: coding_hosted_postgres_enabled | default(false) | bool
