---
- name: Require explicit immutable package and signing-key selections
  ansible.builtin.assert:
    that:
      - coding_hosted_daemon_enabled | bool
      - coding_hosted_packages_enabled | bool
      - ansible_facts['distribution_release'] == 'trixie'
      - coding_hosted_docker_version is match('^[0-9][A-Za-z0-9.+:~_-]+$')
      - coding_hosted_containerd_version is match('^[0-9][A-Za-z0-9.+:~_-]+$')
      - coding_hosted_docker_key_sha256 is match('^[0-9a-f]{64}$')
      - >-
        (not (coding_hosted_package_recovery_enabled | bool)
         and coding_hosted_package_recovery_docker_version == ''
         and coding_hosted_package_recovery_containerd_version == '')
        or
        (coding_hosted_package_recovery_enabled | bool
         and coding_hosted_package_recovery_docker_version is match('^[0-9][A-Za-z0-9.+:~_-]+$')
         and coding_hosted_package_recovery_containerd_version is match('^[0-9][A-Za-z0-9.+:~_-]+$')
         and coding_hosted_package_recovery_docker_version != coding_hosted_docker_version
         and coding_hosted_package_recovery_containerd_version != coding_hosted_containerd_version)
    fail_msg: Bootstrap requires reviewed Debian 13 Docker/containerd versions and Docker signing-key SHA-256.

- name: Inspect installed packages without removing or upgrading them
  ansible.builtin.package_facts:
    manager: apt

- name: Refuse conflicting distribution container packages
  ansible.builtin.assert:
    that:
      - item not in ansible_facts.packages
    fail_msg: Conflicting runtime packages require separate reconciliation.
  loop: [docker.io, containerd, runc, podman-docker]

- name: Refuse existing Docker packages during ordinary first provisioning
  ansible.builtin.assert:
    that:
      - item not in ansible_facts.packages
    fail_msg: Existing runtime packages require an exact approved recovery.
  loop: [docker-ce, docker-ce-cli, docker-ce-rootless-extras, containerd.io]
  when: not (coding_hosted_package_recovery_enabled | bool)

- name: Require exact retained Docker versions during approved recovery
  ansible.builtin.assert:
    that:
      - item.name in ansible_facts.packages
      - ansible_facts.packages[item.name] | length == 1
      - ansible_facts.packages[item.name][0].version == item.version
    fail_msg: Retained runtime packages differ from the approved recovery state.
  loop:
    - {name: docker-ce, version: "{{ coding_hosted_package_recovery_docker_version }}"}
    - {name: docker-ce-cli, version: "{{ coding_hosted_package_recovery_docker_version }}"}
    - {name: docker-ce-rootless-extras, version: "{{ coding_hosted_package_recovery_docker_version }}"}
    - {name: containerd.io, version: "{{ coding_hosted_package_recovery_containerd_version }}"}
  loop_control:
    label: "{{ item.name }}"
  when: coding_hosted_package_recovery_enabled | bool

- name: Refuse a running containerd service without stopping it
  ansible.builtin.command:
    argv: [systemctl, is-active, containerd.service]
  register: coding_hosted_containerd_active
  changed_when: false
  failed_when: coding_hosted_containerd_active.rc not in [3, 4]

- name: Require rootful units masked during approved recovery
  ansible.builtin.command:
    argv: [systemctl, is-enabled, docker.service, docker.socket, containerd.service]
  register: coding_hosted_recovery_masks
  changed_when: false
  failed_when: >-
    coding_hosted_recovery_masks.rc not in [0, 1]
    or coding_hosted_recovery_masks.stdout_lines != ['masked', 'masked', 'masked']
  when: coding_hosted_package_recovery_enabled | bool

# Masking works before package unit files exist. Do not try to disable a
# nonexistent unit here, and never use state=stopped to bypass the guards.
- name: Mask runtime units before any apt operation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: [docker.service, docker.socket, containerd.service]

- name: Install Debian rootless prerequisites without service autostart
  ansible.builtin.apt:
    name: [ca-certificates, dbus-user-session, uidmap, slirp4netns, nftables]
    state: present
    update_cache: true
    policy_rc_d: 101
    install_recommends: false
    allow_unauthenticated: false
    allow_downgrade: false
    fail_on_autoremove: true
    auto_install_module_deps: false

- name: Create the root-owned dedicated repository key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch only the checksum-approved Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/coding-hosted-docker.asc
    checksum: "sha256:{{ coding_hosted_docker_key_sha256 }}"
    validate_certs: true
    owner: root
    group: root
    mode: "0644"

- name: Configure the fixed signed Debian 13 amd64 Docker source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/coding-hosted-docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/coding-hosted-docker.asc

- name: Pin exact versions before the approved Docker origin
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/coding-hosted-docker
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: docker-ce docker-ce-cli docker-ce-rootless-extras
      Pin: version {{ coding_hosted_docker_version }}
      Pin-Priority: 1001

      Package: containerd.io
      Pin: version {{ coding_hosted_containerd_version }}
      Pin-Priority: 1001

      Package: docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io
      Pin: origin download.docker.com
      Pin-Priority: 990

- name: Remove the superseded later-sorting version pin fragment
  ansible.builtin.file:
    dest: /etc/apt/preferences.d/coding-hosted-docker-versions
    state: absent

- name: Install exact Docker and containerd versions without service autostart
  ansible.builtin.apt:
    name:
      - "docker-ce={{ coding_hosted_docker_version }}"
      - "docker-ce-cli={{ coding_hosted_docker_version }}"
      - "docker-ce-rootless-extras={{ coding_hosted_docker_version }}"
      - "containerd.io={{ coding_hosted_containerd_version }}"
    state: present
    update_cache: true
    policy_rc_d: 101
    install_recommends: false
    allow_unauthenticated: false
    allow_downgrade: "{{ coding_hosted_package_recovery_enabled | bool }}"
    fail_on_autoremove: true
    auto_install_module_deps: false

- name: Disable the now-installed masked runtime units without starting them
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop: [docker.service, docker.socket, containerd.service]

- name: Verify installed containerd identity
  ansible.builtin.command:
    argv: [dpkg-query, -W, '--showformat=${Version}', containerd.io]
  register: coding_hosted_containerd_package
  changed_when: false
  failed_when: coding_hosted_containerd_package.stdout != coding_hosted_containerd_version

- name: Confirm package installation left rootful services inactive
  ansible.builtin.command:
    argv: [systemctl, is-active, docker.service, docker.socket, containerd.service]
  register: coding_hosted_bootstrap_services
  changed_when: false
  failed_when: coding_hosted_bootstrap_services.rc not in [3, 4]
