[defaults]
inventory             = inventory/gcp.yml
host_key_checking     = True
retry_files_enabled   = False
forks                 = 10
# Every managed host is reached through an IAP tunnel (see the ProxyCommand in
# group_vars/role_*.yml), and `gcloud compute start-iap-tunnel` routinely takes
# longer than ansible's 10s default to hand back a usable socket. The symptom is
# a bare `connect to host <private-ip> port 22: Operation timed out`, which reads
# like an unreachable host rather than an impatient client.
timeout               = 90
roles_path            = roles
# DEPRECATED KEY, INTENTIONALLY LEFT AS-IS — do not rename without reading this.
# ansible-core deprecated `collections_paths` in favour of the singular
# `collections_path`, and 2.19+ dropped the plural spelling entirely: on
# ansible-core 2.21 this line is already a silent no-op and collections resolve
# from the default ~/.ansible/collections. On 2.18 it IS honoured
# and *replaces* the default search path with ./collections — a directory
# nothing in this repo or in .depot/workflows/infra-ci.yml ever creates
# (CI runs `ansible-galaxy collection install -r infra/ansible/requirements.yml` with
# no -p, so collections land in ~/.ansible/collections).
# Renaming the key therefore changes real behaviour on 2.21 rather than
# preserving it, and untangling it means deciding whether collections should be
# vendored into infra/ansible/collections (as .gitignore implies) or left at the
# default. Out of scope for a deprecation sweep; needs its own change.
collections_paths     = collections
# The community.general.yaml stdout callback is deprecated (removed in
# community.general 12.0.0); ansible-core's own `default` callback with the
# result_format=yaml option is the supported replacement.
# NB: the ini key is `callback_result_format`, NOT `result_format` — the latter
# is silently ignored. Verified identical on ansible-core 2.18 (what CI pins)
# and 2.21 (what runs locally).
stdout_callback       = default
callback_result_format = yaml
callbacks_enabled     = profile_tasks, timer
interpreter_python    = auto_silent
gathering             = smart

[ssh_connection]
pipelining            = True
# StrictHostKeyChecking is deliberately NOT pinned to `yes` here. ssh honours the
# FIRST occurrence of an option, and these args are placed ahead of
# ansible_ssh_common_args -- so a `yes` here silently overrode the `accept-new`
# that group_vars/role_*.yml set for exactly this purpose, and every first
# connect to a freshly-created VM failed with "No ED25519 host key is known".
# `accept-new` trusts a key on first sight and still verifies it thereafter,
# which is the property those group_vars documented and could not deliver.
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
control_path_dir      = ~/.ansible/cp
