---
# Applies to the private generator-competition scorer VM (label
# role=generator-scorer -> group role_generator_scorer).
gcp_project: ditto-app-dev
gcp_region: us-central1

ansible_user: "{{ lookup('env', 'GCP_OSLOGIN_USER') | default('', true) }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="gcloud compute start-iap-tunnel {{ inventory_hostname }} 22
  --listen-on-stdin --zone={{ gcp_zone }} --project={{ gcp_project }}
  --verbosity=warning"
base_ssh_set_allow_users: false
# The base role's checksum-pinned Go toolchain builds challenge-scorer.
base_install_go: true
base_install_caddy: false
base_install_postgres_packages: false
