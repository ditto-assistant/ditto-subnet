---
# Applies to the SN118 validator VM (label role=validator → group
# role_validator). Per-VM specifics (chain endpoint, netuid, hotkey) live in
# host_vars/ditto-validator-{dev,prod}.yml.

# --- GCP placement ---
gcp_project: ditto-app-dev
gcp_region: us-central1
gcp_zone: us-central1-a

# --- Connection over IAP (the VM has no public IP; SSH via the IAP tunnel) ---
# Mirrors group_vars/role_platform_app.yml. Set GCP_OSLOGIN_USER to your OS Login
# username.
ansible_user: "{{ lookup('env', 'GCP_OSLOGIN_USER') | default('', true) }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="gcloud compute start-iap-tunnel {{ inventory_hostname }} 22
  --listen-on-stdin --zone={{ gcp_zone }} --project={{ gcp_project }}
  --verbosity=warning"

# OS Login + IAM is the SSH gate; don't emit sshd AllowUsers (would lock out the
# OS Login user Ansible connects as).
base_ssh_set_allow_users: false

# The dittobench role installs its own checksum-pinned Go 1.23.6 toolchain,
# which actually builds dittobench-api. The base role's Go install is redundant
# here, so rely on the dittobench role's independently pinned toolchain.
base_install_go: false

# --- E1: Pylon identity (write) path (put_weights) --------------------------
# Shared by the validator_worker (client env) + validator_pylon (sidecar) roles,
# so both see it regardless of play order. OFF here: the dev localnet uses the
# SDK weight path (host_vars sets validator_use_sdk_weights: true). For
# testnet/finney, set this true in the target host_vars AND set
# validator_use_sdk_weights: false. Pylon signs set_weights from a mounted
# hotkey; the two tokens are self-generated bearer secrets
# (`openssl rand -base64 32`) populated out-of-band (see docs/validator-deploy.md).
validator_pylon_identity_enabled: false
validator_pylon_url: "http://127.0.0.1:8001"
validator_pylon_identity_name: validator
validator_pylon_identity_token_secret: validator-pylon-identity-token
validator_pylon_open_access_token_secret: validator-pylon-open-access-token
