---
# Applies to the ditto-platform app VMs (label role=platform-app → group
# role_platform_app). Per-VM specifics (env, domain, branch, database, bucket,
# per-env secret names) live in host_vars/ditto-platform-{dev,prod}.yml.

# --- GCP placement ---
gcp_project: ditto-app-dev
gcp_region: us-central1
gcp_zone: us-central1-a

# --- Connection over IAP ---
# These VMs have a public IP for HTTP(S) (80/443) but SSH (22) is IAP-only — the
# network module opens 22 only to the IAP range. So Ansible still tunnels via IAP.
# Set GCP_OSLOGIN_USER to your OS Login username.
ansible_user: "{{ lookup('env', 'GCP_OSLOGIN_USER') | default('', true) }}"
# accept-new: trust the host key on first connect to a freshly-created VM (no
# known_hosts entry yet) without disabling verification on later connects.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="gcloud compute start-iap-tunnel {{ inventory_hostname }} 22
  --listen-on-stdin --zone={{ gcp_zone }} --project={{ gcp_project }}
  --verbosity=warning"

# OS Login + IAM is the SSH gate here, and the connecting OS Login username is
# not in base_ssh_allow_users — so DON'T emit sshd AllowUsers (it would lock out
# the OS Login user Ansible itself connects as, mid-converge).
base_ssh_set_allow_users: false

# The app host needs uv (the API runs under uv) but not Go.
base_install_go: false

# --- Values from `terraform -chdir=infra/terraform/stacks/gcp-platform output` ---
# Same Postgres VM + HMAC key serve both app envs, so these live here (shared),
# not in host_vars. Pass at runtime via env, or hard-set after the first apply:
#   pg_internal_ip          -> platform_pg_host
#   storage_hmac_access_id  -> platform_storage_access_key
#
# Export them all in one step with `source infra/ansible/scripts/platform-app-env.sh`.
#
# The TODO_ defaults below are NOT harmless: on 2026-07-23 a converge run with
# only $GCP_OSLOGIN_USER exported rendered them straight into prod's
# /opt/ditto-platform/.env and still reported ok=54 changed=2 failed=0. They are
# kept (a placeholder is easier to spot than an empty string) but are now caught
# twice: platform_app/tasks/preflight.yml fails before anything renders, and the
# env_render_guard role fails if any TODO_ token reaches the written file.
platform_pg_host: "{{ lookup('env', 'PLATFORM_PG_HOST') | default('TODO_TF_OUTPUT_pg_internal_ip', true) }}"
platform_storage_access_key: "{{ lookup('env', 'PLATFORM_STORAGE_ACCESS_KEY') | default('TODO_TF_OUTPUT_storage_hmac_access_id', true) }}"

# Code-embedding service Cloud Run URL (TF output `embedder_url`). Shared by both app envs
# (one embedder serves dev + prod). Empty = disabled, so the signal is opt-in:
#   terraform -chdir=infra/terraform/stacks/gcp-platform output -raw embedder_url
platform_embedder_url: "{{ lookup('env', 'PLATFORM_EMBEDDER_URL') | default('', true) }}"

# Dataset-generation service Cloud Run URL (TF output `datapipeline_url`). Shared by
# both app envs. Empty = disabled: no per-submission dataset is pinned (scores carry
# no on-chain seed provenance and no reproduction command), so pinning is opt-in:
#   terraform -chdir=infra/terraform/stacks/gcp-platform output -raw datapipeline_url
platform_datapipeline_url: "{{ lookup('env', 'PLATFORM_DATAPIPELINE_URL') | default('', true) }}"

# Environment-scoped, non-secret outputs from the default-off coding storage
# authorities. platform-app-env.sh selects the exact dev/prod map entry through
# PLATFORM_TARGET_ENV. Empty values keep both Platform integrations disabled.
platform_coding_catalog_bucket: "{{ lookup('env', 'PLATFORM_CODING_PRIVATE_INPUT_BUCKET') | default('', true) }}"
platform_coding_catalog_access_key: "{{ lookup('env', 'PLATFORM_CODING_PRIVATE_INPUT_ACCESS_KEY') | default('', true) }}"
platform_coding_evidence_bucket: "{{ lookup('env', 'PLATFORM_CODING_EVIDENCE_BUCKET') | default('', true) }}"
platform_coding_evidence_access_key: "{{ lookup('env', 'PLATFORM_CODING_EVIDENCE_ACCESS_KEY') | default('', true) }}"

# Serve the ticket-scoped OpenRouter proxy for the v7 rollout while issuance
# remains additive. `platform_inference_proxy_required` stays false until the
# validator transition has drained v6 and removed provider-owned fallback.
platform_inference_proxy_enabled: true
