---
# Converge the dedicated ditto-platform Postgres VM (infra/terraform/stacks/gcp-platform →
# ditto-pg-platform). Creates ditto_platform_dev + ditto_platform_prod with the
# standard extension set and db-staging tuning.
#
# Unlike gcp-pg.yml (the backend VM) this runs NO PgBouncer and NO River worker —
# the platform app talks to Postgres directly over asyncpg.
#
#   # First provision: export DITTO_PG_PASSWORD from the protected boundary.
#   # Day two: the existing root-owned password file is reused without export.
#   GCP_OSLOGIN_USER=… \
#     ansible-playbook -i infra/ansible/inventory/gcp.yml infra/ansible/playbooks/gcp-platform-pg.yml
- name: Converge ditto-platform Postgres VM
  hosts: role_platform_postgres
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate native Coding admission before any host or database mutation
      ansible.builtin.import_tasks: ../roles/postgres/tasks/coding-hosted-access.yml
      tags: [coding-postgres-validate]

    - name: Inspect the existing protected PostgreSQL password file
      ansible.builtin.stat:
        path: /opt/ditto/secrets/postgres-ditto.password
        follow: false
        get_checksum: false
        get_mime: false
      register: platform_pg_password_file

    # The `ditto` role password MUST equal the platform-db-password secret the
    # app reads, or every app->DB connection fails. First provisioning therefore
    # requires the external value. A day-two converge may retain the existing
    # protected file, which the role reads locally without returning its bytes.
    - name: Require the external password or the protected existing credential
      ansible.builtin.assert:
        that:
          - >-
            lookup('env', 'DITTO_PG_PASSWORD') | length > 0 or
            (platform_pg_password_file.stat.exists | default(false) and
             platform_pg_password_file.stat.isreg | default(false) and
             platform_pg_password_file.stat.pw_name | default('') == 'postgres' and
             platform_pg_password_file.stat.gr_name | default('') == 'postgres' and
             platform_pg_password_file.stat.mode | default('') == '0640' and
             platform_pg_password_file.stat.nlink | default(0) == 1 and
             platform_pg_password_file.stat.size | default(0) > 0)
        fail_msg: >-
          A first provision needs DITTO_PG_PASSWORD from the platform-db-password
          secret. A day-two converge requires the existing nonempty, single-link,
          postgres-owned mode-0640 password file at
          /opt/ditto/secrets/postgres-ditto.password. To provision initially:
          export DITTO_PG_PASSWORD=$(gcloud secrets versions access latest
          --secret=platform-db-password --project=ditto-app-dev)
        quiet: true
      run_once: true
  roles:
    - base
    - postgres
