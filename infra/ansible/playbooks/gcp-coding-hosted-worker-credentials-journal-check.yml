---
# Redacted first-run spot-check, run once after the first worker credential
# materialization. It reads the three worker credential files on the host only
# to derive search needles in memory, scans the whole journal, the text logs in
# /var/log and the Ansible temp locations, and reports only per-class counts and
# booleans: never a matching line, value, needle or digest. It writes nothing
# and starts nothing, and needs no secret on the controller.
#
# Run it only through the guarded entry point, from a clean checkout of the
# reviewed revision, with no DITTO_CODING_WORKER_* input exported (the guard
# refuses one). Direct ansible-playbook runs are unsupported; the role refuses
# one that lacks the guard's marker, which is an accident guard only (see
# infra/docs/coding-hosted-worker-credentials-v2.md).
#
#   GCP_OSLOGIN_USER=… uv run --locked --script infra/scripts/coding-hosted-guarded-run.py \
#     worker-credentials-journal-check <reviewed 40-hex revision>
- name: Spot-check native Coding worker credential logs without printing any value
  hosts: role_coding_hosted
  become: true
  # Identity comes from the role's registered probe, which extra vars cannot
  # preset; gathered facts would be replaced by a -e ansible_facts value.
  gather_facts: false
  vars:
    # The ssh connection plugin's own input: pipelining streams the module over
    # stdin, and the role's guard confirms it.
    ansible_pipelining: true
  roles:
    - coding_hosted_worker_credentials_journal_check
