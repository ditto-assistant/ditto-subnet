---
# Materialize the native Coding host's PostgreSQL environment copies. This is a
# separate protected convergence: only an operator who already holds the
# platform-db-password secret runs it, and no workflow identity gets Secret
# Manager access. It writes files only; it starts nothing.
#
#   export DITTO_CODING_PG_PASSWORD=$(gcloud secrets versions access latest \
#     --secret=platform-db-password --project=ditto-app-dev)
#   GCP_OSLOGIN_USER=… ansible-playbook -i infra/ansible/inventory/gcp.yml \
#     infra/ansible/playbooks/gcp-coding-hosted-postgres-environment.yml \
#     --limit ditto-coding-hosted-v2 -e '{"coding_hosted_postgres_environment_enabled": true, …}'
#   unset DITTO_CODING_PG_PASSWORD
- name: Materialize native Coding PostgreSQL environment copies without starting a service
  hosts: role_coding_hosted
  become: true
  gather_facts: true
  roles:
    - coding_hosted_postgres_environment
