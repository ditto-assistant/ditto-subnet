---
# Converge the SN118 validator VM (label role=validator → group role_validator).
# Installs the base hardening + Go/Docker (via the dittobench role), builds and
# runs the co-located dittobench-api scoring engine, then installs the stateless
# validator worker (ditto-subnet `python -m ditto.validator`).
#
# Per-VM config (chain endpoint, netuid, hotkey, platform URL) lives in
# host_vars/ditto-validator-<env>.yml; shared connection/config in
# group_vars/role_validator.yml. Secrets are read from Secret Manager at
# converge time via the VM's attached SA — populate them first (see
# docs/validator-deploy.md).
#
#   GCP_OSLOGIN_USER=… \
#     ansible-playbook -i infra/ansible/inventory/gcp.yml infra/ansible/playbooks/gcp-validator.yml \
#       -e validator_native_legacy_ack=true   # see the guard below before passing this
- ansible.builtin.import_playbook: require-hosts.yml
  vars:
    required_group: role_validator

# This native-VM path predates the monorepo: the dittobench role still builds
# the archived ditto-assistant/dittobench-api repo and validator_worker pins
# ditto-subnet v0.25.2. Converging it installs a frozen v6 relay that collides
# with the host's existing relay on :11435 and starts a worker that requires a
# setting the role never renders. Production validators run the Compose stack
# (gcp-validator-prod.yml). Refuse to converge until the roles are rebuilt on
# monorepo sources, unless an operator explicitly accepts the stale pins.
- name: Refuse to converge the pre-monorepo native validator
  hosts: localhost:all
  gather_facts: false
  tags: always
  tasks:
    - name: Require an explicit legacy acknowledgement
      run_once: true
      ansible.builtin.assert:
        that:
          - validator_native_legacy_ack | default(false) | bool
        fail_msg: >-
          gcp-validator.yml converges pre-monorepo sources (dittobench-api
          001d3aa, ditto-subnet v0.25.2) and leaves dittobench-model-relay and
          ditto-validator crash-looping. Use gcp-validator-prod.yml for
          production. Pass -e validator_native_legacy_ack=true only to
          deliberately converge these stale pins.
        quiet: true

- name: Converge the SN118 validator VM
  hosts: role_validator
  become: true
  gather_facts: true
  roles:
    - base
    - dittobench
    - validator_worker
    # E1: Pylon identity (write) sidecar. No-op unless
    # validator_pylon_identity_enabled (testnet/finney). After validator_worker
    # so the worker venv (bittensor) exists to materialize the hotkey wallet.
    - validator_pylon
