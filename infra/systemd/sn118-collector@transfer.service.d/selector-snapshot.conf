# Optional operator-staged hook; neither installed nor enabled by release.
# Snapshot is allowlisted private observation metadata, never money authority.
[Service]
ExecStart=
ExecStart=/opt/sn118-collector/.venv/bin/python /opt/sn118-collector/scripts/treasury_collector.py --role transfer --policy /etc/sn118-collector/transfer/policy.json --policy-sha256 ${POLICY_SHA256} --journal /var/lib/sn118-collector-transfer/journal.db --selector-snapshot /var/lib/sn118-collector-transfer/selector-snapshot.db
