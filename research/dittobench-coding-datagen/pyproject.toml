[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dittobench-coding-datagen"
version = "0.1.0"
description = "Shadow-only compiler and validator for DittoBench coding-repair task capsules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
dittobench-coding-datagen = "dittobench_coding_datagen.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dittobench_coding_datagen"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["practice"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
