[release]
# These files are deliberately non-runtime. Any changed path that is neither
# mapped below nor listed here makes release planning fail closed so new
# production inputs cannot silently bypass semantic release.
ignored_paths = [
  ".env.example",
  ".agents/**",
  ".claude/**",
  ".codex/**",
  ".github/**",
  ".gitignore",
  ".pre-commit-config.yaml",
  "AGENTS.md",
  "CLAUDE.md",
  "LICENSE*",
  "README*",
  "CHANGELOG.md",
  "Makefile",
  "apps/platform/.agents/**",
  "docs/**",
  "ditto/tests/**",
  "infra/**",
  "scripts/check_netns_incompatible.py",
  "scripts/gen_validator_contract.py",
  "scripts/run-validator.sh",
  "services/dittobench-api/docs/**",
  "services/dittobench-api/*.md",
  "services/dittobench-api/.gitignore",
  "services/dittobench-api/LICENSE",
  "tests/**",
  "skills-lock.json",
]

[components.screening_protocol]
description = "Shared screener wire and signing protocol"
paths = [
  "packages/ditto-screening-protocol/**",
]

[components.miner_cli]
description = "Miner CLI distribution"
depends_on = ["screening_protocol"]
paths = [
  "ditto/__init__.py",
  "ditto/miner_cli/**",
  "ditto/api_models/__init__.py",
  "ditto/api_models/agent_status.py",
  "ditto/api_models/attestation.py",
  "ditto/api_models/health.py",
  "ditto/api_models/retrieval.py",
  "ditto/api_models/upload.py",
]

[components.miner_starter_kit]
description = "Miner reference harness and local practice loop"
paths = [
  "miners/dittobench-starter-kit/**",
]

[components.validator]
description = "Validator worker image"
depends_on = ["screening_protocol"]
paths = [
  "Dockerfile",
  "ditto/__init__.py",
  "ditto/chain/**",
  "ditto/system_health.py",
  "ditto/validator/**",
  "ditto/api_models/agent_status.py",
  "ditto/api_models/benchmark_capacity.py",
  "ditto/api_models/benchmark_progress.py",
  "ditto/api_models/inference.py",
  "ditto/api_models/stack_health.py",
  "ditto/api_models/system_health.py",
  "ditto/api_models/upload.py",
  "ditto/api_models/validator.py",
  "ditto/api_models/validator_capabilities.py",
  "scripts/install-validator-stack-auto-update.sh",
  "scripts/test-validator-stack-auto-update-e2e.sh",
  "scripts/test-validator-stack-release-runtime.sh",
  "scripts/validator-compose.sh",
  "scripts/validator-stack-auto-update.sh",
  "scripts/validator-stack-compose.sh",
]

[components.sandbox_docker]
description = "Validator sandbox Docker daemon image"
paths = [
  "Dockerfile.sandbox-docker",
  "scripts/sandbox-docker-entrypoint.sh",
]

[components.dittobench_api]
description = "DittoBench scorer and hosted API"
depends_on = ["dittobench_datagen"]
paths = [
  "services/dittobench-api/Dockerfile*",
  "services/dittobench-api/calibration/**",
  "services/dittobench-api/cmd/**",
  "services/dittobench-api/compat/**",
  "services/dittobench-api/go.mod",
  "services/dittobench-api/go.sum",
  "services/dittobench-api/integrations/**",
  "services/dittobench-api/internal/**",
  "services/dittobench-api/scripts/**",
  "services/dittobench-api/skills-lock.json",
]

[components.dittobench_datagen]
description = "Deterministic benchmark generator and judge-free grader"
paths = [
  "research/dittobench-datagen/**",
]

[components.platform_api]
description = "Subnet API, database migrations, relays, and control plane"
depends_on = ["screening_protocol"]
paths = [
  "apps/platform/.agents/**",
  "apps/platform/alembic/**",
  "apps/platform/ditto/**",
  "apps/platform/docker/**",
  "apps/platform/docs/**",
  "apps/platform/scripts/**",
  "apps/platform/.env.example",
  "apps/platform/.gitignore",
  "apps/platform/.gitleaks.toml",
  "apps/platform/CLAUDE.md",
  "apps/platform/CODE_OF_CONDUCT.md",
  "apps/platform/CONTRIBUTING.md",
  "apps/platform/LICENSE",
  "apps/platform/Makefile",
  "apps/platform/README.md",
  "apps/platform/SECURITY.md",
  "apps/platform/UPSTREAM.md",
  "apps/platform/alembic.ini",
  "apps/platform/docker-compose.yml",
  "apps/platform/faircopy.config.mjs",
  "apps/platform/package-lock.json",
  "apps/platform/package.json",
  "apps/platform/pyproject.toml",
  "apps/platform/skills-lock.json",
  "apps/platform/uv.lock",
]

[components.platform_dashboard]
description = "Public Platform dashboard UI"
paths = [
  "apps/platform/dashboard/**",
]

[components.platform]
description = "Deployable Platform API and dashboard aggregate"
depends_on = ["platform_api", "platform_dashboard"]

[components.backroom]
description = "Subnet operations console"
depends_on = ["platform_api"]
paths = [
  "apps/backroom/**",
]

[components.screener]
description = "Screening worker"
depends_on = ["screening_protocol"]
paths = [
  "workers/screener/**",
]

[components.screener_orchestrator]
description = "Targon-first screener capacity and build controller"
depends_on = ["screener"]
paths = [
  "services/screener-orchestrator/**",
]

[components.validator_stack]
description = "Signed, digest-bound validator stack"
depends_on = ["validator", "sandbox_docker", "dittobench_api"]
paths = [
  ".dockerignore",
  ".github/workflows/release.yml",
  "Dockerfile.pylon",
  "Dockerfile.stack-release",
  "docker-compose.yml",
  "pyproject.toml",
  "release/components.toml",
  "scripts/build-stack-release.py",
  "scripts/release-plan.py",
  "uv.lock",
]
