[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dittobench-reranker"
version = "0.1.0"
description = "SN118 Season 2 reranker competition: contract, evaluation pools and deterministic scorer."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["dittobench_reranker"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
