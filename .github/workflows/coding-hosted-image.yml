name: Coding hosted image bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - infra/ansible/roles/coding_hosted_image/**
      - infra/ansible/roles/coding_hosted/files/daemon-policy.json
      - services/dittobench-api/**
      - research/dittobench-datagen/**
      - ditto/tests/test_coding_hosted_image_import.py
      - .github/workflows/coding-hosted-image.yml

permissions:
  contents: read

concurrency:
  group: coding-hosted-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-oci:
    name: public OCI digest-preserving import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Disposable CI engine only. This does not qualify a native rootless host.
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.1.3
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Regressions and real synthetic metadata import without container execution
        env:
          CODING_OCI_IMPORT_TEST: '1'
        run: uv run --frozen --with pyyaml pytest -q ditto/tests/test_coding_hosted_image_import.py
      - name: Build exact public Python runtime and verify offline digest lookup
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir public-image
          docker buildx build --platform linux/amd64 --provenance=false \
            -f services/dittobench-api/Dockerfile.coding-python --target runtime \
            --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" \
            --output type=oci,dest=public-image/source.oci.tar .
          importer=infra/ansible/roles/coding_hosted_image/files/image-bundle.py
          python3 "$importer" prepare --source public-image/source.oci.tar \
            --archive public-image/runtime.oci.tar --approval public-image/approval.json \
            --repository coding-hosted-ci.invalid/python/runtime --revision "$SOURCE_SHA"
          # Local test pin only; deployment requires independent operator review.
          approval_sha="$(sha256sum public-image/approval.json | cut -d ' ' -f 1)"
          docker image load --input public-image/runtime.oci.tar
          image_ref="$(jq -r .image_ref public-image/approval.json)"
          docker image inspect "$image_ref" > public-image/inspect.json
          python3 "$importer" verify --archive public-image/runtime.oci.tar \
            --approval public-image/approval.json --approval-sha256 "$approval_sha" \
            --inspect public-image/inspect.json
          sha256sum public-image/runtime.oci.tar public-image/approval.json public-image/inspect.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-coding-python-oci-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            public-image/runtime.oci.tar
            public-image/approval.json
            public-image/inspect.json
