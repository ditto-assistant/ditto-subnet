name: Sanitize preview snapshot

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'ditto-assistant/ditto-subnet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLATFORM_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Export production database without returning credentials
        run: |
          set -euo pipefail
          umask 077
          case "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" in
            *[!0-9-]*) echo "invalid workflow run identity" >&2; exit 2 ;;
          esac
          remote_dump="/tmp/sn118-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump"
          remote_script="/tmp/sn118-preview-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cleanup_remote() {
            gcloud compute ssh ditto-pg-platform \
              --zone "${{ vars.GCP_PLATFORM_ZONE }}" \
              --tunnel-through-iap \
              --quiet \
              --command "rm -f '$remote_dump' '$remote_script'" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT
          gcloud compute scp preview/cloud/export-snapshot.sh \
            "ditto-pg-platform:${remote_script}" \
            --zone "${{ vars.GCP_PLATFORM_ZONE }}" \
            --tunnel-through-iap \
            --quiet
          gcloud compute ssh ditto-pg-platform \
            --zone "${{ vars.GCP_PLATFORM_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command "sh '$remote_script' '$remote_dump'"
          gcloud compute scp "ditto-pg-platform:${remote_dump}" \
            "${RUNNER_TEMP}/source.dump" \
            --zone "${{ vars.GCP_PLATFORM_ZONE }}" \
            --tunnel-through-iap \
            --quiet
          test "$(LC_ALL=C head -c 5 "${RUNNER_TEMP}/source.dump")" = PGDMP

      - name: Sanitize in a disposable Postgres
        run: preview/cloud/sanitize-snapshot.sh "${RUNNER_TEMP}/source.dump" "${RUNNER_TEMP}/sanitized.dump"

      - name: Publish immutable sanitized snapshot
        env:
          SNAPSHOT_BUCKET: ${{ vars.GCP_PREVIEW_SNAPSHOT_BUCKET }}
        run: |
          set -euo pipefail
          : "${SNAPSHOT_BUCKET:?prod environment is missing GCP_PREVIEW_SNAPSHOT_BUCKET}"
          sha="$(sha256sum "${RUNNER_TEMP}/sanitized.dump" | cut -d' ' -f1)"
          object="gs://${SNAPSHOT_BUCKET}/sanitized/$(date -u +%Y%m%dT%H%M%SZ)-${sha}.dump"
          gcloud storage cp --if-generation-match=0 "${RUNNER_TEMP}/sanitized.dump" "$object"
          gcloud storage objects update "$object" --custom-metadata="source_sha=${GITHUB_SHA},sanitizer_sha=${GITHUB_SHA},sha256=${sha}"

      - name: Remove runner copies
        if: always()
        run: |
          shred -u "${RUNNER_TEMP}/source.dump" 2>/dev/null || rm -f "${RUNNER_TEMP}/source.dump"
          shred -u "${RUNNER_TEMP}/sanitized.dump" 2>/dev/null || rm -f "${RUNNER_TEMP}/sanitized.dump"
