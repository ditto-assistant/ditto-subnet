name: Platform verification

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git commit to verify
        required: true
        type: string
      security:
        description: Scan Platform source and history for leaked secrets
        required: false
        default: false
        type: boolean
      backend:
        description: Run Platform Python static checks and complete pytest shards
        required: false
        default: false
        type: boolean
      dashboard:
        description: Run Platform faircopy and dashboard checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/platform

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require at least one verification surface
        working-directory: .
        env:
          SECURITY: ${{ inputs.security }}
          BACKEND: ${{ inputs.backend }}
          DASHBOARD: ${{ inputs.dashboard }}
        run: |
          if [[ "$SECURITY" != true && "$BACKEND" != true && "$DASHBOARD" != true ]]; then
            echo "At least one Platform verification surface must be enabled" >&2
            exit 1
          fi

  security:
    needs: validate
    if: inputs.security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Enforce workflow security policy
        working-directory: .
        run: python3 .github/scripts/check_workflow_security.py

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_LINUX_X64_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan working tree for secrets
        run: gitleaks dir . --no-banner --redact=100

      - name: Scan reachable Git history for secrets
        # Gitleaks resolves Git history from the repository root even though
        # this job's working directory is apps/platform. Restrict the log to
        # Platform while still scanning every reachable Platform commit.
        run: gitleaks git . --log-opts="--all -- apps/platform" --no-banner --redact=100

  static:
    needs: validate
    if: inputs.backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy ditto/

      # The generated confirmation release assets are read at runtime by
      # Platform's profile installer, the Go runtime factory, and a
      # docker-compose SHA256 pin, so drift between the generator's constants
      # and the checked-in bytes breaks confirmation everywhere at once. The
      # reinstall is required: uv resolves ditto-screening-protocol from a
      # built copy of the path dependency, and a stale copy makes the check
      # validate the previous contract instead of this commit's.
      - name: Rebuild the screening protocol path dependency
        run: >-
          uv sync --locked --group dev --python 3.12
          --reinstall-package ditto-screening-protocol

      # Run from apps/platform: the script bootstraps sys.path itself but
      # still needs the Platform dependency set, so a repo-root invocation
      # fails on ModuleNotFoundError: sqlalchemy.
      - name: Confirmation release assets match their generator
        run: >-
          uv run python ../../scripts/generate_confirmation_installation.py
          --check

      - name: Coding execution delivery vectors match their generator
        run: |
          uv run ruff format --check ../../packages/dittobench-coding-contract/generate_execution_delivery_vectors.py
          uv run ruff check ../../packages/dittobench-coding-contract/generate_execution_delivery_vectors.py
          uv run python ../../packages/dittobench-coding-contract/generate_execution_delivery_vectors.py --check

  test:
    needs: validate
    if: inputs.backend
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: public-validator-endpoints
            pytest_args: >-
              ditto/tests/api_server/endpoints/test_public.py
              ditto/tests/api_server/endpoints/test_validator.py
            object_storage: false
          # test_screener.py and test_inference.py are the two largest files
          # after the public/validator pair; their own shard keeps the four
          # endpoint-heavy lanes near-equal instead of one ~5-minute long pole.
          - suite: screener-inference-endpoints
            pytest_args: >-
              ditto/tests/api_server/endpoints/test_screener.py
              ditto/tests/api_server/endpoints/test_inference.py
            object_storage: false
          - suite: other-endpoints
            pytest_args: >-
              ditto/tests/api_server/endpoints
              --ignore=ditto/tests/api_server/endpoints/test_public.py
              --ignore=ditto/tests/api_server/endpoints/test_validator.py
              --ignore=ditto/tests/api_server/endpoints/test_screener.py
              --ignore=ditto/tests/api_server/endpoints/test_inference.py
            object_storage: false
          - suite: api-server
            pytest_args: ditto/tests/api_server --ignore=ditto/tests/api_server/endpoints
            object_storage: false
          - suite: data-contract-integration
            pytest_args: --ignore=ditto/tests/api_server
            object_storage: true
    services:
      # Every shard gets its own real Postgres. SQLite emitted no FOR UPDATE,
      # had no pg_advisory_xact_lock, and had no concurrent writers, so it
      # could not fail on the bug class that reaches production -- see
      # ditto-platform#438.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ditto_test
          POSTGRES_PASSWORD: ditto_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ditto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: Tune disposable Postgres
        # Match the local test harness: these databases are rebuilt from the
        # migration template and never hold durable data. tmpfs alone still
        # makes Postgres spend CPU on WAL and checkpoints.
        env:
          DITTO_TEST_POSTGRES_URI: postgres://ditto_test:ditto_test@localhost:5432/postgres
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              dsn = os.environ["DITTO_TEST_POSTGRES_URI"]
              conn = await asyncpg.connect(dsn)
              try:
                  for setting in ("fsync", "synchronous_commit", "full_page_writes"):
                      await conn.execute(f"ALTER SYSTEM SET {setting} = 'off'")
                  if not await conn.fetchval("SELECT pg_reload_conf()"):
                      raise RuntimeError("Postgres refused to reload test settings")
              finally:
                  await conn.close()

              conn = await asyncpg.connect(dsn)
              try:
                  rows = await conn.fetch(
                      "SELECT name, setting FROM pg_settings "
                      "WHERE name = ANY($1::text[])",
                      ["fsync", "synchronous_commit", "full_page_writes"],
                  )
                  actual = {row["name"]: row["setting"] for row in rows}
                  if actual != {
                      "fsync": "off",
                      "synchronous_commit": "off",
                      "full_page_writes": "off",
                  }:
                      raise RuntimeError(f"unexpected Postgres test settings: {actual}")
              finally:
                  await conn.close()


          asyncio.run(main())
          PY

      # Only integration tests request the object_storage fixture. Keeping
      # MinIO out of the other shards avoids image pulls and startup loops
      # without weakening the hard requirement in the shard that uses it.
      - name: Start MinIO
        if: matrix.object_storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=miniominio \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null
          docker run --rm --network host --entrypoint sh \
            minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -c \
            'mc alias set local http://localhost:9000 minio miniominio && \
             mc mb --ignore-existing local/ditto-agents'

      - name: pytest
        env:
          # The harness creates a migrated template and one database per
          # xdist worker, so this role must be able to CREATE DATABASE.
          DITTO_TEST_POSTGRES_URI: postgres://ditto_test:ditto_test@localhost:5432/postgres
          DITTO_REQUIRE_POSTGRES: "1"
          # The integration shard must fail rather than skip if MinIO is down.
          # The other shards never request the fixture, so this remains inert.
          DITTO_REQUIRE_OBJECT_STORAGE: "1"
          DITTO_UPLOAD_PAYMENT_ADDRESS: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          PYLON_URL: http://127.0.0.1:1
          PYLON_OPEN_ACCESS_TOKEN: ci-no-chain
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_ACCESS_KEY: minio
          STORAGE_SECRET_KEY: miniominio
          STORAGE_BUCKET: ditto-agents
          STORAGE_REGION: us-east-1
          STORAGE_USE_TLS: "false"
        run: uv run pytest ${{ matrix.pytest_args }}

  dashboard:
    needs: validate
    if: inputs.dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/platform/package-lock.json
            apps/platform/dashboard/package-lock.json

      - name: Install copy dependencies
        run: npm ci

      - name: faircopy
        run: npm run lint:copy -- --format github

      - name: Install dashboard dependencies
        working-directory: apps/platform/dashboard
        run: npm ci

      - name: Check
        working-directory: apps/platform/dashboard
        run: npm run check

      - name: Test
        working-directory: apps/platform/dashboard
        run: npm test

      - name: Build
        working-directory: apps/platform/dashboard
        run: npm run build
