name: Infrastructure CI

on:
  pull_request:
    paths:
      - infra/**
      - scripts/test-coding-hosted-connectivity-kernel.py
      - .github/workflows/infra-ci.yml
      - .github/workflows/infra-plan-apply.yml
      - ditto/tests/test_coding_hosted_worker_credentials.py
      - ditto/tests/test_coding_hosted_worker_credentials_journal_check.py
      - ditto/tests/test_coding_hosted_guarded_run.py
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - infra/**
      - scripts/test-coding-hosted-connectivity-kernel.py
      - .github/workflows/infra-ci.yml
      - .github/workflows/infra-plan-apply.yml
      - ditto/tests/test_coding_hosted_worker_credentials.py
      - ditto/tests/test_coding_hosted_worker_credentials_journal_check.py
      - ditto/tests/test_coding_hosted_guarded_run.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  coding-connectivity-kernel:
    name: Native Coding network kernel boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only network tools
        run: |
          # Only Ubuntu packages are needed here. Ignore unrelated third-party
          # runner sources, which can be temporarily inconsistent while their
          # repository metadata is being published.
          sudo apt-get \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            update
          sudo apt-get install -y nftables iproute2
      - name: Test synthetic cgroup rules in a separate network namespace
        run: sudo unshare --net python3 scripts/test-coding-hosted-connectivity-kernel.py

  terraform:
    name: Terraform / ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/terraform/stacks/gcp-platform
          - infra/terraform/stacks/gcp-preview
          - infra/terraform/stacks/cloudflare-dittobench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize without remote state
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=${{ matrix.root }} validate

      - name: Lint
        working-directory: ${{ matrix.root }}
        run: tflint --init && tflint

      - name: Test dormant native-v2 host with mocked provider
        if: matrix.root == 'infra/terraform/stacks/gcp-platform'
        run: |
          terraform -chdir=infra/terraform/modules/coding-hosted-host init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform/modules/coding-hosted-host test

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install pinned Ansible collections
        run: uvx --from ansible-core==2.21.2 ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check subnet playbooks
        run: |
          for playbook in playbooks/gcp-platform-pg.yml playbooks/gcp-platform-app.yml playbooks/gcp-screener.yml playbooks/gcp-screener-capacity.yml playbooks/gcp-screener-fleet-dev.yml playbooks/gcp-validator.yml playbooks/gcp-validator-prod.yml playbooks/gcp-coding-executor.yml playbooks/gcp-coding-hosted.yml playbooks/gcp-coding-hosted-image.yml playbooks/gcp-coding-hosted-connectivity.yml playbooks/gcp-coding-hosted-postgres-admission.yml playbooks/gcp-coding-hosted-custody-key.yml playbooks/gcp-coding-hosted-worker-credentials.yml playbooks/gcp-coding-hosted-worker-credentials-cleanup.yml playbooks/gcp-coding-hosted-worker-credentials-journal-check.yml playbooks/hetzner-screener-fleet.yml; do
            uvx --from ansible-core==2.21.2 ansible-playbook --syntax-check -i inventory/validator-static.yml "$playbook"
          done

      - name: Check native PostgreSQL admission rendering without host mutations
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i tests/coding-hosted-postgres-inventory.yml
          tests/coding-hosted-postgres.yml

      - name: Prove native connectivity stays disabled in both worker modes
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i localhost, tests/coding-hosted-connectivity.yml

      - name: Prove native RSA custody bootstrap stays disabled by default
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i localhost, tests/coding-hosted-custody-key.yml

      # The rehearsal runs the worker credential materialization role's enabled
      # tasks through ansible-core 2.21.2 against a temporary tree with stand-in
      # credentials. It needs network for uvx, so it runs here and not in every
      # root pytest shard.
      - name: Rehearse native worker credential materialization guards against a temporary tree
        working-directory: ${{ github.workspace }}
        env:
          DITTO_ANSIBLE_REHEARSAL: "1"
        run: >-
          uv run --locked --only-group dev --with pyyaml==6.0.3
          pytest -p no:cacheprovider -rs
          ditto/tests/test_coding_hosted_worker_credentials.py

      - name: Prove native worker credential materialization stays disabled
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i localhost, tests/coding-hosted-worker-credentials.yml

      - name: Prove native worker credential removal stays disabled
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i localhost, tests/coding-hosted-worker-credentials-cleanup.yml

      - name: Prove the native worker credential log spot-check stays disabled
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i localhost, tests/coding-hosted-worker-credentials-journal-check.yml

      # The spot-check rehearsal runs the real module through ansible-core
      # 2.21.2 against synthetic credential files, journal exports, logs and
      # temp trees. It needs network for uvx, so it runs here.
      - name: Rehearse the native worker credential log spot-check against synthetic logs
        working-directory: ${{ github.workspace }}
        env:
          DITTO_ANSIBLE_REHEARSAL: "1"
        run: >-
          uv run --locked --only-group dev --with pyyaml==6.0.3
          pytest -p no:cacheprovider -rs
          ditto/tests/test_coding_hosted_worker_credentials_journal_check.py

      # The guarded entry point's rehearsal runs the real script with
      # uv run --locked --script against a synthetic checkout and ansible-core
      # 2.21.2. It needs network for uv, so it runs here and not in every root
      # pytest shard, which still runs the structural guard tests.
      - name: Rehearse the guarded entry point for the native Coding secret roles
        working-directory: ${{ github.workspace }}
        env:
          DITTO_ANSIBLE_REHEARSAL: "1"
        run: >-
          uv run --locked --only-group dev
          pytest -p no:cacheprovider -rs
          ditto/tests/test_coding_hosted_guarded_run.py
