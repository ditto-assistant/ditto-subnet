name: Infrastructure CI

on:
  pull_request:
    paths:
      - infra/**
      - scripts/test-coding-hosted-connectivity-kernel.py
      - .github/workflows/infra-ci.yml
      - .github/workflows/infra-plan-apply.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - scripts/test-coding-hosted-connectivity-kernel.py
      - .github/workflows/infra-ci.yml
      - .github/workflows/infra-plan-apply.yml

permissions:
  contents: read

jobs:
  coding-connectivity-kernel:
    name: Native Coding network kernel boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only network tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Test synthetic cgroup rules in a separate network namespace
        run: sudo unshare --net python3 scripts/test-coding-hosted-connectivity-kernel.py

  terraform:
    name: Terraform / ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/terraform/stacks/gcp-platform
          - infra/terraform/stacks/gcp-preview
          - infra/terraform/stacks/cloudflare-dittobench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize without remote state
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=${{ matrix.root }} validate

      - name: Lint
        working-directory: ${{ matrix.root }}
        run: tflint --init && tflint

      - name: Test dormant native-v2 host with mocked provider
        if: matrix.root == 'infra/terraform/stacks/gcp-platform'
        run: |
          terraform -chdir=infra/terraform/modules/coding-hosted-host init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform/modules/coding-hosted-host test

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install pinned Ansible collections
        run: uvx --from ansible-core==2.21.2 ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check subnet playbooks
        run: |
          for playbook in playbooks/gcp-platform-pg.yml playbooks/gcp-platform-app.yml playbooks/gcp-screener.yml playbooks/gcp-screener-capacity.yml playbooks/gcp-screener-fleet-dev.yml playbooks/gcp-validator.yml playbooks/gcp-validator-prod.yml playbooks/gcp-coding-executor.yml playbooks/gcp-coding-hosted.yml playbooks/gcp-coding-hosted-image.yml playbooks/gcp-coding-hosted-connectivity.yml playbooks/hetzner-screener-fleet.yml; do
            uvx --from ansible-core==2.21.2 ansible-playbook --syntax-check -i inventory/validator-static.yml "$playbook"
          done

      - name: Check native PostgreSQL admission rendering without host mutations
        run: >-
          uvx --from ansible-core==2.21.2 ansible-playbook --check
          -i tests/coding-hosted-postgres-inventory.yml
          tests/coding-hosted-postgres.yml
