name: Platform migration order

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-order:
    name: Platform migration order
    if: github.event_name != 'push'
    # Per-ref check: a PR, merge-queue entry, or branch dispatch (the anti-copy
    # refresh dispatches this by branch) replaces only its own earlier run.
    concurrency:
      group: platform-migration-order-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Alembic migration order
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # GitHub forces GITHUB_TOKEN to read-only on a pull_request run from a
          # fork, whatever this job declares above, so the status POST below is
          # rejected with 403. Detect that case rather than reporting a passing
          # migration check as a failed job.
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set +e
          output="$(python3 apps/platform/scripts/check_migration_order.py origin/main 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"
          state=success
          description="Platform migrations are ordered after main"
          if (( exit_code != 0 )); then
            state=failure
            description="Platform migration order conflicts with main"
          fi

          # A fork PR cannot publish migration-order/merge-result itself. The
          # push-triggered main sweep below owns that context for every open PR,
          # so skipping here leaves the required check pending (never falsely
          # green) instead of failing a job whose actual check just passed.
          if [[ "$FORK_PULL_REQUEST" == "true" ]]; then
            echo "::notice::fork pull request: skipping the commit-status" \
              "publish (read-only token). The main sweep owns" \
              "migration-order/merge-result; this job still fails when the" \
              "migration check itself fails."
          else
            # GitHub 503s must not paint this required check red after a
            # passing Alembic-order result. Retry the status POST, then
            # still exit with the migration check's code.
            attempt=1
            max_attempts=6
            while true; do
              if gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state="$state" \
                -f context="migration-order/merge-result" \
                -f description="$description" \
                -f target_url="$RUN_URL"; then
                break
              fi
              if (( attempt >= max_attempts )); then
                echo "::warning::failed to publish" \
                  "migration-order/merge-result after ${max_attempts}" \
                  "attempts; leaving that context pending."
                break
              fi
              sleep $(( attempt * 2 ))
              attempt=$(( attempt + 1 ))
            done
          fi
          exit "$exit_code"

  recheck-open-prs:
    name: Re-check open Platform migrations against new main
    # Only main is authoritative: a dispatch from another branch (the anti-copy
    # refresh dispatches this workflow per branch for that branch's own check)
    # would run that branch's older copy of this workflow and script, and could
    # displace the pending push sweep and then rewrite every open PR's status.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Push and manual-on-main sweeps may update migration-order/merge-result on
    # open PRs, so they share one lane. Queue instead of cancelling: a sweep is
    # never killed mid-write, and the run that started later (against the newer
    # origin/main) always finishes last, so an older sweep cannot overwrite it.
    # GitHub keeps only the newest pending run, so a burst of pushes collapses.
    concurrency:
      group: platform-migration-order-main-sweep
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/platform/scripts/recheck_open_pr_migrations.sh
