name: Preview controls

# Resolve and test the source-checkout preview control harness. Unprivileged
# jobs never receive cloud credentials. For dashboard-only PRs this workflow
# emits a static artifact and calls the same-run publisher, which checks out
# only the default branch before entering the preview environment.

# Cost control: standalone verification is operator-dispatched; release gates
# remain in release.yml and its reusable verification workflows (SN-120).
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated profiles (dashboard, stack, stack-copy)
        required: true
        type: string
        default: dashboard
      attach_prod_api:
        description: Public dashboard against prod Platform (illegal with stack)
        type: boolean
        default: false
      ref:
        description: Branch or tag label (empty uses this workflow ref)
        type: string
        required: false
      sha:
        description: Exact 40-character commit to check out and test
        type: string
        required: false
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
      attach: ${{ steps.resolve.outputs.attach }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.sha || inputs.ref || github.sha }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Resolve profiles at the checked-out SHA
        id: resolve
        env:
          INPUT_PROFILES: ${{ inputs.profiles }}
          INPUT_ATTACH: ${{ inputs.attach_prod_api && 'true' || 'false' }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_REF: ${{ github.head_ref || github.ref_name }}
          PR_FILES: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$INPUT_SHA" ] && [ "$INPUT_SHA" != "$actual_sha" ]; then
            echo "requested SHA does not match checked out commit" >&2
            exit 2
          fi

          profiles="${INPUT_PROFILES:-}"
          attach="${INPUT_ATTACH}"
          if [ -z "$profiles" ] && [ "$PR_FILES" = true ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            profiles=""
            echo "$files" | grep -q '^apps/platform/dashboard/' && profiles="${profiles},dashboard"
            echo "$files" | grep -Eq '^(apps/backroom/|apps/platform/ditto/|apps/platform/alembic/|ditto/(api_models|chain|validator)/|services/dittobench-api/)' && profiles="${profiles},stack"
            echo "$files" | grep -q '^apps/platform/alembic/' && profiles="${profiles},stack-copy"
            profiles="${profiles#,}"
            [ -n "$profiles" ] || profiles="stack"
            if echo "$profiles" | grep -Eq '(^|,)stack'; then
              attach=false
            else
              attach=true
            fi
          fi

          [ -n "$profiles" ] || profiles="dashboard"
          if [ "$attach" = true ]; then
            plan_json="$(uv run --locked python -m ditto.preview compose "$profiles" \
              --attach-prod-api \
              --ref "${INPUT_REF:-$EVENT_REF}" \
              --sha "$actual_sha")"
          else
            plan_json="$(uv run --locked python -m ditto.preview compose "$profiles" \
              --ref "${INPUT_REF:-$EVENT_REF}" \
              --sha "$actual_sha")"
          fi
          printf '%s\n' "$plan_json"
          echo "profiles=$(jq -r '.profiles | join(",")' <<<"$plan_json")" >>"$GITHUB_OUTPUT"
          echo "attach=$(jq -r '.attach_prod_api' <<<"$plan_json")" >>"$GITHUB_OUTPUT"
          echo "sha=$actual_sha" >>"$GITHUB_OUTPUT"

  cheatcodes:
    if: github.event.action != 'closed'
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Prove overlay cheatcodes
        run: uv run --locked pytest ditto/tests/preview -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Prove the trusted dashboard preview boundary
        run: node --test apps/platform/dashboard/preview/cloudflare-pages-worker.test.mjs

  dashboard-bundle:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.profiles == 'dashboard' &&
      needs.plan.outputs.attach == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/platform/dashboard/package-lock.json

      - name: Build the exact-SHA public dashboard
        working-directory: apps/platform/dashboard
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Package an unprivileged preview artifact
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PREVIEW_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p preview-artifact
          mv apps/platform/dashboard/dist preview-artifact/dist
          jq -n \
            --argjson pr "$PREVIEW_PR" \
            --arg repo "$PREVIEW_REPO" \
            --arg sha "$PREVIEW_SHA" \
            '{schema: 1, mode: "publish", pr: $pr, repo: $repo, sha: $sha}' \
            > preview-artifact/manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-preview-${{ github.run_attempt }}
          path: preview-artifact
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  dashboard-publish:
    needs: [plan, cheatcodes, dashboard-bundle]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.plan.result == 'success' || github.event.action == 'closed')
    uses: ./.github/workflows/preview-dashboard-publish.yml
    with:
      action: ${{ github.event.action }}
      bundle_result: ${{ needs.dashboard-bundle.result }}
      pr: ${{ github.event.pull_request.number }}
      profiles: ${{ needs.plan.outputs.profiles }}
      proof_result: ${{ needs.cheatcodes.result }}
      repo: ${{ github.event.pull_request.head.repo.full_name }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
