name: Backroom CI

on:
  pull_request:
    paths:
      - apps/backroom/**
      - .github/workflows/backroom-ci.yml
  push:
    branches: [main]
    paths:
      - apps/backroom/**
      - .github/workflows/backroom-ci.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backroom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backroom/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm generate-routes
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
