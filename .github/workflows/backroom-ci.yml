name: Backroom CI

# Cost control: standalone verification is operator-dispatched; release gates
# remain in release.yml and its reusable verification workflows (SN-120).
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backroom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Install Platform contract dependencies
        working-directory: apps/platform
        run: uv sync --locked --group dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: apps/backroom/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Verify generated Platform client
        run: |
          ./scripts/platform-contract/generate.sh
          git diff --exit-code -- src/generated/platform-api.ts src/generated/platform-api.meta.json
      - run: pnpm generate-routes
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
