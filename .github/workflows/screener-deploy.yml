name: Deploy production screeners

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact released monorepo commit (empty uses the latest GitHub release)
        type: string
        required: false
      force:
        description: Permit an explicit non-release operator revision
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production-screeners
  cancel-in-progress: false

env:
  GCP_PROJECT: ditto-app-dev

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the immutable released revision
        id: release
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          FORCE_DEPLOY: ${{ inputs.force && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$REQUESTED_REVISION"
          if [ -z "$revision" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            revision="$(git rev-list -n 1 "$tag^{commit}")"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$revision^{commit}"
          if [ "$FORCE_DEPLOY" != true ]; then
            git tag --points-at "$revision" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Verify deploy configuration
        env:
          WIF: ${{ secrets.GCP_WIF_PROVIDER }}
          SA: ${{ secrets.GCP_SCREENER_DEPLOY_SA }}
        run: |
          : "${WIF:?GCP_WIF_PROVIDER repo secret is not set}"
          : "${SA:?GCP_SCREENER_DEPLOY_SA repo secret is not set}"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SCREENER_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Discover production screener instances
        id: list
        run: |
          cutoff="$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          gcloud compute instances list \
            --project "$GCP_PROJECT" \
            --filter="status=RUNNING AND labels.env=prod AND (labels.role=screener OR labels.role=screener-fleet) AND creationTimestamp<'$cutoff'" \
            --format="csv[no-heading](name,zone.basename())" >instances.csv
          echo "deploy targets:"
          cat instances.csv
          if [[ ! -s instances.csv ]]; then
            echo "no eligible production screener instances found"
            echo 'matrix={"include":[]}' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          include="$(awk -F, 'NF>=2 && $1!="" {printf "%s{\"name\":\"%s\",\"zone\":\"%s\"}", sep, $1, $2; sep=","}' instances.csv)"
          echo "matrix={\"include\":[$include]}" >>"$GITHUB_OUTPUT"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: prod
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.discover.outputs.revision }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SCREENER_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Enable NumPy-accelerated IAP transport
        run: |
          gcloud_python="$(gcloud info --format='value(basic.python_location)')"
          "$gcloud_python" -m pip install --disable-pip-version-check numpy
          "$gcloud_python" -c 'import numpy; print(f"NumPy {numpy.__version__} enabled for gcloud IAP")'

      - name: Deploy exact commit to ${{ matrix.name }} (${{ matrix.zone }})
        run: |
          name='${{ matrix.name }}'
          zone='${{ matrix.zone }}'
          workers/screener/scripts/deploy-screener-via-ssh.sh \
            "$name" "$zone" '${{ needs.discover.outputs.revision }}'
