name: Refresh Platform anti-copy reference

on:
  push:
    branches: [main]
    paths:
      - miners/dittobench-starter-kit/**
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-platform-anti-copy-reference
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Check out the monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Regenerate deterministic reference bundles
        run: python3 scripts/build_reference_fingerprints.py ../../miners/dittobench-starter-kit

      - name: Open or refresh reference update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/starter-kit-reference
        run: |
          outputs=(
            ditto/anticopy/reference_lexical_v2.bin
            ditto/anticopy/reference_normalized_v2.bin
            ditto/anticopy/reference_prompt_v2.bin
            ditto/anticopy/reference_manifest_v2.json
          )
          if git diff --quiet -- "${outputs[@]}"; then
            echo "Anti-copy reference already matches the in-tree starter kit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "${outputs[@]}"
          git commit -m "chore: refresh starter-kit anti-copy reference"
          remote_oid="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$remote_oid" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_oid" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          if ! gh pr view "$BRANCH" --json url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: refresh starter-kit anti-copy reference" \
              --body "Refresh the provenance-aware anti-copy bundles from the in-tree starter kit.\n\nThe automation explicitly dispatches Platform CI and the migration-order guard because pull requests opened with the repository GITHUB_TOKEN do not emit pull_request workflow runs."
          fi
          # Events created with GITHUB_TOKEN intentionally do not start other
          # workflows. Dispatch both required guards against the exact branch
          # head after every refresh, including updates to an existing PR.
          gh workflow run platform-ci.yml --ref "$BRANCH"
          gh workflow run platform-migration-order.yml --ref "$BRANCH"
