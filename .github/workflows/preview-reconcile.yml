name: Reconcile stack previews

# With the stack controller now dispatch-only, this is the only thing that ever
# notices a PR closing, so the tick interval sets how sharply the post-close
# grace and the absolute lease cap are enforced. Kept off the hour because
# GitHub delays crons scheduled at :00 under load.
on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: stack-preview-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'ditto-assistant/ditto-subnet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview-stack
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GCP_PREVIEW_LEASE_BUCKET: ${{ vars.GCP_PREVIEW_LEASE_BUCKET }}
      GCP_PREVIEW_ZONE: ${{ vars.GCP_PREVIEW_ZONE }}
      PREVIEW_CLOSED_GRACE_SECONDS: ${{ vars.PREVIEW_CLOSED_GRACE_SECONDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_CONTROLLER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: preview/cloud/reconcile.sh
