name: Platform CI

# Cost control: standalone verification is operator-dispatched; release gates
# remain in release.yml and its reusable verification workflows (SN-120).
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/platform-verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      security: true
      backend: true
