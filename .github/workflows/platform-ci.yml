name: Platform CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/platform/**
      - "!apps/platform/dashboard/**"
      - "!apps/platform/faircopy.config.mjs"
      - "!apps/platform/package.json"
      - "!apps/platform/package-lock.json"
      - packages/ditto-screening-protocol/**
      - .github/workflows/platform-ci.yml
      - .github/workflows/platform-verify.yml
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/platform-verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      security: true
      backend: true
