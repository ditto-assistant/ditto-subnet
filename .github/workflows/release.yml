name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Shared, non-secret release constants. Hoisted to workflow scope so the parallel
# build/assemble jobs share one definition instead of copy-pasting them.
env:
  VALIDATOR_REPOSITORY: ghcr.io/ditto-assistant/ditto-subnet-validator
  SANDBOX_DOCKER_REPOSITORY: ghcr.io/ditto-assistant/ditto-subnet-sandbox-docker
  DITTOBENCH_API_REPOSITORY: ghcr.io/ditto-assistant/dittobench-api-sandbox
  DITTOBENCH_HOSTED_REPOSITORY: us-central1-docker.pkg.dev/ditto-app-dev/cloud-run-source-deploy/dittobench-api
  DATAGEN_REPOSITORY: us-central1-docker.pkg.dev/ditto-app-dev/datapipeline/generate
  DATAGEN_SERVICE: ditto-datapipeline
  DATAGEN_SERVICE_URL: https://ditto-datapipeline-m4cg7rn54q-uc.a.run.app
  DATAGEN_PROJECT: ditto-app-dev
  DATAGEN_REGION: us-central1
  MODEL_RELAY_REPOSITORY: ghcr.io/ditto-assistant/dittobench-api-relay
  PYLON_REPOSITORY: ghcr.io/ditto-assistant/ditto-subnet-pylon
  # Frozen compat-2 updaters still require a relay-shaped image in their signed
  # descriptor. Its final reviewed source is vendored below the active API so a
  # release never depends on the availability or permissions of another repo.
  MODEL_RELAY_COMPAT_REVISION: c0cac04970523326738cc704aa1bd60cd2623b22
  MODEL_RELAY_COMPAT_DIR: services/dittobench-api/compat/model-relay
  STACK_REPOSITORY: ghcr.io/ditto-assistant/ditto-subnet-stack
  PYLON_BASE_IMAGE: docker.io/backenddevelopersltd/bittensor-pylon@sha256:ba6ba5e3e7b32683f90039eb5a37a565d5479f034326b40288869f826f7362c7
  PYLON_TURBOBT_REVISION: d36d1a28e761ff9d743bbcc83d091309c4d3599e
  SCREENER_REPOSITORY: us-central1-docker.pkg.dev/ditto-app-dev/ditto-public-runtime/screener
  SUBMISSION_BUILDER_REPOSITORY: us-central1-docker.pkg.dev/ditto-app-dev/ditto-public-builders/submission-builder
  OLLAMA_IMAGE: docker.io/ollama/ollama@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd
  COMPATIBILITY_EPOCH: "2"
  UPDATE_PROTOCOL: "1"
  HEARTBEAT_PROTOCOL: "23"
  COMPOSE_SCHEMA: "1"

jobs:
  plan:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_base: ${{ steps.release-base.outputs.sha }}
      miner_cli: ${{ steps.components.outputs.miner_cli }}
      miner_starter_kit: ${{ steps.components.outputs.miner_starter_kit }}
      validator_stack: ${{ steps.components.outputs.validator_stack }}
      dittobench_api: ${{ steps.components.outputs.dittobench_api }}
      dittobench_datagen: ${{ steps.components.outputs.dittobench_datagen }}
      platform_api: ${{ steps.components.outputs.platform_api }}
      platform_dashboard: ${{ steps.components.outputs.platform_dashboard }}
      platform: ${{ steps.components.outputs.platform }}
      deploy_relay: ${{ steps.relay.outputs.deploy_relay }}
      backroom: ${{ steps.components.outputs.backroom }}
      screener: ${{ steps.components.outputs.screener }}
      screener_orchestrator: ${{ steps.components.outputs.screener_orchestrator }}
      root_verification: ${{ steps.components.outputs.root_verification }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the last published release
        id: release-base
        shell: bash
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${{ github.sha }}" 2>/dev/null); then
            base_sha=$(git rev-list -n 1 "$tag")
          else
            # An all-zero base asks release-plan.py to include the root commit,
            # preserving fail-closed behavior before a repository's first tag.
            base_sha=0000000000000000000000000000000000000000
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      # Plan from the last published semantic release rather than only the
      # immediately preceding push. This carries changes forward after a
      # queued, cancelled, or failed release attempt.
      - name: Resolve affected release components
        id: components
        run: |
          python scripts/release-plan.py \
            --base "${{ steps.release-base.outputs.sha }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      # Dashboard-only (and other non-relay) platform releases must not roll
      # the two relay PM2 slots. The filter consumes REPO-ROOT-relative paths
      # (plain `git diff --name-only` from the checkout root) — that base is
      # part of relay-runtime-changed.sh's documented contract.
      - name: Resolve whether the relay runtime changed
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.release-base.outputs.sha }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy_relay=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" \
              | bash apps/platform/scripts/relay-runtime-changed.sh; then
            echo "deploy_relay=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_relay=false" >> "$GITHUB_OUTPUT"
          fi

      # The plan checkout already has the release ancestry needed by this gate.
      # Keep verify-source shallow instead of fetching the same history twice.
  admit-current:
    needs: plan
    if: >-
      needs.plan.outputs.miner_cli == 'true' ||
      needs.plan.outputs.miner_starter_kit == 'true' ||
      needs.plan.outputs.validator_stack == 'true' ||
      needs.plan.outputs.dittobench_api == 'true' ||
      needs.plan.outputs.dittobench_datagen == 'true' ||
      needs.plan.outputs.platform == 'true' ||
      needs.plan.outputs.backroom == 'true' ||
      needs.plan.outputs.screener == 'true' ||
      needs.plan.outputs.screener_orchestrator == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      current: ${{ steps.release-head.outputs.current }}
    steps:
      - name: Check out the exact merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      # A newer main push can arrive while this run waits behind the previous
      # non-cancellable release. Reject it before repeating the complete source
      # gate; release performs the same check again immediately before mutation.
      - name: Admit only the current main candidate
        id: release-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          upstream_sha=$(git rev-parse refs/remotes/origin/main)
          if [[ "$upstream_sha" != "${{ github.sha }}" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release candidate superseded::Merge ${{ github.sha }} was superseded by $upstream_sha before source verification."
            {
              echo "### Release candidate superseded"
              echo
              echo "Merge \`${{ github.sha }}\` was superseded by current main \`$upstream_sha\` before source verification."
              echo "No source gate, version, tag, release, build, or deployment was started by this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan, admit-current, verify-source]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.admit-current.outputs.current == 'true' &&
      needs.verify-source.result == 'success' &&
      (
        needs.plan.outputs.miner_cli == 'true' ||
        needs.plan.outputs.miner_starter_kit == 'true' ||
        needs.plan.outputs.validator_stack == 'true' ||
        needs.plan.outputs.dittobench_api == 'true' ||
        needs.plan.outputs.dittobench_datagen == 'true' ||
        needs.plan.outputs.platform == 'true' ||
        needs.plan.outputs.backroom == 'true' ||
        needs.plan.outputs.screener == 'true' ||
        needs.plan.outputs.screener_orchestrator == 'true'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semantic-release.outputs.released || 'false' }}
      version: ${{ steps.semantic-release.outputs.version }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      commit_sha: ${{ steps.semantic-release.outputs.commit_sha }}
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Pin the release branch to the tested merge
        run: git reset --hard "${{ github.sha }}"

      - name: Classify a superseded release attempt
        id: release-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          upstream_sha=$(git rev-parse refs/remotes/origin/main)
          if [[ "$upstream_sha" != "${{ github.sha }}" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release superseded::Verified merge ${{ github.sha }} was superseded by $upstream_sha; the latest queued main run will release every change since the last published tag."
            {
              echo "### Release superseded"
              echo
              echo "Verified merge \`${{ github.sha }}\` was superseded by current main \`$upstream_sha\`."
              echo "No version, tag, release, or deployment was created by this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "superseded=false" >> "$GITHUB_OUTPUT"

      - name: Configure the release committer
        if: steps.release-head.outputs.current == 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com

      # The code already reported 0.1.0 before release automation existed.
      # Anchor that historical version to the parent of this first release-aware
      # merge so the setup feature itself advances the project to 0.2.0.
      - name: Bootstrap the existing v0.1.0 baseline
        if: steps.release-head.outputs.current == 'true'
        run: |
          if ! git tag --list 'v[0-9]*' | grep -q .; then
            release_setup_commit=$(git log --diff-filter=A --format=%H -- \
              .github/workflows/release.yml | tail -1)
            baseline_commit=$(git rev-parse "${release_setup_commit}^")
            git tag --annotate v0.1.0 "$baseline_commit" \
              --message "Ditto Subnet v0.1.0"
            git push origin v0.1.0
          fi

      - name: Install uv
        if: steps.release-head.outputs.current == 'true'
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Install the locked release tool
        if: steps.release-head.outputs.current == 'true'
        run: uv sync --locked --only-group release

      - name: Version, tag, and create the GitHub release
        id: semantic-release
        if: steps.release-head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: github-actions <actions@users.noreply.github.com>
          PSR_DOCKER_GITHUB_ACTION: 'true'
        run: uv run --no-sync semantic-release -v version

  # ---------------------------------------------------------------------------
  # Fan-out: affected root and selected-component verification run in parallel
  # from the exact merge commit. Root runtime changes keep the complete gate;
  # direct stack-orchestration changes run the focused release contract; and
  # isolated components rely on their owning exact-source gate. After semantic
  # release, first-party image builds fan out from the immutable release commit.
  # ---------------------------------------------------------------------------

  verify-root-static:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.root_verification == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Gate root static and integration checks on exact merge source
        run: |
          uv sync --locked --group dev
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy ditto/
          uv run pytest -m integration \
            ditto/tests/test_validator_compose.py \
            ditto/tests/test_validator_stack_auto_update.py

  verify-root-tests:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.root_verification == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Gate root test shard on exact merge source
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 3
        run: |
          uv sync --locked --group dev
          uv run pytest --collect-only -q --color=no > "$RUNNER_TEMP/root-nodeids.txt"
          test_nodeids=()
          while IFS= read -r test_nodeid; do
            case "$test_nodeid" in
              ditto/tests/*::*) test_nodeids+=("$test_nodeid") ;;
            esac
          done < "$RUNNER_TEMP/root-nodeids.txt"
          shard_nodeids=()
          for index in "${!test_nodeids[@]}"; do
            if (( index % SHARD_COUNT == SHARD )); then
              shard_nodeids+=("${test_nodeids[$index]}")
            fi
          done
          test "${#shard_nodeids[@]}" -gt 0
          uv run pytest "${shard_nodeids[@]}"

  verify-root-contract:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.root_verification == 'contract'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Gate the focused release contract on exact merge source
        run: |
          uv sync --locked --group dev
          uv run pytest -q \
            ditto/tests/test_release_plan.py \
            ditto/tests/test_release_workflow.py \
            ditto/tests/test_workflow_security.py \
            ditto/tests/test_compose_stack.py
          uv run pytest -q -m integration \
            ditto/tests/test_validator_compose.py \
            ditto/tests/test_validator_stack_auto_update.py

  # Keep the stable root gate consumed by verify-source. Exactly one verifier
  # mode is accepted, and every unexpected result or mode fails closed.
  verify-root:
    needs:
      - plan
      - admit-current
      - verify-root-static
      - verify-root-tests
      - verify-root-contract
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every root exact-source lane
        env:
          CURRENT: ${{ needs.admit-current.outputs.current }}
          ROOT_VERIFICATION: ${{ needs.plan.outputs.root_verification }}
          STATIC_RESULT: ${{ needs.verify-root-static.result }}
          TESTS_RESULT: ${{ needs.verify-root-tests.result }}
          CONTRACT_RESULT: ${{ needs.verify-root-contract.result }}
        run: |
          set -euo pipefail
          if [ "$CURRENT" != true ]; then
            echo "Candidate is no longer current; root gates were skipped."
            exit 0
          fi
          case "$ROOT_VERIFICATION" in
            full)
              test "$STATIC_RESULT" = success
              test "$TESTS_RESULT" = success
              test "$CONTRACT_RESULT" = skipped
              ;;
            contract)
              test "$STATIC_RESULT" = skipped
              test "$TESTS_RESULT" = skipped
              test "$CONTRACT_RESULT" = success
              ;;
            none)
              test "$STATIC_RESULT" = skipped
              test "$TESTS_RESULT" = skipped
              test "$CONTRACT_RESULT" = skipped
              ;;
            *)
              echo "invalid root verification mode: $ROOT_VERIFICATION" >&2
              exit 1
              ;;
          esac

  verify-starter-kit:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.miner_starter_kit == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: miners/dittobench-starter-kit
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust for starter-kit verification
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache starter-kit Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            miners/dittobench-starter-kit/target
          key: ${{ runner.os }}-starter-kit-${{ hashFiles('miners/dittobench-starter-kit/Cargo.lock') }}

      - name: Gate starter-kit release on exact merge source
        run: |
          cargo fmt --check
          cargo build --locked --verbose
          cargo test --locked --verbose
          python3 -m unittest scripts/test_submission_lab.py scripts/test_submission_workbench.py

  verify-platform:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.platform == 'true'
    # Release is the sole post-merge component orchestrator. Use the same
    # exact-source verifier as pull-request CI without polling another run.
    uses: ./.github/workflows/platform-verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      backend: ${{ needs.plan.outputs.platform_api == 'true' }}
      dashboard: ${{ needs.plan.outputs.platform_dashboard == 'true' }}

  verify-model-relay:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/model-relay
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Install Go for model-relay verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/model-relay/go.sum

      - name: Gate model-relay release on exact merge source
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go build ./...
          go vet ./...
          scripts/gen-schema.sh
          git diff --exit-code -- db/schema.sql
          TEST_POSTGRES_REQUIRED=1 go test ./...

  verify-backroom:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.backroom == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backroom
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Gate Backroom release on exact merge source
        run: |
          pnpm install --frozen-lockfile
          pnpm generate-routes
          pnpm check
          pnpm test
          pnpm build

  verify-dittobench-api:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.dittobench_api == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/dittobench-api
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: services/dittobench-api/go.sum

      - name: Gate DittoBench API release on exact merge source
        run: go test ./...

  verify-dittobench-datagen:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.dittobench_datagen == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: research/dittobench-datagen
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: research/dittobench-datagen/go.mod

      - name: Gate DittoBench datagen release on exact merge source
        run: go test ./...

  verify-screener:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.screener == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/screener
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Gate screener release on exact merge source
        run: |
          uv sync --locked --group dev --python 3.12
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy ditto_screener
          uv run pytest -m "not integration"

  verify-screener-orchestrator:
    needs: [plan, admit-current]
    if: >-
      needs.admit-current.outputs.current == 'true' &&
      needs.plan.outputs.screener_orchestrator == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/screener-orchestrator
    steps:
      - name: Check out the exact merge commit before release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Gate screener orchestrator release on exact merge source
        run: |
          uv sync --locked --group dev --python 3.11
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy screener_capacity
          uv run pytest

  verify-source:
    needs:
      - plan
      - admit-current
      - verify-root
      - verify-starter-kit
      - verify-platform
      - verify-model-relay
      - verify-backroom
      - verify-dittobench-api
      - verify-dittobench-datagen
      - verify-screener
      - verify-screener-orchestrator
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every selected exact-source gate
        shell: bash
        env:
          CURRENT: ${{ needs.admit-current.outputs.current }}
          ROOT_RESULT: ${{ needs.verify-root.result }}
          STARTER_REQUIRED: ${{ needs.plan.outputs.miner_starter_kit }}
          STARTER_RESULT: ${{ needs.verify-starter-kit.result }}
          PLATFORM_REQUIRED: ${{ needs.plan.outputs.platform }}
          PLATFORM_RESULT: ${{ needs.verify-platform.result }}
          MODEL_RELAY_RESULT: ${{ needs.verify-model-relay.result }}
          BACKROOM_REQUIRED: ${{ needs.plan.outputs.backroom }}
          BACKROOM_RESULT: ${{ needs.verify-backroom.result }}
          DITTOBENCH_API_REQUIRED: ${{ needs.plan.outputs.dittobench_api }}
          DITTOBENCH_API_RESULT: ${{ needs.verify-dittobench-api.result }}
          DITTOBENCH_DATAGEN_REQUIRED: ${{ needs.plan.outputs.dittobench_datagen }}
          DITTOBENCH_DATAGEN_RESULT: ${{ needs.verify-dittobench-datagen.result }}
          SCREENER_REQUIRED: ${{ needs.plan.outputs.screener }}
          SCREENER_RESULT: ${{ needs.verify-screener.result }}
          ORCHESTRATOR_REQUIRED: ${{ needs.plan.outputs.screener_orchestrator }}
          ORCHESTRATOR_RESULT: ${{ needs.verify-screener-orchestrator.result }}
        run: |
          set -euo pipefail
          if [ "$CURRENT" != true ]; then
            echo "Candidate is no longer current; exact-source gates were skipped."
            exit 0
          fi
          test "$ROOT_RESULT" = success
          require_selected() {
            local required="$1" result="$2" name="$3"
            if [ "$required" = true ]; then
              if [ "$result" != success ]; then
                echo "selected exact-source gate failed: $name ($result)" >&2
                exit 1
              fi
            elif [ "$result" != skipped ]; then
              echo "unselected exact-source gate unexpectedly ran: $name ($result)" >&2
              exit 1
            fi
          }
          require_selected "$STARTER_REQUIRED" "$STARTER_RESULT" starter-kit
          require_selected "$PLATFORM_REQUIRED" "$PLATFORM_RESULT" platform
          require_selected "$PLATFORM_REQUIRED" "$MODEL_RELAY_RESULT" model-relay
          require_selected "$BACKROOM_REQUIRED" "$BACKROOM_RESULT" backroom
          require_selected "$DITTOBENCH_API_REQUIRED" "$DITTOBENCH_API_RESULT" dittobench-api
          require_selected "$DITTOBENCH_DATAGEN_REQUIRED" "$DITTOBENCH_DATAGEN_RESULT" dittobench-datagen
          require_selected "$SCREENER_REQUIRED" "$SCREENER_RESULT" screener
          require_selected "$ORCHESTRATOR_REQUIRED" "$ORCHESTRATOR_RESULT" screener-orchestrator

  # verify-source intentionally tolerates skipped optional component gates.
  # Every post-release job must therefore evaluate with always() and then
  # require its direct prerequisites explicitly; GitHub's implicit success()
  # otherwise propagates those harmless skips and suppresses the whole fan-out.
  deploy_platform:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.platform == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/platform-deploy.yml
    with:
      revision: ${{ needs.release.outputs.commit_sha }}
      environment: prod
      # Computed by the plan job from relay-runtime-changed.sh: a
      # dashboard-only platform release must not roll the relay slots.
      # Operators can still force a roll via platform-deploy.yml's manual
      # dispatch (deploy_relay defaults true there).
      deploy_relay: ${{ needs.plan.outputs.deploy_relay == 'true' }}
    secrets: inherit

  deploy-backroom:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.backroom == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backroom
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/backroom/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm generate-routes
      - run: pnpm check
      - run: pnpm test
      # The OAuth KV namespace holds live operator grants and tokens, so its id
      # is supplied before Vite snapshots wrangler.jsonc into its deploy
      # config, rather than committed to this public repository. The value is
      # the cloudflare-dittobench Terraform output
      # `backroom_oauth_kv_namespace_id`.
      - name: Bind the OAuth KV namespace
        env:
          BACKROOM_OAUTH_KV_ID: ${{ vars.BACKROOM_OAUTH_KV_ID }}
        run: node scripts/inject-oauth-kv.mjs

      - run: pnpm build

      - name: Deploy the subnet-only worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  build-submission-builder:
    needs: [plan, release, deploy_platform]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.screener_orchestrator == 'true' &&
      (needs.deploy_platform.result == 'success' || needs.deploy_platform.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SUBNET_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish the attempt-scoped Kaniko runner
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          image="$SUBMISSION_BUILDER_REPOSITORY:sha-$SOURCE_SHA"
          existing_digest="$(gcloud artifacts docker images describe "$image" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          if [[ ! "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker build \
              --file services/screener-orchestrator/submission-builder/Dockerfile \
              --tag "$image" \
              .
            docker push "$image"
          fi
          digest="$(gcloud artifacts docker images describe "$image" \
            --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

  deploy-screener-controller:
    needs: [plan, release, deploy_platform, build-submission-builder]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.screener_orchestrator == 'true' &&
      vars.SCREENER_CAPACITY_CONTROLLER_ENABLED == 'true' &&
      needs.build-submission-builder.result == 'success' &&
      (needs.deploy_platform.result == 'success' || needs.deploy_platform.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/screener-controller-deploy.yml
    with:
      revision: ${{ needs.release.outputs.commit_sha }}
    secrets: inherit

  build-screener:
    # A controller deploy restarts the single-writer image-builder service.
    # Finish that rollout before queuing a trusted Targon build so the restart
    # cannot orphan the rental behind its 45-minute Platform lease.
    needs: [plan, release, deploy_platform, deploy-screener-controller]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.screener == 'true' &&
      (needs.deploy-screener-controller.result == 'success' || needs.deploy-screener-controller.result == 'skipped') &&
      (needs.deploy_platform.result == 'success' || needs.deploy_platform.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SUBNET_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Ask Platform for a Targon Kaniko build
        id: targon
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/screener-controller-token"
          umask 077
          if ! gcloud secrets versions access latest \
            --secret=screener-controller-api-token-prod \
            --project=ditto-app-dev >"$token_file"; then
            echo "::error::controller token unavailable; no provider authorized a fallback"
            exit 1
          fi
          payload="$(jq -cn --arg sha "$SOURCE_SHA" '{component:"screener",source_sha:$sha,reason:"Build the reviewed monorepo release image"}')"
          if ! response="$(curl -fsS \
            -H "Authorization: Bearer $(<"$token_file")" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://platform-api.heyditto.ai/api/v1/screener/controller/trusted-image-builds)"; then
            echo "::error::Platform build queue unavailable; no provider authorized a fallback"
            exit 1
          fi
          build_id="$(jq -er .build_id <<<"$response")"
          echo "build_id=$build_id" >>"$GITHUB_OUTPUT"
          for _ in $(seq 1 200); do
            if ! response="$(curl -fsS \
              -H "Authorization: Bearer $(<"$token_file")" \
              "https://platform-api.heyditto.ai/api/v1/screener/controller/trusted-image-builds/$build_id")"; then
              echo "::warning::Platform build poll unavailable; retrying without authorizing a fallback"
              sleep 15
              continue
            fi
            if ! status="$(jq -er .status <<<"$response")"; then
              echo "::warning::Platform build poll returned an invalid response; retrying"
              sleep 15
              continue
            fi
            case "$status" in
              succeeded)
                echo "mode=targon" >>"$GITHUB_OUTPUT"
                echo "digest=$(jq -er .image_digest <<<"$response")" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              fallback_required)
                echo "mode=fallback" >>"$GITHUB_OUTPUT"
                echo "reason=$(jq -r '.error_code // "TARGON_BUILD_FAILED"' <<<"$response")" >>"$GITHUB_OUTPUT"
                echo "controller_epoch=$(jq -er .controller_epoch <<<"$response")" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              failed|canceled)
                echo "::error::Platform ended trusted build with terminal status $status"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Targon build timed out without a Platform-issued fallback"
          exit 1

      - name: Build on the existing runner when Targon is unavailable
        if: steps.targon.outputs.mode == 'fallback'
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          image="$SCREENER_REPOSITORY:sha-$SOURCE_SHA"
          existing_digest="$(gcloud artifacts docker images describe "$image" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          if [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "reusing immutable fallback image: $SCREENER_REPOSITORY@$existing_digest"
          else
            docker build \
              --file workers/screener/Dockerfile \
              --tag "$image" \
              .
            docker push "$image"
          fi

      - name: Record immutable screener image identity
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
          TARGON_DIGEST: ${{ steps.targon.outputs.digest }}
          BUILD_ID: ${{ steps.targon.outputs.build_id }}
          BUILD_EPOCH: ${{ steps.targon.outputs.controller_epoch }}
        run: |
          set -euo pipefail
          digest="$(gcloud artifacts docker images describe \
            "$SCREENER_REPOSITORY:sha-$SOURCE_SHA" \
            --format='value(image_summary.digest)')"
          if [ -n "$TARGON_DIGEST" ] && [ "$digest" != "$TARGON_DIGEST" ]; then
            echo "::error::Targon-reported digest does not match Artifact Registry"
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ -n "$BUILD_ID" ] && [ -z "$TARGON_DIGEST" ]; then
            token_file="$RUNNER_TEMP/screener-controller-token"
            payload="$(jq -cn \
              --arg epoch "$BUILD_EPOCH" \
              --arg digest "$digest" \
              --arg resource "github-run-${GITHUB_RUN_ID}" \
              '{environment:"prod",controller_epoch:$epoch,status:"succeeded",provider:"gcp",provider_resource_id:$resource,image_digest:$digest,error_code:null}')"
            curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $(<"$token_file")" \
              -H 'Content-Type: application/json' \
              --request PUT \
              --data "$payload" \
              "https://platform-api.heyditto.ai/api/v1/screener/controller/trusted-image-builds/$BUILD_ID" \
              >/dev/null
          fi
          echo "screener image: $SCREENER_REPOSITORY@$digest"

  # The validator image spends most of its cold multi-platform build compiling
  # Python/system dependencies. Build each architecture on matching native
  # standard runners in parallel, then merge the immutable child digests. The
  # repository is public, so these runners add no larger-runner cost or scorer
  # pool contention.
  build-validator-amd64:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.validator.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native amd64 validator manifest
        id: validator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.VALIDATOR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=validator-amd64
            type=gha,scope=validator
          cache-to: type=gha,mode=max,scope=validator-amd64
          build-args: |
            DITTO_VERSION=${{ needs.release.outputs.version }}
            DITTO_REVISION=${{ needs.release.outputs.commit_sha }}
            VALIDATOR_COMPATIBILITY_EPOCH=${{ env.COMPATIBILITY_EPOCH }}
            VALIDATOR_HEARTBEAT_PROTOCOL=${{ env.HEARTBEAT_PROTOCOL }}

  build-validator-arm64:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.validator.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native arm64 validator manifest
        id: validator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ env.VALIDATOR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=validator-arm64
            type=gha,scope=validator
          cache-to: type=gha,mode=max,scope=validator-arm64
          build-args: |
            DITTO_VERSION=${{ needs.release.outputs.version }}
            DITTO_REVISION=${{ needs.release.outputs.commit_sha }}
            VALIDATOR_COMPATIBILITY_EPOCH=${{ env.COMPATIBILITY_EPOCH }}
            VALIDATOR_HEARTBEAT_PROTOCOL=${{ env.HEARTBEAT_PROTOCOL }}

  build-validator:
    needs:
      - plan
      - release
      - build-validator-amd64
      - build-validator-arm64
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.build-validator-amd64.result == 'success' &&
      needs.build-validator-arm64.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.validator.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the validator multi-platform index
        id: validator
        env:
          AMD64_DIGEST: ${{ needs.build-validator-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-validator-arm64.outputs.digest }}
        run: |
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          image="$VALIDATOR_REPOSITORY:sha-${{ needs.release.outputs.commit_sha }}"
          docker buildx imagetools create --tag "$image" \
            "$VALIDATOR_REPOSITORY@$AMD64_DIGEST" \
            "$VALIDATOR_REPOSITORY@$ARM64_DIGEST"
          digest="$(
            docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' | jq -r .digest
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

  build-sandbox-docker:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.sandbox-docker.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up QEMU for both release platforms
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the sandbox daemon index
        id: sandbox-docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.sandbox-docker
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=sandbox-docker
          cache-to: type=gha,mode=max,scope=sandbox-docker
          labels: |
            org.opencontainers.image.source=https://github.com/ditto-assistant/ditto-subnet
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.stack-service=sandbox-docker
          tags: |
            ${{ env.SANDBOX_DOCKER_REPOSITORY }}:sha-${{ needs.release.outputs.commit_sha }}

  build-pylon:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.pylon.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the patched Pylon image
        id: pylon
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.pylon
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=pylon
          cache-to: type=gha,mode=max,scope=pylon
          build-args: |
            PYLON_BASE_IMAGE=${{ env.PYLON_BASE_IMAGE }}
          build-contexts: |
            turbobt=https://github.com/ditto-assistant/turbobt.git?ref=refs/heads/ditto/subscription-id-str&checksum=${{ env.PYLON_TURBOBT_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/ditto-assistant/ditto-subnet
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.stack-service=pylon
            io.heyditto.validator.turbobt-revision=${{ env.PYLON_TURBOBT_REVISION }}
          tags: |
            ${{ env.PYLON_REPOSITORY }}:sha-${{ needs.release.outputs.commit_sha }}

      # Authenticate Pylon while the slower validator/scorer lanes are still
      # running instead of serializing this 28-second pull on assemble-stack.
      - name: Verify the patched Pylon artifact
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.commit_sha }}
          PYLON_DIGEST: ${{ steps.pylon.outputs.digest }}
        run: |
          [[ "$PYLON_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          exact="$PYLON_REPOSITORY@$PYLON_DIGEST"
          docker pull --platform linux/amd64 "$exact"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$exact")" = "https://github.com/ditto-assistant/ditto-subnet"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$exact")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact")" = "$REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.turbobt-revision" }}' "$exact")" = "$PYLON_TURBOBT_REVISION"
          docker run --rm --platform linux/amd64 --entrypoint python "$exact" -c \
            'from pathlib import Path; p=Path("/app/pylon_service/.venv/lib/python3.13/site-packages/turbobt/substrate/pallets/author.py"); s=p.read_text(); assert "isinstance(subscription_id_raw, str)" in s'

  prepare-dittobench:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.dittobench-source.outputs.revision }}
      relay_compat_revision: ${{ steps.relay-source.outputs.relay_compat_revision }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Bind DittoBench to the monorepo release
        id: dittobench-source
        run: |
          revision="$(git log -1 --format=%H -- services/dittobench-api research/dittobench-datagen)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$revision" HEAD
          test -f services/dittobench-api/Dockerfile
          test -f services/dittobench-api/go.mod
          test -f research/dittobench-datagen/go.mod
          printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"

      - name: Materialize the retired relay compatibility source
        id: relay-source
        run: |
          relay_revision="$MODEL_RELAY_COMPAT_REVISION"
          [[ "$relay_revision" =~ ^[0-9a-f]{40}$ ]]
          test "$(cat "$MODEL_RELAY_COMPAT_DIR/UPSTREAM_REVISION")" = \
            "$relay_revision"
          grep -q '^FROM .* AS relay$' "$MODEL_RELAY_COMPAT_DIR/Dockerfile"
          (cd "$MODEL_RELAY_COMPAT_DIR" && sha256sum --check SHA256SUMS)
          printf 'relay_compat_revision=%s\n' "$relay_revision" >>"$GITHUB_OUTPUT"

      # Changed scorer source already passed verify-dittobench-api before the
      # semantic release, while unchanged source passed the gate in its owning
      # release. Both native image builds compile the exact release checkout.
      # Keep the release-only source/provenance checks above, but do not repeat
      # the full Go toolchain setup and test suite on the fan-out critical path.

  # The scorer requires cgo for tree-sitter. Building arm64 inside the amd64
  # job therefore runs the entire C/Go compile through QEMU (2m38s in the
  # v0.62.2 release). Publish one native child per architecture in parallel,
  # then merge those immutable digests into the canonical release index.
  build-dittobench-amd64:
    needs: [plan, release, prepare-dittobench]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.prepare-dittobench.result == 'success'
    runs-on:
      group: release-larger-runners
      labels: ubuntu-24.04-release-8core
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.dittobench-api.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native amd64 scorer manifest
        id: dittobench-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/dittobench-api/Dockerfile
          target: sandbox
          platforms: linux/amd64
          outputs: type=image,name=${{ env.DITTOBENCH_API_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=dittobench-api-amd64
            type=gha,scope=dittobench-api
          cache-to: type=gha,mode=max,scope=dittobench-api-amd64
          # Stamp the identity INTO the image. A released scorer must be able to
          # report what it was compiled from rather than what its environment
          # asserts, so a container recreated against a cached image cannot
          # inherit a newer release's identity.
          build-args: |
            DITTOBENCH_SOURCE_SHA=${{ needs.prepare-dittobench.outputs.revision }}
            DITTOBENCH_SOFTWARE_VERSION=${{ needs.release.outputs.version }}
          # Bridge the frozen v0.47 updater generation first. That client
          # requires the monorepo source identity. The shipped updater accepts
          # both this identity and the standalone compatibility identity, so a
          # subsequent release can restore the v0.44 compatibility label after
          # every observed v0.47 host has crossed this bridge.
          labels: |
            org.opencontainers.image.source=https://github.com/ditto-assistant/ditto-subnet
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare-dittobench.outputs.revision }}
            io.heyditto.validator.build-source=https://github.com/ditto-assistant/ditto-subnet
            io.heyditto.validator.build-source-revision=${{ needs.prepare-dittobench.outputs.revision }}
            io.heyditto.validator.stack-version=${{ needs.release.outputs.version }}
            io.heyditto.validator.stack-revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.stack-service=dittobench-api

  build-dittobench-arm64:
    needs: [plan, release, prepare-dittobench]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.prepare-dittobench.result == 'success'
    runs-on:
      group: release-larger-runners
      labels: ubuntu-24.04-release-arm64-8core
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.dittobench-api.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the native arm64 scorer manifest
        id: dittobench-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/dittobench-api/Dockerfile
          target: sandbox
          platforms: linux/arm64
          outputs: type=image,name=${{ env.DITTOBENCH_API_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=dittobench-api-arm64
            type=gha,scope=dittobench-api
          cache-to: type=gha,mode=max,scope=dittobench-api-arm64
          build-args: |
            DITTOBENCH_SOURCE_SHA=${{ needs.prepare-dittobench.outputs.revision }}
            DITTOBENCH_SOFTWARE_VERSION=${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ditto-assistant/ditto-subnet
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare-dittobench.outputs.revision }}
            io.heyditto.validator.build-source=https://github.com/ditto-assistant/ditto-subnet
            io.heyditto.validator.build-source-revision=${{ needs.prepare-dittobench.outputs.revision }}
            io.heyditto.validator.stack-version=${{ needs.release.outputs.version }}
            io.heyditto.validator.stack-revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.stack-service=dittobench-api

  # The retired relay image is independent of the native scorer children.
  # Build it while those slower architecture lanes compile instead of making
  # their fan-in pay the QEMU setup and compatibility build serially.
  build-model-relay-compat:
    needs: [plan, release, prepare-dittobench]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.prepare-dittobench.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.model-relay.outputs.digest }}
      revision: ${{ needs.prepare-dittobench.outputs.relay_compat_revision }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up QEMU for the retired compatibility image
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # compat-2 still serves frozen host-side updaters whose signed descriptor
      # contract requires this image. The rendered stack isolates it from the
      # scorer and validator; it is not part of the active inference path.
      - name: Build and publish the retired relay compatibility index
        id: model-relay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.MODEL_RELAY_COMPAT_DIR }}
          file: ${{ env.MODEL_RELAY_COMPAT_DIR }}/Dockerfile
          target: relay
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=model-relay-compat
          cache-to: type=gha,mode=max,scope=model-relay-compat
          # Frozen compat-2 updaters require every dittobench-api image to
          # advertise the descriptor's active dittobench revision. Preserve
          # the bridge's actual frozen source in a separate label.
          labels: |
            org.opencontainers.image.source=https://github.com/ditto-assistant/dittobench-api
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare-dittobench.outputs.revision }}
            io.heyditto.validator.build-source=https://github.com/ditto-assistant/ditto-subnet/tree/${{ needs.release.outputs.commit_sha }}/services/dittobench-api/compat/model-relay
            io.heyditto.validator.build-source-revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.compat-source-revision=${{ needs.prepare-dittobench.outputs.relay_compat_revision }}
            io.heyditto.validator.stack-version=${{ needs.release.outputs.version }}
            io.heyditto.validator.stack-revision=${{ needs.release.outputs.commit_sha }}
            io.heyditto.validator.stack-service=model-relay
          tags: |
            ${{ env.MODEL_RELAY_REPOSITORY }}:sha-${{ needs.release.outputs.commit_sha }}

  build-dittobench:
    needs:
      - plan
      - release
      - prepare-dittobench
      - build-dittobench-amd64
      - build-dittobench-arm64
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.prepare-dittobench.result == 'success' &&
      needs.build-dittobench-amd64.result == 'success' &&
      needs.build-dittobench-arm64.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ needs.prepare-dittobench.outputs.revision }}
      scorer_digest: ${{ steps.dittobench-api.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the scorer multi-platform index
        id: dittobench-api
        env:
          AMD64_DIGEST: ${{ needs.build-dittobench-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-dittobench-arm64.outputs.digest }}
        run: |
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          image="$DITTOBENCH_API_REPOSITORY:sha-${{ needs.release.outputs.commit_sha }}"
          docker buildx imagetools create --tag "$image" \
            "$DITTOBENCH_API_REPOSITORY@$AMD64_DIGEST" \
            "$DITTOBENCH_API_REPOSITORY@$ARM64_DIGEST"
          digest="$(
            docker buildx imagetools inspect "$image" \
              --format '{{json .Manifest}}' | jq -r .digest
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

  publish-datagen:
    needs: [plan, release]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.dittobench_datagen == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      component_tag: ${{ steps.verify.outputs.component_tag }}
    steps:
      - name: Check out the exact tagged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: research/dittobench-datagen/go.mod

      - name: Verify the monorepo-tagged generate service
        id: verify
        run: research/dittobench-datagen/scripts/verify-generate-service-release.sh

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DATAGEN_RELEASE_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish immutable component and source tags
        id: publish
        env:
          COMPONENT_TAG: ${{ steps.verify.outputs.component_tag }}
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          component_image="$DATAGEN_REPOSITORY:$COMPONENT_TAG"
          source_image="$DATAGEN_REPOSITORY:sha-$SOURCE_SHA"
          component_digest="$(gcloud artifacts docker images describe \
            "$component_image" --format='value(image_summary.digest)' 2>/dev/null || true)"
          source_digest="$(gcloud artifacts docker images describe \
            "$source_image" --format='value(image_summary.digest)' 2>/dev/null || true)"
          for existing in "$component_digest" "$source_digest"; do
            [ -z "$existing" ] || [[ "$existing" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          if [ -n "$component_digest" ] && [ -n "$source_digest" ] && \
             [ "$component_digest" != "$source_digest" ]; then
            echo "::error::immutable datagen tags resolve to different images"
            exit 1
          fi

          digest="${source_digest:-$component_digest}"
          if [ -z "$digest" ]; then
            docker tag "generate-service:$COMPONENT_TAG" "$source_image"
            docker push "$source_image"
            digest="$(gcloud artifacts docker images describe \
              "$source_image" --format='value(image_summary.digest)')"
            source_digest="$digest"
          else
            echo "reusing immutable datagen image: $DATAGEN_REPOSITORY@$digest"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ -z "$source_digest" ]; then
            gcloud artifacts docker tags add \
              "$DATAGEN_REPOSITORY@$digest" "$source_image" --quiet
          fi
          if [ -z "$component_digest" ]; then
            gcloud artifacts docker tags add \
              "$DATAGEN_REPOSITORY@$digest" "$component_image" --quiet
          fi
          test "$(gcloud artifacts docker images describe "$source_image" \
            --format='value(image_summary.digest)')" = "$digest"
          test "$(gcloud artifacts docker images describe "$component_image" \
            --format='value(image_summary.digest)')" = "$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "datagen image: $DATAGEN_REPOSITORY@$digest"

      # External-account ADC cannot mint an audience-bound token through
      # `gcloud auth print-identity-token --audiences`. Ask the auth action for
      # a fresh Cloud Run token immediately before the candidate smoke test.
      - name: Mint the authenticated datagen smoke token
        id: datagen-smoke-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DATAGEN_RELEASE_SA }}
          token_format: id_token
          id_token_audience: ${{ env.DATAGEN_SERVICE_URL }}

      - name: Stage, verify, and deploy the immutable datagen image
        env:
          DATAGEN_ID_TOKEN: ${{ steps.datagen-smoke-auth.outputs.id_token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="$DATAGEN_REPOSITORY@$IMAGE_DIGEST"
          candidate_tag="release-${SOURCE_SHA:0:12}"
          service_url="$(gcloud run services describe "$DATAGEN_SERVICE" \
            --project="$DATAGEN_PROJECT" --region="$DATAGEN_REGION" \
            --format='value(status.url)')"
          test "$service_url" = "$DATAGEN_SERVICE_URL"

          # A zero-traffic tagged revision gives release CI an authenticated URL
          # for the exact digest without exposing a broken generator to Platform.
          gcloud run services update "$DATAGEN_SERVICE" \
            --project="$DATAGEN_PROJECT" \
            --region="$DATAGEN_REGION" \
            --image="$image" \
            --no-traffic \
            --tag="$candidate_tag" \
            --quiet

          status_file="$(mktemp)"
          headers_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$status_file" "$headers_file" "$response_file"' EXIT
          gcloud run services describe "$DATAGEN_SERVICE" \
            --project="$DATAGEN_PROJECT" --region="$DATAGEN_REGION" \
            --format=json >"$status_file"
          deployed_image="$(jq -r '.spec.template.spec.containers[0].image' "$status_file")"
          candidate_url="$(jq -r --arg tag "$candidate_tag" \
            '.status.traffic[] | select(.tag == $tag) | .url' "$status_file")"
          test "$deployed_image" = "$image"
          [[ "$candidate_url" == https://* ]]

          test -n "$DATAGEN_ID_TOKEN"
          for bench_version in 8 9; do
            http_status="$(curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $DATAGEN_ID_TOKEN" \
              --dump-header "$headers_file" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$candidate_url/generate?seed=42&run_size=small&bench_version=$bench_version")"
            test "$http_status" = "200"
            tr -d '\r' <"$headers_file" | grep -Eqi "^x-bench-version: $bench_version$"
            jq -e . "$response_file" >/dev/null
          done

          # Promotion also restores the declarative "latest receives 100%"
          # traffic policy so future semantic releases converge the same way.
          gcloud run services update-traffic "$DATAGEN_SERVICE" \
            --project="$DATAGEN_PROJECT" \
            --region="$DATAGEN_REGION" \
            --remove-tags="$candidate_tag" \
            --to-latest \
            --quiet
          gcloud run services describe "$DATAGEN_SERVICE" \
            --project="$DATAGEN_PROJECT" --region="$DATAGEN_REGION" \
            --format=json | jq -e --arg image "$image" '
              .spec.template.spec.containers[0].image == $image and
              any(.status.traffic[];
                .latestRevision == true and .percent == 100)
            ' >/dev/null

  deploy-dittobench:
    needs: [plan, release, build-dittobench]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.dittobench_api == 'true' &&
      needs.build-dittobench.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DITTOBENCH_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Both identity args are required. The runtime fails /v1/capabilities
      # closed when either resolves empty, and the Dockerfile's `unknown`
      # default normalizes to empty — so omitting the version arg publishes an
      # image whose capability endpoint answers 503 "scorer release identity
      # unavailable" for the life of the release, which is exactly how hosted
      # practice went dark.
      - name: Publish the hosted runtime from the release commit
        id: hosted-image
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
          SOFTWARE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$SOFTWARE_VERSION" && "$SOFTWARE_VERSION" != "unknown" ]]
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build \
            --file services/dittobench-api/Dockerfile \
            --target runtime \
            --build-arg "DITTOBENCH_SOURCE_SHA=$SOURCE_SHA" \
            --build-arg "DITTOBENCH_SOFTWARE_VERSION=$SOFTWARE_VERSION" \
            --tag "$DITTOBENCH_HOSTED_REPOSITORY:sha-$SOURCE_SHA" \
            .
          docker push "$DITTOBENCH_HOSTED_REPOSITORY:sha-$SOURCE_SHA"
          digest="$(gcloud artifacts docker images describe \
            "$DITTOBENCH_HOSTED_REPOSITORY:sha-$SOURCE_SHA" \
            --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Deploy the immutable hosted image
        env:
          IMAGE_DIGEST: ${{ steps.hosted-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gcloud run deploy dittobench-api \
            --image "$DITTOBENCH_HOSTED_REPOSITORY@$IMAGE_DIGEST" \
            --project ditto-app-dev \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 3600 \
            --set-env-vars GENERATOR_MODEL=google/gemini-3.1-flash-lite,SCORER_MODEL=google/gemini-3.1-flash-lite \
            --quiet

      # A deploy that serves /health but answers 503 on /v1/capabilities is
      # indistinguishable from a healthy one at the Cloud Run level, and every
      # miner-facing practice client reads the capability document. Assert the
      # live identity here so an unstamped image fails the release instead of
      # sitting broken until a miner reports it.
      - name: Verify the live practice endpoint reports its release identity
        env:
          SOURCE_SHA: ${{ needs.release.outputs.commit_sha }}
          SOFTWARE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe dittobench-api \
            --project ditto-app-dev \
            --region us-central1 \
            --format='value(status.url)')"
          [[ -n "$service_url" ]]
          capabilities="$(curl --fail --silent --show-error --retry 5 \
            --retry-all-errors --retry-delay 10 --max-time 30 \
            "$service_url/v1/capabilities")"
          echo "$capabilities" | jq -e \
            --arg sha "$SOURCE_SHA" --arg version "$SOFTWARE_VERSION" '
              .source_revision == $sha and
              .software_version == $version and
              (.source_revision_mismatch | not) and
              (.supported_bench_versions | sort == [8, 9, 10])
            ' >/dev/null
          for bench_version in 8 9; do
            headers_file="$(mktemp)"
            body_file="$(mktemp)"
            trap 'rm -f "$headers_file" "$body_file"' EXIT
            curl --fail --silent --show-error --retry 5 \
              --retry-all-errors --retry-delay 10 --max-time 30 \
              --dump-header "$headers_file" --output "$body_file" \
              "$service_url/v1/dataset?seed=42&n=1&bench_version=$bench_version"
            tr -d '\r' <"$headers_file" | grep -Eqi "^x-bench-version: $bench_version$"
            jq -e '.tool_cases | length == 1' "$body_file" >/dev/null
            rm -f "$headers_file" "$body_file"
            trap - EXIT
          done

  # ---------------------------------------------------------------------------
  # Fan-in: every component image exists and the source re-verified. Authenticate
  # each index, smoke the amd64 validator, render the digest-bound bundle, and
  # build + sign the immutable stack descriptor.
  # ---------------------------------------------------------------------------

  assemble-stack:
    needs:
      - release
      - plan
      - verify-source
      - build-validator
      - build-sandbox-docker
      - build-dittobench
      - build-model-relay-compat
      - build-pylon
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.verify-source.result == 'success' &&
      needs.build-validator.result == 'success' &&
      needs.build-sandbox-docker.result == 'success' &&
      needs.build-dittobench.result == 'success' &&
      needs.build-model-relay-compat.result == 'success' &&
      needs.build-pylon.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      validator_digest: ${{ needs.build-validator.outputs.digest }}
      stack_digest: ${{ steps.stack.outputs.digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The render script (build-stack-release.py) imports PyYAML, so the project
      # env must be synced here — the full source re-verification that used to
      # sync it now runs in the parallel verify-source job.
      - name: Sync the project environment
        run: uv sync --locked --group dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify every first-party multi-platform index
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.commit_sha }}
          DITTOBENCH_REVISION: ${{ needs.build-dittobench.outputs.revision }}
          MODEL_RELAY_COMPAT_REVISION: ${{ needs.build-model-relay-compat.outputs.revision }}
        run: |
          declare -A artifacts=(
            ["$VALIDATOR_REPOSITORY"]="${{ needs.build-validator.outputs.digest }}"
            ["$SANDBOX_DOCKER_REPOSITORY"]="${{ needs.build-sandbox-docker.outputs.digest }}"
            ["$DITTOBENCH_API_REPOSITORY"]="${{ needs.build-dittobench.outputs.scorer_digest }}"
            ["$MODEL_RELAY_REPOSITORY"]="${{ needs.build-model-relay-compat.outputs.digest }}"
          )
          declare -A sources=(
            ["$VALIDATOR_REPOSITORY"]="https://github.com/ditto-assistant/ditto-subnet"
            ["$SANDBOX_DOCKER_REPOSITORY"]="https://github.com/ditto-assistant/ditto-subnet"
            ["$DITTOBENCH_API_REPOSITORY"]="https://github.com/ditto-assistant/ditto-subnet"
            ["$MODEL_RELAY_REPOSITORY"]="https://github.com/ditto-assistant/dittobench-api"
          )
          declare -A revisions=(
            ["$VALIDATOR_REPOSITORY"]="$REVISION"
            ["$SANDBOX_DOCKER_REPOSITORY"]="$REVISION"
            ["$DITTOBENCH_API_REPOSITORY"]="$DITTOBENCH_REVISION"
            ["$MODEL_RELAY_REPOSITORY"]="$DITTOBENCH_REVISION"
          )
          declare -A services=(
            ["$SANDBOX_DOCKER_REPOSITORY"]="sandbox-docker"
            ["$DITTOBENCH_API_REPOSITORY"]="dittobench-api"
            ["$MODEL_RELAY_REPOSITORY"]="model-relay"
          )
          verify_artifact() {
            local repository="$1" digest raw amd64_digest child
            digest="${artifacts[$repository]}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            raw="$(docker buildx imagetools inspect --raw "$repository@$digest")"
            for architecture in amd64 arm64; do
              jq -e --arg architecture "$architecture" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] | length == 1' \
                <<<"$raw" >/dev/null
            done
            amd64_digest="$(
              jq -er \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected one amd64 manifest") end' \
                <<<"$raw"
            )"
            child="$repository@$amd64_digest"
            docker pull --platform linux/amd64 "$child"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$child")" = "${sources[$repository]}"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$child")" = "$VERSION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$child")" = "${revisions[$repository]}"
            if [ "$repository" = "$VALIDATOR_REPOSITORY" ]; then
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator-service" }}' "$child")" = "true"
            else
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.stack-service" }}' "$child")" = "${services[$repository]}"
            fi
            if [ "$repository" = "$DITTOBENCH_API_REPOSITORY" ]; then
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.build-source" }}' "$child")" = "https://github.com/ditto-assistant/ditto-subnet"
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.build-source-revision" }}' "$child")" = "$DITTOBENCH_REVISION"
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.stack-version" }}' "$child")" = "$VERSION"
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.stack-revision" }}' "$child")" = "$REVISION"
            fi
            if [ "$repository" = "$MODEL_RELAY_REPOSITORY" ]; then
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.build-source" }}' "$child")" = "https://github.com/ditto-assistant/ditto-subnet/tree/$REVISION/services/dittobench-api/compat/model-relay"
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.build-source-revision" }}' "$child")" = "$REVISION"
              test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.compat-source-revision" }}' "$child")" = "$MODEL_RELAY_COMPAT_REVISION"
            fi
          }
          pids=()
          for repository in "${!artifacts[@]}"; do
            verify_artifact "$repository" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      - name: Smoke-test the amd64 validator artifact by exact child digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.commit_sha }}
          VALIDATOR_DIGEST: ${{ needs.build-validator.outputs.digest }}
        run: |
          raw="$(
            docker buildx imagetools inspect --raw \
              "$VALIDATOR_REPOSITORY@$VALIDATOR_DIGEST"
          )"
          child_digest="$(
            jq -er \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected one child manifest") end' \
              <<<"$raw"
          )"
          exact="$VALIDATOR_REPOSITORY@$child_digest"
          volume="ditto-validator-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64"
          docker pull --platform linux/amd64 "$exact"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.compatibility-epoch" }}' "$exact")" = "$COMPATIBILITY_EPOCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.heartbeat-protocol" }}' "$exact")" = "$HEARTBEAT_PROTOCOL"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$exact")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact")" = "$REVISION"
          docker volume create "$volume"
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --mount "type=volume,source=$volume,target=/var/lib/ditto-validator-update" \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            --env VALIDATOR_BOOTSTRAP_TOKEN=release-smoke \
            --entrypoint uv "$exact" run --no-sync python -c \
            'from ditto.validator.update_control import bootstrap_should_start_drained as s, mark_bootstrap_resumed as m; assert s(True); assert m(); assert not s(True)'
          docker volume rm "$volume"
          trap - EXIT

      # Frozen compat-2 hosts authenticate components with Docker's local image
      # inspector before they drain. Bind each descriptor architecture directly
      # to the matching canonical child manifest: containerd-backed Docker
      # stores inspect an index as an index, which has no config labels.
      - name: Resolve frozen-updater runtime manifests
        id: compat-runtime
        env:
          VALIDATOR_DIGEST: ${{ needs.build-validator.outputs.digest }}
          SANDBOX_DOCKER_DIGEST: ${{ needs.build-sandbox-docker.outputs.digest }}
          DITTOBENCH_API_DIGEST: ${{ needs.build-dittobench.outputs.scorer_digest }}
          MODEL_RELAY_DIGEST: ${{ needs.build-model-relay-compat.outputs.digest }}
          PYLON_DIGEST: ${{ needs.build-pylon.outputs.digest }}
        run: |
          resolve() {
            local output="$1" repository="$2" digest="$3" architecture="$4"
            local raw child_digest
            raw="$(docker buildx imagetools inspect --raw "$repository@$digest")"
            child_digest="$(
              jq -er --arg architecture "$architecture" '
                [.manifests[] |
                  select(.platform.os == "linux" and .platform.architecture == $architecture)] |
                if length == 1 then .[0].digest
                else error("expected exactly one canonical child for linux/" + $architecture)
                end
              ' <<<"$raw"
            )"
            [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$output" "$child_digest" >>"$GITHUB_OUTPUT"
          }
          for architecture in amd64 arm64; do
            resolve "validator_${architecture}_digest" "$VALIDATOR_REPOSITORY" \
              "$VALIDATOR_DIGEST" "$architecture"
            resolve "sandbox_docker_${architecture}_digest" \
              "$SANDBOX_DOCKER_REPOSITORY" "$SANDBOX_DOCKER_DIGEST" "$architecture"
            resolve "dittobench_api_${architecture}_digest" \
              "$DITTOBENCH_API_REPOSITORY" "$DITTOBENCH_API_DIGEST" "$architecture"
            resolve "model_relay_${architecture}_digest" \
              "$MODEL_RELAY_REPOSITORY" "$MODEL_RELAY_DIGEST" "$architecture"
          done
          # Pylon is currently published for amd64 only. Both descriptor
          # children keep its exact runtime manifest; arm64 stack activation
          # remains a separately supervised boundary, as it was before this
          # bridge.
          resolve pylon_digest "$PYLON_REPOSITORY" "$PYLON_DIGEST" amd64

      - name: Render the architecture-bound stack bundles
        run: |
          for architecture in amd64 arm64; do
            case "$architecture" in
              amd64)
                validator_digest='${{ steps.compat-runtime.outputs.validator_amd64_digest }}'
                sandbox_digest='${{ steps.compat-runtime.outputs.sandbox_docker_amd64_digest }}'
                api_digest='${{ steps.compat-runtime.outputs.dittobench_api_amd64_digest }}'
                relay_digest='${{ steps.compat-runtime.outputs.model_relay_amd64_digest }}'
                ;;
              arm64)
                validator_digest='${{ steps.compat-runtime.outputs.validator_arm64_digest }}'
                sandbox_digest='${{ steps.compat-runtime.outputs.sandbox_docker_arm64_digest }}'
                api_digest='${{ steps.compat-runtime.outputs.dittobench_api_arm64_digest }}'
                relay_digest='${{ steps.compat-runtime.outputs.model_relay_arm64_digest }}'
                ;;
            esac
            uv run python scripts/build-stack-release.py \
              --compose docker-compose.yml \
              --output "build/stack-release-$architecture" \
              --version "${{ needs.release.outputs.version }}" \
              --revision "${{ needs.release.outputs.commit_sha }}" \
              --dittobench-revision "${{ needs.build-dittobench.outputs.revision }}" \
              --compatibility-epoch "$COMPATIBILITY_EPOCH" \
              --update-protocol "$UPDATE_PROTOCOL" \
              --heartbeat-protocol "$HEARTBEAT_PROTOCOL" \
              --compose-schema "$COMPOSE_SCHEMA" \
              --validator-image "$VALIDATOR_REPOSITORY@$validator_digest" \
              --sandbox-docker-image "$SANDBOX_DOCKER_REPOSITORY@$sandbox_digest" \
              --dittobench-api-image "$DITTOBENCH_API_REPOSITORY@$api_digest" \
              --model-relay-image "$MODEL_RELAY_REPOSITORY@$relay_digest" \
              --ollama-image "$OLLAMA_IMAGE" \
              --pylon-image "$PYLON_REPOSITORY@${{ steps.compat-runtime.outputs.pylon_digest }}"
            test "$(grep -c '^' "build/stack-release-$architecture/manifest.env")" = 14
            ! grep -qE '(^|[[:space:]])build:' \
              "build/stack-release-$architecture/compose.yml"
          done

      - name: Build and publish the immutable stack descriptor
        id: stack
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.stack-release
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=stack-release
          cache-to: type=gha,mode=max,scope=stack-release
          build-args: |
            DITTO_VERSION=${{ needs.release.outputs.version }}
            DITTO_REVISION=${{ needs.release.outputs.commit_sha }}
            VALIDATOR_COMPATIBILITY_EPOCH=${{ env.COMPATIBILITY_EPOCH }}
            VALIDATOR_UPDATE_PROTOCOL=${{ env.UPDATE_PROTOCOL }}
            VALIDATOR_COMPOSE_SCHEMA=${{ env.COMPOSE_SCHEMA }}
          tags: |
            ${{ env.STACK_REPOSITORY }}:sha-${{ needs.release.outputs.commit_sha }}

      - name: Smoke-test and authenticate the exact stack descriptor
        env:
          STACK_DIGEST: ${{ steps.stack.outputs.digest }}
        run: |
          [[ "$STACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          exact="$STACK_REPOSITORY@$STACK_DIGEST"
          raw="$(docker buildx imagetools inspect --raw "$exact")"
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            child_digest="$(
              jq -er --arg architecture "$architecture" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] | if length == 1 then .[0].digest else error("expected one child manifest") end' \
                <<<"$raw"
            )"
            child_exact="$STACK_REPOSITORY@$child_digest"
            container="ditto-stack-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${platform#linux/}"
            docker pull --platform "$platform" "$child_exact"
            test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.stack-release" }}' "$child_exact")" = "true"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$child_exact")" = "${{ needs.release.outputs.version }}"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$child_exact")" = "${{ needs.release.outputs.commit_sha }}"
            docker create --platform "$platform" --name "$container" "$child_exact"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
            docker cp "$container:/release/." "build/stack-smoke-${platform#linux/}"
            cmp "build/stack-release-${platform#linux/}/manifest.env" "build/stack-smoke-${platform#linux/}/manifest.env"
            cmp "build/stack-release-${platform#linux/}/compose.yml" "build/stack-smoke-${platform#linux/}/compose.yml"
            docker rm "$container"
            trap - EXIT
          done
          cosign sign --yes "$exact"
          cosign verify \
            --certificate-identity-regexp \
              '^https://github.com/ditto-assistant/ditto-subnet/.github/workflows/release.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$exact" >/dev/null

  # Boot the exact digest-bound amd64 runtime beside descriptor assembly. The
  # smoke remains a fail-closed promotion prerequisite, but its network pulls
  # and container startup no longer serialize descriptor publication/staging.
  smoke-stack-runtime-amd64:
    needs:
      - plan
      - release
      - build-validator
      - build-sandbox-docker
      - build-dittobench
      - build-model-relay-compat
      - build-pylon
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.build-validator.result == 'success' &&
      needs.build-sandbox-docker.result == 'success' &&
      needs.build-dittobench.result == 'success' &&
      needs.build-model-relay-compat.result == 'success' &&
      needs.build-pylon.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the exact amd64 runtime bundle
        env:
          VALIDATOR_DIGEST: ${{ needs.build-validator.outputs.digest }}
          SANDBOX_DOCKER_DIGEST: ${{ needs.build-sandbox-docker.outputs.digest }}
          DITTOBENCH_API_DIGEST: ${{ needs.build-dittobench.outputs.scorer_digest }}
          MODEL_RELAY_DIGEST: ${{ needs.build-model-relay-compat.outputs.digest }}
          PYLON_DIGEST: ${{ needs.build-pylon.outputs.digest }}
        run: |
          resolve() {
            local repository="$1" digest="$2" raw child_digest
            raw="$(docker buildx imagetools inspect --raw "$repository@$digest")"
            child_digest="$(
              jq -er '
                [.manifests[] |
                  select(.platform.os == "linux" and .platform.architecture == "amd64")] |
                if length == 1 then .[0].digest
                else error("expected exactly one canonical child for linux/amd64")
                end
              ' <<<"$raw"
            )"
            [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n' "$child_digest"
          }
          validator_digest="$(resolve "$VALIDATOR_REPOSITORY" "$VALIDATOR_DIGEST")"
          sandbox_digest="$(resolve "$SANDBOX_DOCKER_REPOSITORY" "$SANDBOX_DOCKER_DIGEST")"
          api_digest="$(resolve "$DITTOBENCH_API_REPOSITORY" "$DITTOBENCH_API_DIGEST")"
          relay_digest="$(resolve "$MODEL_RELAY_REPOSITORY" "$MODEL_RELAY_DIGEST")"
          pylon_digest="$(resolve "$PYLON_REPOSITORY" "$PYLON_DIGEST")"
          uv run --isolated --no-project --with pyyaml==6.0.3 \
            python scripts/build-stack-release.py \
              --compose docker-compose.yml \
              --output build/stack-runtime-smoke-amd64 \
              --version "${{ needs.release.outputs.version }}" \
              --revision "${{ needs.release.outputs.commit_sha }}" \
              --dittobench-revision "${{ needs.build-dittobench.outputs.revision }}" \
              --compatibility-epoch "$COMPATIBILITY_EPOCH" \
              --update-protocol "$UPDATE_PROTOCOL" \
              --heartbeat-protocol "$HEARTBEAT_PROTOCOL" \
              --compose-schema "$COMPOSE_SCHEMA" \
              --validator-image "$VALIDATOR_REPOSITORY@$validator_digest" \
              --sandbox-docker-image "$SANDBOX_DOCKER_REPOSITORY@$sandbox_digest" \
              --dittobench-api-image "$DITTOBENCH_API_REPOSITORY@$api_digest" \
              --model-relay-image "$MODEL_RELAY_REPOSITORY@$relay_digest" \
              --ollama-image "$OLLAMA_IMAGE" \
              --pylon-image "$PYLON_REPOSITORY@$pylon_digest"
          test "$(grep -c '^' build/stack-runtime-smoke-amd64/manifest.env)" = 14
          ! grep -qE '(^|[[:space:]])build:' \
            build/stack-runtime-smoke-amd64/compose.yml

      - name: Boot the exact release runtime dependencies
        env:
          # Public SS58 fixture required to render the targeted bootstrap policy.
          # Keep it different from the WSL allowlisted hotkey so this dependency
          # smoke cannot exercise the exceptional host-updater replacement.
          VALIDATOR_HOTKEY: 5CZq6MdanxF3j8ACp8oVtiaphTeyrA7QFPU92ke2jEFzK1mp
        run: |
          scripts/test-validator-stack-release-runtime.sh \
            build/stack-runtime-smoke-amd64/compose.yml

  smoke-validator-arm64:
    needs: [plan, release, build-validator]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.build-validator.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU for the arm64 runtime smoke
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the arm64 validator artifact by exact child digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.commit_sha }}
          VALIDATOR_DIGEST: ${{ needs.build-validator.outputs.digest }}
        run: |
          raw="$(
            docker buildx imagetools inspect --raw \
              "$VALIDATOR_REPOSITORY@$VALIDATOR_DIGEST"
          )"
          child_digest="$(
            jq -er \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("expected one child manifest") end' \
              <<<"$raw"
          )"
          exact="$VALIDATOR_REPOSITORY@$child_digest"
          volume="ditto-validator-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          docker pull --platform linux/arm64 "$exact"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.compatibility-epoch" }}' "$exact")" = "$COMPATIBILITY_EPOCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.heyditto.validator.heartbeat-protocol" }}' "$exact")" = "$HEARTBEAT_PROTOCOL"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$exact")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact")" = "$REVISION"
          docker volume create "$volume"
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add DAC_READ_SEARCH \
            --mount "type=volume,source=$volume,target=/var/lib/ditto-validator-update" \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            --env VALIDATOR_BOOTSTRAP_TOKEN=release-smoke \
            --entrypoint uv "$exact" run --no-sync python -c \
            'from ditto.validator.update_control import bootstrap_should_start_drained as s, mark_bootstrap_resumed as m; assert s(True); assert m(); assert not s(True)'
          docker volume rm "$volume"
          trap - EXIT

  stage-stack-release:
    needs: [plan, release, assemble-stack]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.assemble-stack.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This channel is never an activation authority. Managed hosts resolve it
      # to the signed immutable descriptor, authenticate that digest, and pull
      # its components without draining or changing the running stack.
      - name: Stage the authenticated descriptor for fleet prefetch
        env:
          STACK_DIGEST: ${{ needs.assemble-stack.outputs.stack_digest }}
        run: |
          set -euo pipefail
          source="$STACK_REPOSITORY@$STACK_DIGEST"
          candidate="$STACK_REPOSITORY:candidate-compat-$COMPATIBILITY_EPOCH"
          docker buildx imagetools create --tag "$candidate" "$source"
          staged="$(
            docker buildx imagetools inspect "$candidate" \
              --format '{{json .Manifest}}' | jq -r .digest
          )"
          test "$staged" = "$STACK_DIGEST"

  promote-stack-release:
    needs:
      - plan
      - release
      - assemble-stack
      - smoke-stack-runtime-amd64
      - smoke-validator-arm64
      - stage-stack-release
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true' &&
      needs.plan.outputs.validator_stack == 'true' &&
      needs.assemble-stack.result == 'success' &&
      needs.smoke-stack-runtime-amd64.result == 'success' &&
      needs.smoke-validator-arm64.result == 'success' &&
      needs.stage-stack-release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The mutable discovery tag advances only after every immutable component
      # exists, both native validator smoke tests pass, the bundle was extracted
      # on both platforms, and its digest was authenticated.
      - name: Promote only the authenticated stack descriptor
        env:
          STACK_DIGEST: ${{ needs.assemble-stack.outputs.stack_digest }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          source="$STACK_REPOSITORY@$STACK_DIGEST"
          docker buildx imagetools create \
            --tag "$STACK_REPOSITORY:$RELEASE_TAG" \
            --tag "$STACK_REPOSITORY:compat-$COMPATIBILITY_EPOCH" \
            "$source"
          for tag in "$RELEASE_TAG" "compat-$COMPATIBILITY_EPOCH"; do
            promoted="$(
              docker buildx imagetools inspect "$STACK_REPOSITORY:$tag" \
                --format '{{json .Manifest}}' | jq -r .digest
            )"
            test "$promoted" = "$STACK_DIGEST"
          done
