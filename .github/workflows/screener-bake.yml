name: Bake screener fleet image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: bake-screener-fleet-image
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      GCP_PROJECT: ditto-app-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bake configuration
        env:
          WIF: ${{ secrets.GCP_WIF_PROVIDER }}
          SA: ${{ secrets.GCP_SCREENER_BAKE_SA }}
        run: |
          : "${WIF:?GCP_WIF_PROVIDER repo secret is not set}"
          : "${SA:?GCP_SCREENER_BAKE_SA repo secret is not set}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SCREENER_BAKE_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The action itself is commit-pinned; it installs the explicit Packer
      # version below. This is a version pin, not a locally verified binary hash.
      - uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2
        with:
          version: 1.14.2

      - name: Package the sparse screener checkout for baking
        run: >-
          tar czf /tmp/src.tgz
          --exclude=.venv --exclude=__pycache__ --exclude='*.pyc'
          --exclude=.pytest_cache --exclude=.ruff_cache
          .git workers/screener packages/ditto-screening-protocol

      - name: Build the golden image
        run: |
          packer init workers/screener/packer/
          packer build \
            -var "project_id=${GCP_PROJECT}" \
            -var "src_tarball=/tmp/src.tgz" \
            workers/screener/packer/screener-fleet.pkr.hcl
