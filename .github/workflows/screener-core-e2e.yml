name: Daily screener anti-cheat core E2E

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screener-core-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screener-core-e2e:
    name: Real Docker starter and L2 harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workers/screener
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          enable-cache: true

      - run: uv python install 3.11
      - run: uv sync --locked --group dev

      - name: Run real build and health smoke with no default /run call
        env:
          DITTO_STARTER_KIT_DIR: ${{ github.workspace }}/miners/starter-kit
        run: |
          test -f "$DITTO_STARTER_KIT_DIR/Cargo.toml"
          uv run pytest -m integration \
            tests/test_gate_docker_integration.py \
            tests/test_l2_review.py -vv

      - name: Publish scheduled coverage status
        if: always()
        run: |
          {
            echo "## Real Docker anti-cheat E2E"
            echo
            echo "Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
