name: Publish stack preview

# Manual controller for the bounded SN118 cloud preview fleet. Nothing here runs
# automatically: an 8-vCPU VM only ever exists because a maintainer asked for
# one. Dispatching requires repository write access, the protected preview-stack
# environment pins this workflow to the default branch, and the privileged
# runner never executes PR code -- the exact PR commit runs later on a
# credential-empty isolated VM.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number in this repository
        required: true
        type: string
      action:
        description: Create a preview, or free the slot this PR holds
        required: false
        type: choice
        default: provision
        options: [provision, retire]
      profile:
        description: auto picks stack-copy when the PR touches alembic, else stack
        required: false
        type: choice
        default: auto
        options: [auto, stack, stack-copy]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: stack-preview-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  control:
    # The OIDC subject in infra/terraform/stacks/gcp-preview is scoped to this
    # environment, not to a ref, so a dispatch from a feature branch would run
    # modified controller code with the cloud identity. The environment's
    # deployment-branch policy is the binding control; this is its in-repo twin.
    if: >-
      github.repository == 'ditto-assistant/ditto-subnet' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: preview-stack
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PREVIEW_PR: ${{ inputs.pr }}
      GCP_PREVIEW_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_PREVIEW_CONTROLLER_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_PREVIEW_LEASE_BUCKET: ${{ vars.GCP_PREVIEW_LEASE_BUCKET }}
      GCP_PREVIEW_SNAPSHOT_BUCKET: ${{ vars.GCP_PREVIEW_SNAPSHOT_BUCKET }}
      GCP_PREVIEW_NETWORK: ${{ vars.GCP_PREVIEW_NETWORK }}
      GCP_PREVIEW_SUBNETWORK: ${{ vars.GCP_PREVIEW_SUBNETWORK }}
      GCP_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_PREVIEW_RUNTIME_SERVICE_ACCOUNT }}
      GCP_PREVIEW_ZONE: ${{ vars.GCP_PREVIEW_ZONE }}
      # Optional sizing and lifetime knobs. Every consumer reads them as
      # ${VAR:-default}, so an unset repository variable arrives as "" and the
      # built-in default still wins. They must stay out of the activation gate
      # below for the same reason.
      GCP_PREVIEW_MACHINE_TYPE: ${{ vars.GCP_PREVIEW_MACHINE_TYPE }}
      GCP_PREVIEW_DISK_SIZE: ${{ vars.GCP_PREVIEW_DISK_SIZE }}
      PREVIEW_LEASE_TTL_SECONDS: ${{ vars.PREVIEW_LEASE_TTL_SECONDS }}
      # Point these at the family produced by preview-base-bake.yml to boot from
      # the pre-baked image. Unset means stock Ubuntu, which still works -- the
      # only difference is that the boot pays for apt and a cold Docker cache.
      # Note that a baked image sets a floor on GCP_PREVIEW_DISK_SIZE equal to
      # the bake disk (32GB by default); a smaller value is rejected outright by
      # instances create.
      GCP_PREVIEW_IMAGE_FAMILY: ${{ vars.GCP_PREVIEW_IMAGE_FAMILY }}
      GCP_PREVIEW_IMAGE_PROJECT: ${{ vars.GCP_PREVIEW_IMAGE_PROJECT }}
    steps:
      - name: Check out trusted controller from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check whether stack previews are activated
        id: activation
        run: |
          enabled=true
          for name in \
            GCP_PREVIEW_CONTROLLER_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_PREVIEW_LEASE_BUCKET \
            GCP_PREVIEW_SNAPSHOT_BUCKET \
            GCP_PREVIEW_NETWORK \
            GCP_PREVIEW_SUBNETWORK \
            GCP_PREVIEW_RUNTIME_SERVICE_ACCOUNT \
            GCP_PREVIEW_ZONE; do
            if [ -z "${!name}" ]; then
              enabled=false
            fi
          done
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != true ]; then
            echo "Stack previews are not activated; skipping this dispatch."
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.activation.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_CONTROLLER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.activation.outputs.enabled == 'true'

      - name: Resolve the requested PR, head commit, action, and profile
        id: resolve
        if: steps.activation.outputs.enabled == 'true'
        env:
          INPUT_PR: ${{ inputs.pr }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo "pr must be a positive integer" >&2; exit 2; }

          action="${INPUT_ACTION:-provision}"
          case "$action" in provision|retire) ;; *) echo "invalid action" >&2; exit 2 ;; esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [ "$action" = retire ]; then
            echo "profile=none" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The head commit is read from the API and never accepted from the
          # operator, so provision.sh's stale-head assertion still means
          # something rather than comparing an input against itself.
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR}")"
          state="$(jq -r .state <<<"$pr_json")"
          head_repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          sha="$(jq -r .head.sha <<<"$pr_json")"
          [ "$state" = open ] || { echo "PR #${INPUT_PR} is not open" >&2; exit 2; }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "fork previews are not allowed" >&2; exit 2; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve an exact head commit" >&2; exit 2; }

          # A maintainer who dispatched this workflow has already decided the PR
          # deserves a preview, so auto only chooses which profile to run. The
          # changed-file eligibility filter this replaced existed solely to stop
          # an automatic trigger from spending money unattended.
          profile="${INPUT_PROFILE:-auto}"
          if [ "$profile" = auto ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR}/files" --jq '.[].filename')"
            if printf '%s\n' "$files" | grep -q '^apps/platform/alembic/'; then
              profile=stack-copy
            else
              profile=stack
            fi
          fi
          case "$profile" in stack|stack-copy) ;; *) echo "invalid profile" >&2; exit 2 ;; esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Retire the preview this PR holds
        if: steps.activation.outputs.enabled == 'true' && steps.resolve.outputs.action == 'retire'
        run: preview/cloud/retire.sh

      - name: Provision the exact PR SHA
        id: provision
        if: steps.activation.outputs.enabled == 'true' && steps.resolve.outputs.action == 'provision'
        env:
          PREVIEW_PROFILE: ${{ steps.resolve.outputs.profile }}
          PREVIEW_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          preview/cloud/provision.sh > "${RUNNER_TEMP}/preview.json"
          jq -e '.ready == true' "${RUNNER_TEMP}/preview.json" >/dev/null
          echo "dashboard_url=$(jq -r .dashboard_url "${RUNNER_TEMP}/preview.json")" >> "$GITHUB_OUTPUT"
          echo "platform_url=$(jq -r .platform_url "${RUNNER_TEMP}/preview.json")" >> "$GITHUB_OUTPUT"
          echo "backroom_url=$(jq -r .backroom_url "${RUNNER_TEMP}/preview.json")" >> "$GITHUB_OUTPUT"

      - name: Publish or update the preview comment
        if: steps.provision.outcome == 'success'
        env:
          PROFILE: ${{ steps.resolve.outputs.profile }}
          PREVIEW_SHA: ${{ steps.resolve.outputs.sha }}
          DASHBOARD_URL: ${{ steps.provision.outputs.dashboard_url }}
          PLATFORM_URL: ${{ steps.provision.outputs.platform_url }}
          BACKROOM_URL: ${{ steps.provision.outputs.backroom_url }}
        run: |
          set -euo pipefail
          marker='<!-- ditto-stack-preview -->'
          body_file="${RUNNER_TEMP}/comment.md"
          {
            echo "$marker"
            echo "SN118 \`$PROFILE\` preview for \`$PREVIEW_SHA\` is ready:"
            echo
            echo "- Dashboard: $DASHBOARD_URL"
            echo "- Platform API: $PLATFORM_URL"
            echo "- Backroom: $BACKROOM_URL"
            echo
            echo "This is isolated, disposable PR code. It has no production credentials. It stays up while this PR is open, for at most 24 hours, and is torn down 4 hours after the PR closes. Pushes do not refresh it -- dispatch \"Publish stack preview\" again for a newer commit."
          } > "$body_file"
          jq -n --rawfile body "$body_file" '{body:$body}' > "${RUNNER_TEMP}/comment.json"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- ditto-stack-preview -->")) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input "${RUNNER_TEMP}/comment.json" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR}/comments" --input "${RUNNER_TEMP}/comment.json" >/dev/null
          fi

      - name: Mark a retired preview comment
        if: steps.activation.outputs.enabled == 'true' && steps.resolve.outputs.action == 'retire'
        run: |
          set -euo pipefail
          marker='<!-- ditto-stack-preview -->'
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PREVIEW_PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- ditto-stack-preview -->")) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            body_file="${RUNNER_TEMP}/comment.md"
            printf '%s\nStack preview retired.\n' "$marker" > "$body_file"
            jq -n --rawfile body "$body_file" '{body:$body}' > "${RUNNER_TEMP}/comment.json"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input "${RUNNER_TEMP}/comment.json" >/dev/null
          fi
