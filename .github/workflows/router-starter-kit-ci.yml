name: DittoBench router starter kit CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - miners/dittobench-router-starter-kit/**
      - .github/workflows/router-starter-kit-ci.yml

permissions:
  contents: read

concurrency:
  group: router-starter-kit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: miners/dittobench-router-starter-kit

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Incremental compilation state is dead weight in CI: it roughly doubles
      # the cached target/ trees, and the shared repository cache evicts at
      # 10 GB, taking the warm-build win with it.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            miners/dittobench-router-starter-kit/target
          key: ${{ runner.os }}-router-starter-kit-target-${{ hashFiles('miners/dittobench-router-starter-kit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-router-starter-kit-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify format, lint, and tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features --verbose

      # Layer cache shared with the release gate: on the common run where the
      # miner tree is untouched, the whole build resolves from cache.
      - name: Build the shadow router image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: miners/dittobench-router-starter-kit
          tags: dittobench-router-starter-kit:ci
          push: false
          cache-from: type=gha,scope=router-starter-kit
          cache-to: type=gha,mode=max,scope=router-starter-kit,compression=zstd
