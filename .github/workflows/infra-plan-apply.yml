name: Infrastructure plan or apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a private plan or apply an exact existing plan
        required: true
        type: choice
        options: [plan, apply]
      root:
        description: Terraform state root
        required: true
        type: choice
        options: [gcp-platform, gcp-preview, cloudflare-dittobench, gcp-collector-custody, gcp-gamma-custody]
      plan_sha:
        description: Exact main commit used by the plan (required for apply)
        required: false
        type: string
      plan_run_id:
        description: Plan workflow run id (required for apply)
        required: false
        type: string
      gamma_custody_phase:
        description: Isolated Gamma custody lifecycle (review a fresh saved plan per phase)
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, armed, locked, sealed]
      gamma_custody_runtime_rpc_egress:
        description: Enable reviewed Finney TLS only on sealed isolated Gamma hosts
        required: true
        default: false
        type: boolean
      targets:
        description: Optional comma-separated Terraform -target addresses
        required: false
        type: string
      screener_fleet_dev_host_enabled:
        description: Create the disposable 64 GB nested-KVM screener rehearsal host
        required: true
        default: false
        type: boolean
      screener_fleet_x509_identity_enabled:
        description: Retain subnet-screener-1 X.509 federation and one-secret service account
        required: true
        default: true
        type: boolean
      validator_hotkey_admin_phase:
        description: Disposable GCP hotkey generator phase (gcp-platform plans only)
        required: true
        default: absent
        type: choice
        options: [absent, bootstrap, armed]
      validator_hotkey_admin_revision:
        description: Bootstrap plan main SHA, required unchanged for the armed phase
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.root }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PLAN_BUCKET: ditto-app-dev-tfstate

jobs:
  plan:
    if: inputs.operation == 'plan'
    runs-on: ubuntu-latest
    environment: infra-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.root == 'gcp-gamma-custody' && 'projects/1037372464879/locations/global/workloadIdentityPools/gamma-custody-github/providers/protected-infra' || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.root == 'gcp-gamma-custody' && 'gamma-custody-tf-plan@sn118-gamma-custody.iam.gserviceaccount.com' || secrets.GCP_TF_PLAN_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Select exact root
        id: root
        env:
          TF_TARGETS: ${{ inputs.targets }}
          HOTKEY_ADMIN_PHASE: ${{ inputs.validator_hotkey_admin_phase }}
          HOTKEY_ADMIN_REVISION: ${{ inputs.validator_hotkey_admin_revision }}
          SCREENER_DEV_HOST_ENABLED: ${{ inputs.screener_fleet_dev_host_enabled }}
        run: |
          case '${{ inputs.root }}' in
            gcp-platform) root=infra/terraform/stacks/gcp-platform ;;
            gcp-preview) root=infra/terraform/stacks/gcp-preview ;;
            cloudflare-dittobench) root=infra/terraform/stacks/cloudflare-dittobench ;;
            gcp-collector-custody|gcp-gamma-custody)
              test -z "$TF_TARGETS"
              test "$HOTKEY_ADMIN_PHASE" = absent
              test -z "$HOTKEY_ADMIN_REVISION"
              test "$SCREENER_DEV_HOST_ENABLED" = false
              root=infra/terraform/stacks/${{ inputs.root }}
              if [ '${{ inputs.root }}' = gcp-gamma-custody ]; then
                echo 'PLAN_BUCKET=sn118-gamma-custody-tfstate' >> "$GITHUB_ENV"
              fi
              ;;
            *) exit 2 ;;
          esac
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Initialize
        run: terraform -chdir=${{ steps.root.outputs.path }} init

      - name: Bind the screener fleet to the latest semantic release
        if: inputs.root == 'gcp-platform'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          revision="$(git rev-list -n 1 "$tag^{commit}")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$revision" HEAD
          echo "TF_VAR_screener_fleet_release_sha=$revision" >> "$GITHUB_ENV"

      - name: Bind the disposable hotkey admin lifecycle
        if: inputs.root == 'gcp-platform'
        env:
          HOTKEY_ADMIN_PHASE: ${{ inputs.validator_hotkey_admin_phase }}
          HOTKEY_ADMIN_REVISION: ${{ inputs.validator_hotkey_admin_revision }}
          HOTKEY_ADMIN_TARGETS: ${{ inputs.targets }}
        run: |
          case "$HOTKEY_ADMIN_PHASE" in
            absent)
              test -z "$HOTKEY_ADMIN_REVISION"
              revision=""
              ;;
            bootstrap)
              test -z "$HOTKEY_ADMIN_REVISION"
              revision="$(git rev-parse HEAD)"
              ;;
            armed)
              [[ "$HOTKEY_ADMIN_REVISION" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "$HOTKEY_ADMIN_REVISION^{commit}"
              test "$HOTKEY_ADMIN_REVISION" = "$(git rev-parse HEAD)"
              revision="$HOTKEY_ADMIN_REVISION"
              ;;
            *)
              exit 2
              ;;
          esac
          if [ -n "$HOTKEY_ADMIN_TARGETS" ]; then
            if [ "$HOTKEY_ADMIN_PHASE" != absent ]; then
              echo "targeted plans are forbidden during hotkey bootstrap/arm" >&2
              exit 2
            fi
            state="$(terraform -chdir=${{ steps.root.outputs.path }} state list)"
            if grep -Eq '^((google_compute_instance_from_template|google_compute_instance_template|google_service_account|google_compute_instance_iam_member|google_project_iam_member|google_service_account_iam_member)\.validator_hotkey_admin|google_secret_manager_secret_iam_member\.validator_hotkey_generator)' <<<"$state"; then
              echo "targeted plans are forbidden while the hotkey admin exists" >&2
              exit 2
            fi
          fi
          echo "TF_VAR_validator_hotkey_admin_phase=$HOTKEY_ADMIN_PHASE" >> "$GITHUB_ENV"
          echo "TF_VAR_validator_hotkey_admin_revision=$revision" >> "$GITHUB_ENV"

      - name: Create exact private plan
        if: inputs.root != 'gcp-collector-custody' && inputs.root != 'gcp-gamma-custody'
        env:
          TF_VAR_db_password: ${{ secrets.PLATFORM_DB_PASSWORD }}
          TF_VAR_pylon_open_access_token: ${{ secrets.PLATFORM_PYLON_OPEN_ACCESS_TOKEN_JSON }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ inputs.root == 'gcp-platform' && vars.CLOUDFLARE_HEYDITTO_ZONE_ID || vars.CLOUDFLARE_DITTOBENCH_ZONE_ID }}
          TF_VAR_screener_fleet_x509_ca_certificate_pem: ${{ vars.SCREENER_FLEET_X509_CA_CERTIFICATE_PEM }}
          TF_TARGETS: ${{ inputs.targets }}
          TF_ROOT: ${{ inputs.root }}
          SCREENER_DEV_HOST_ENABLED: ${{ inputs.screener_fleet_dev_host_enabled }}
        run: |
          extra=()
          if [ "$TF_ROOT" = gcp-platform ]; then
            extra+=(
              -var="validator_hotkey_admin_phase=${TF_VAR_validator_hotkey_admin_phase}"
              -var="validator_hotkey_admin_revision=${TF_VAR_validator_hotkey_admin_revision}"
              -var="enable_screener_fleet_dev_host=${SCREENER_DEV_HOST_ENABLED}"
              -var="enable_screener_fleet_x509_identity=${{ inputs.screener_fleet_x509_identity_enabled }}"
            )
          fi
          if [ -n "${TF_TARGETS}" ]; then
            IFS=',' read -ra addrs <<< "${TF_TARGETS}"
            for addr in "${addrs[@]}"; do
              extra+=(-target="${addr}")
            done
          fi
          # CLI variables intentionally outrank prod.auto.tfvars, whose checked-in
          # absent value is the safe default outside this protected ceremony.
          terraform -chdir=${{ steps.root.outputs.path }} plan -out=tfplan \
            "${extra[@]}"

      # Deliberately separate step: no Platform/Cloudflare secret variables,
      # fleet release pin, hotkey lifecycle or dev-host override reaches custody.
      - name: Create full isolated custody plan
        if: inputs.root == 'gcp-collector-custody' || inputs.root == 'gcp-gamma-custody'
        run: |
          extra=()
          if [ '${{ inputs.root }}' = gcp-gamma-custody ]; then
            phase='${{ inputs.gamma_custody_phase }}'
            case "$phase" in bootstrap|armed|locked|sealed) ;; *) exit 2 ;; esac
            # Literal -var booleans remain strings in saved plan JSON. Keep
            # the strict guard and encode a typed, credential-free var file.
            python3 scripts/collector-custody-phase-input.py "$phase" \
              '${{ inputs.gamma_custody_runtime_rpc_egress }}' "$RUNNER_TEMP/gamma-phase.json"
            extra+=(-var-file="$RUNNER_TEMP/gamma-phase.json")
          fi
          terraform -chdir=${{ steps.root.outputs.path }} plan -out=tfplan "${extra[@]}"

      - name: Verify isolated custody plan scope
        if: inputs.root == 'gcp-collector-custody' || inputs.root == 'gcp-gamma-custody'
        run: |
          plan_json="$(mktemp)"
          chmod 600 "$plan_json"
          trap 'rm -f "$plan_json"' EXIT
          terraform -chdir=${{ steps.root.outputs.path }} show -json tfplan > "$plan_json"
          scope=()
          if [ '${{ inputs.root }}' = gcp-gamma-custody ]; then scope+=(--gamma-project); fi
          python3 scripts/check-collector-custody-plan.py "${scope[@]}" "$plan_json"

      - name: Fence additive custody backend bootstrap
        if: inputs.root == 'gcp-preview'
        run: |
          plan_json="$(mktemp)"
          chmod 600 "$plan_json"
          trap 'rm -f "$plan_json"' EXIT
          terraform -chdir=${{ steps.root.outputs.path }} show -json tfplan > "$plan_json"
          python3 scripts/check-collector-custody-plan.py --backend-bootstrap "$plan_json"

      - name: Reject replacement of an armed hotkey admin
        if: inputs.root == 'gcp-platform' && inputs.validator_hotkey_admin_phase == 'armed'
        run: |
          plan_json="$(mktemp)"
          trap 'rm -f "$plan_json"' EXIT
          terraform -chdir=${{ steps.root.outputs.path }} show -json tfplan > "$plan_json"
          jq -e '
            [
              .resource_changes[]
              | select(
                  .address == "google_compute_instance_from_template.validator_hotkey_admin[0]"
                  or .address == "google_compute_instance_template.validator_hotkey_admin[0]"
                  or .address == "google_service_account.validator_hotkey_admin[0]"
                )
              | .change.actions[]
              | select(. == "create" or . == "delete")
            ]
            | length == 0
          ' "$plan_json"

      - name: Seal plan in private GCS
        id: seal
        run: |
          sha=$(git rev-parse HEAD)
          plan=${{ steps.root.outputs.path }}/tfplan
          checksum=$(sha256sum "$plan" | awk '{print $1}')
          prefix="gs://${PLAN_BUCKET}/ci-plans/${{ inputs.root }}/${sha}/${GITHUB_RUN_ID}"
          gcloud storage cp "$plan" "${prefix}.tfplan"
          printf '%s  tfplan\n' "$checksum" | gcloud storage cp - "${prefix}.sha256"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Plan handoff
        run: |
          echo "Plan SHA: ${{ steps.seal.outputs.sha }}"
          echo "Plan run id: ${GITHUB_RUN_ID}"
          echo "Plan checksum: ${{ steps.seal.outputs.checksum }}"

  apply:
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: infra-apply
    steps:
      - name: Validate immutable plan identity
        run: |
          [[ '${{ inputs.plan_sha }}' =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.plan_run_id }}' =~ ^[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.plan_sha }}
          fetch-depth: 0

      - name: Require plan commit to remain current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.root == 'gcp-gamma-custody' && 'projects/1037372464879/locations/global/workloadIdentityPools/gamma-custody-github/providers/protected-infra' || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.root == 'gcp-gamma-custody' && 'gamma-custody-tf-apply@sn118-gamma-custody.iam.gserviceaccount.com' || secrets.GCP_TF_APPLY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Select exact root
        id: root
        env:
          TF_TARGETS: ${{ inputs.targets }}
          HOTKEY_ADMIN_PHASE: ${{ inputs.validator_hotkey_admin_phase }}
          HOTKEY_ADMIN_REVISION: ${{ inputs.validator_hotkey_admin_revision }}
          SCREENER_DEV_HOST_ENABLED: ${{ inputs.screener_fleet_dev_host_enabled }}
        run: |
          case '${{ inputs.root }}' in
            gcp-platform) root=infra/terraform/stacks/gcp-platform ;;
            gcp-preview) root=infra/terraform/stacks/gcp-preview ;;
            cloudflare-dittobench) root=infra/terraform/stacks/cloudflare-dittobench ;;
            gcp-collector-custody|gcp-gamma-custody)
              test -z "$TF_TARGETS"
              test "$HOTKEY_ADMIN_PHASE" = absent
              test -z "$HOTKEY_ADMIN_REVISION"
              test "$SCREENER_DEV_HOST_ENABLED" = false
              root=infra/terraform/stacks/${{ inputs.root }}
              if [ '${{ inputs.root }}' = gcp-gamma-custody ]; then
                echo 'PLAN_BUCKET=sn118-gamma-custody-tfstate' >> "$GITHUB_ENV"
              fi
              ;;
            *) exit 2 ;;
          esac
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Initialize
        run: terraform -chdir=${{ steps.root.outputs.path }} init

      - name: Fetch and verify exact private plan
        run: |
          prefix="gs://${PLAN_BUCKET}/ci-plans/${{ inputs.root }}/${{ inputs.plan_sha }}/${{ inputs.plan_run_id }}"
          gcloud storage cp "${prefix}.tfplan" "${{ steps.root.outputs.path }}/tfplan"
          gcloud storage cp "${prefix}.sha256" "${{ steps.root.outputs.path }}/tfplan.sha256"
          cd "${{ steps.root.outputs.path }}"
          sha256sum -c tfplan.sha256

      - name: Fence additive custody backend bootstrap apply
        if: inputs.root == 'gcp-preview'
        run: |
          plan_json="$(mktemp)"
          chmod 600 "$plan_json"
          trap 'rm -f "$plan_json"' EXIT
          terraform -chdir=${{ steps.root.outputs.path }} show -json tfplan > "$plan_json"
          python3 scripts/check-collector-custody-plan.py --backend-bootstrap "$plan_json"

      - name: Apply the reviewed binary plan
        if: inputs.root != 'gcp-collector-custody' && inputs.root != 'gcp-gamma-custody'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir=${{ steps.root.outputs.path }} apply tfplan

      - name: Verify isolated custody apply scope
        if: inputs.root == 'gcp-collector-custody' || inputs.root == 'gcp-gamma-custody'
        run: |
          plan_json="$(mktemp)"
          chmod 600 "$plan_json"
          trap 'rm -f "$plan_json"' EXIT
          terraform -chdir=${{ steps.root.outputs.path }} show -json tfplan > "$plan_json"
          scope=()
          if [ '${{ inputs.root }}' = gcp-gamma-custody ]; then scope+=(--gamma-project); fi
          python3 scripts/check-collector-custody-plan.py "${scope[@]}" "$plan_json"

      - name: Apply the reviewed isolated custody binary plan
        if: inputs.root == 'gcp-collector-custody' || inputs.root == 'gcp-gamma-custody'
        run: terraform -chdir=${{ steps.root.outputs.path }} apply tfplan

      - name: Remove consumed private plan
        if: success()
        run: |
          prefix="gs://${PLAN_BUCKET}/ci-plans/${{ inputs.root }}/${{ inputs.plan_sha }}/${{ inputs.plan_run_id }}"
          gcloud storage rm "${prefix}.tfplan" "${prefix}.sha256"
