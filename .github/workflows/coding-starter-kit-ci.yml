name: DittoBench coding starter kit CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - miners/dittobench-coding-starter-kit/**
      - miners/dittobench-unified-starter-kit/**
      - miners/dittobench-starter-kit/**
      - research/dittobench-coding-datagen/**
      - packages/dittobench-coding-contract/**
      - services/dittobench-api/internal/codingcertifier/**
      - services/dittobench-api/internal/codingcontract/**
      - services/dittobench-api/internal/codingrelay/**
      - services/dittobench-api/internal/codingrunner/**
      - .github/workflows/coding-starter-kit-ci.yml
      - scripts/test-coding-starter-practice-e2e.sh

permissions:
  contents: read

concurrency:
  group: coding-starter-kit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: miners/dittobench-coding-starter-kit

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Incremental compilation state is dead weight in CI: it roughly doubles
      # the cached target/ trees, and the shared repository cache evicts at
      # 10 GB, taking the warm-build win with it.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            miners/dittobench-coding-starter-kit/target
            miners/dittobench-unified-starter-kit/target
          # The `-target-` key name retires the registry-only cache entries: an
          # exact hit on the old key would skip the save and leave target/
          # uncached forever.
          key: ${{ runner.os }}-coding-starter-kit-target-${{ hashFiles('miners/dittobench-coding-starter-kit/Cargo.lock', 'miners/dittobench-starter-kit/Cargo.lock', 'miners/dittobench-unified-starter-kit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coding-starter-kit-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify format, lint, and tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features --verbose

      - name: Run the scripted Rust and Python practice E2E
        working-directory: .
        run: bash scripts/test-coding-starter-practice-e2e.sh

      # Layer cache shared with the release gate: on the common run where the
      # miner trees are untouched, the whole build resolves from cache.
      - name: Build the shadow harness image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: miners/dittobench-coding-starter-kit
          tags: dittobench-coding-starter-kit:ci
          push: false
          cache-from: type=gha,scope=coding-starter-kit
          cache-to: type=gha,mode=max,scope=coding-starter-kit,compression=zstd

      - name: Verify the unified normal and coding starter
        working-directory: miners/dittobench-unified-starter-kit
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features --verbose
          cargo run --locked -- submit
          cd ../..
          uv run ditto verify \
            --path miners/dittobench-unified-starter-kit/dittobench-submission.tgz

      # load: the route probe below runs this tag from the local daemon.
      - name: Build the unified starter image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: miners
          file: miners/dittobench-unified-starter-kit/Dockerfile
          tags: dittobench-unified-miner:ci
          push: false
          load: true
          cache-from: type=gha,scope=unified-starter-kit
          cache-to: type=gha,mode=max,scope=unified-starter-kit,compression=zstd

      - name: Probe unified starter image routes
        working-directory: .
        run: >-
          bash miners/dittobench-unified-starter-kit/scripts/test-image-health.sh
          dittobench-unified-miner:ci
