name: Starter kit CI

on:
  pull_request:
    paths:
      - miners/dittobench-starter-kit/**
      - .github/workflows/starter-kit-ci.yml
  push:
    branches: [main]
    paths:
      - miners/dittobench-starter-kit/**
      - .github/workflows/starter-kit-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: miners/dittobench-starter-kit

jobs:
  build-and-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            miners/dittobench-starter-kit/target
          key: ${{ runner.os }}-starter-kit-${{ hashFiles('miners/dittobench-starter-kit/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Build locked crate
        run: cargo build --locked --verbose

      - name: Test locked crate
        run: cargo test --locked --verbose

      - name: Test submission labs
        run: python3 -m unittest scripts/test_submission_lab.py scripts/test_submission_workbench.py
