name: Screener CI

# Cost control: standalone verification is operator-dispatched; release gates
# remain in release.yml and its reusable verification workflows (SN-120).
on:
  workflow_dispatch:
permissions:
  contents: read

defaults:
  run:
    working-directory: workers/screener

jobs:
  protocol-minimum-pydantic:
    name: Protocol / Pydantic ${{ matrix.pydantic-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic-version: ["2.12.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v9
        with:
          enable-cache: true

      - run: uv python install 3.11
      - name: Exercise protocol at the declared Pydantic floor
        working-directory: .
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic-version }}
        run: |
          uv run --isolated --python 3.11 \
            --project packages/ditto-screening-protocol \
            --with "pydantic==$PYDANTIC_VERSION" --with "pytest>=8" \
            python -c 'import os, pydantic; assert pydantic.__version__ == os.environ["PYDANTIC_VERSION"]'
          uv run --isolated --python 3.11 \
            --project packages/ditto-screening-protocol \
            --with "pydantic==$PYDANTIC_VERSION" --with "pytest>=8" \
            python -m pytest packages/ditto-screening-protocol/tests -q

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v9
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type-check the minimum supported Python version
        run: uv run mypy ditto_screener
      - run: uv run pytest -m "not integration"
      - run: docker build -f workers/screener/Dockerfile -t ditto-screener:${{ github.sha }} .
        working-directory: .
      - name: Verify the screener image runs without root
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            ditto-screener:${{ github.sha }} \
            /app/workers/screener/.venv/bin/python -c \
            'import os; import ditto_screener.health; assert os.getuid() == os.getgid() == 65532'
