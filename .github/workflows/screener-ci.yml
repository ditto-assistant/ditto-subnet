name: Screener CI

on:
  pull_request:
    paths:
      - workers/screener/**
      - packages/ditto-screening-protocol/**
      - .github/workflows/screener-ci.yml
  push:
    branches: [main]
    paths:
      - workers/screener/**
      - packages/ditto-screening-protocol/**
      - .github/workflows/screener-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/screener

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type-check the minimum supported Python version
        run: uv run mypy ditto_screener
      - run: uv run pytest -m "not integration"
      - run: docker build -f workers/screener/Dockerfile -t ditto-screener:${{ github.sha }} .
        working-directory: .
