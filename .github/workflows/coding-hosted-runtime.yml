name: Native Coding runtime bundle
# Cost control: standalone verification is operator-dispatched; release gates
# remain in release.yml and its reusable verification workflows (SN-120).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed monorepo commit to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check the dormant installer playbook
        working-directory: infra/ansible
        run: uvx --from ansible-core==2.21.2 ansible-playbook --syntax-check -i localhost, playbooks/gcp-coding-hosted-runtime.yml
      - name: Prove the disabled role changes no host state
        working-directory: infra/ansible
        run: uvx --from ansible-core==2.21.2 ansible-playbook --check -i localhost, tests/coding-hosted-runtime.yml
      - name: Build, install and smoke-test exact public software
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 infra/scripts/build-coding-hosted-runtime.py
          --revision "$REQUESTED_SHA" --output "$RUNNER_TEMP/native-runtime-artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coding-runtime-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifact/
          if-no-files-found: error
          retention-days: 7
