name: Bootstrap Depot deployment secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prod:
    name: Import prod deployment values
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
      - name: Import main-only prod secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DITTO_UPLOAD_PAYMENT_ADDRESS: ${{ secrets.DITTO_UPLOAD_PAYMENT_ADDRESS }}
          GCP_DATAGEN_RELEASE_SA: ${{ secrets.GCP_DATAGEN_RELEASE_SA }}
          GCP_DITTOBENCH_DEPLOY_SA: ${{ secrets.GCP_DITTOBENCH_DEPLOY_SA }}
          GCP_PLATFORM_DEPLOY_SA: ${{ secrets.GCP_PLATFORM_DEPLOY_SA }}
          GCP_SCREENER_BAKE_SA: ${{ secrets.GCP_SCREENER_BAKE_SA }}
          GCP_SCREENER_DEPLOY_SA: ${{ secrets.GCP_SCREENER_DEPLOY_SA }}
          GCP_SUBNET_BUILD_SA: ${{ secrets.GCP_SUBNET_BUILD_SA }}
        run: |
          set -euo pipefail
          unset DEPOT_TOKEN
          workflows=(
            release.yml
            platform-deploy.yml
            screener-bake.yml
            screener-controller-deploy.yml
            screener-deploy.yml
          )
          workflow_flags=()
          for workflow in "${workflows[@]}"; do
            workflow_flags+=(--workflow "$workflow")
          done
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            DITTO_UPLOAD_PAYMENT_ADDRESS \
            GCP_DATAGEN_RELEASE_SA \
            GCP_DITTOBENCH_DEPLOY_SA \
            GCP_PLATFORM_DEPLOY_SA \
            GCP_SCREENER_BAKE_SA \
            GCP_SCREENER_DEPLOY_SA \
            GCP_SUBNET_BUILD_SA; do
            value="${!name}"
            test -n "$value"
            printf '%s' "$value" | depot ci secrets set "$name" prod-main \
              --from-stdin \
              --repo ditto-assistant/ditto-subnet \
              --branch main \
              --env prod \
              "${workflow_flags[@]}"
          done
          printf '%s' \
            'projects/22790208601/locations/global/workloadIdentityPools/github/providers/depot-ditto-subnet' \
            | depot ci secrets set GCP_WIF_PROVIDER prod-main \
              --from-stdin \
              --repo ditto-assistant/ditto-subnet \
              --branch main \
              --env prod \
              "${workflow_flags[@]}"
      - name: Import prod variables
        shell: bash
        env:
          BACKROOM_OAUTH_KV_ID: ${{ vars.BACKROOM_OAUTH_KV_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          unset DEPOT_TOKEN
          for name in BACKROOM_OAUTH_KV_ID CLOUDFLARE_ACCOUNT_ID; do
            value="${!name}"
            test -n "$value"
            depot ci vars set "$name" prod-main \
              --repo ditto-assistant/ditto-subnet \
              --branch main \
              --env prod \
              --workflow release.yml \
              --value "$value"
          done

  dev:
    name: Import dev deployment identity
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1
      - name: Import main-only dev secrets
        shell: bash
        env:
          GCP_PLATFORM_DEPLOY_SA: ${{ secrets.GCP_PLATFORM_DEPLOY_SA }}
        run: |
          set -euo pipefail
          unset DEPOT_TOKEN
          test -n "$GCP_PLATFORM_DEPLOY_SA"
          printf '%s' "$GCP_PLATFORM_DEPLOY_SA" \
            | depot ci secrets set GCP_PLATFORM_DEPLOY_SA dev-main \
              --from-stdin \
              --repo ditto-assistant/ditto-subnet \
              --branch main \
              --env dev \
              --workflow platform-deploy.yml
          printf '%s' \
            'projects/22790208601/locations/global/workloadIdentityPools/github/providers/depot-ditto-subnet' \
            | depot ci secrets set GCP_WIF_PROVIDER dev-main \
              --from-stdin \
              --repo ditto-assistant/ditto-subnet \
              --branch main \
              --env dev \
              --workflow platform-deploy.yml
