name: DittoBench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/dittobench-api/**
      - research/dittobench-datagen/**
      - packages/ditto-screening-protocol/ditto_screening_protocol/data/**
      - packages/dittobench-coding-contract/**
      - scripts/generate_confirmation_installation.py
      - docker-compose.yml
      - Dockerfile.sandbox-docker
      - scripts/sandbox-docker-entrypoint.sh
      - scripts/test-validator-embedding-gateway.sh
      - scripts/test-coding-python-driver.sh
      - scripts/test-coding-compiled-bootstrap.sh
      - scripts/test-coding-rust-bridge.sh
      - scripts/test-coding-rust-driver.sh
      - scripts/test-coding-go-build.sh
      - scripts/test-coding-go-driver.sh
      - scripts/test-coding-node-driver.sh
      - scripts/test-coding-node-confinement.sh
      - .github/workflows/dittobench.yml

concurrency:
  group: dittobench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: us-central1-docker.pkg.dev/ditto-app-dev/cloud-run-source-deploy/dittobench-api
  SERVICE_DIR: services/dittobench-api

jobs:
  rust-coding-driver:
    name: trusted Rust supervisor driver isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker build -f services/dittobench-api/Dockerfile.coding-rust --target test -t coding-rust-driver:synthetic .
      - run: bash scripts/test-coding-rust-driver.sh coding-rust-driver:synthetic
      - name: Build and inspect production target without activation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -f services/dittobench-api/Dockerfile.coding-rust --target runtime --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" -t coding-rust-driver:runtime .
          docker image inspect coding-rust-driver:runtime | jq -e --arg sha "$SOURCE_SHA" \
            '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha and .[0].Config.Labels["io.heyditto.dittobench.coding-test-driver-profile"] == "rust-call-ast-v1" and .[0].Config.Env == ["PATH=/usr/local/bin:/usr/bin:/bin"] and .[0].Config.Labels["io.heyditto.dittobench.coding-supervisor-fixture"] == null'
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint /bin/sh coding-rust-driver:runtime -c \
            'test ! -e /opt/probe.py && test ! -e /src && test ! -e /opt/fixture && test -x /usr/local/bin/dittobench-test-driver'

  rust-coding-bridge:
    name: compiled Rust API bridge isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker build -f services/dittobench-api/Dockerfile.coding-rust-bridge-probe -t coding-rust-bridge:synthetic .
      - run: bash scripts/test-coding-rust-bridge.sh coding-rust-bridge:synthetic

  rust-suite-admission:
    name: protected Rust suite admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Check closed syntax and source-free failures
        working-directory: services/dittobench-api/coding_runtime/rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          cargo test --locked --no-default-features

  go-coding-driver:
    name: trusted Go driver isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker build -f services/dittobench-api/Dockerfile.coding-go-build-probe -t coding-go-build:synthetic .
      - run: bash scripts/test-coding-go-build.sh coding-go-build:synthetic
      - run: docker build -f services/dittobench-api/Dockerfile.coding-go --target test -t coding-go:synthetic .
      - run: bash scripts/test-coding-go-driver.sh coding-go:synthetic
      - name: Build and inspect the production target
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -f services/dittobench-api/Dockerfile.coding-go --target runtime --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" -t coding-go:runtime .
          docker image inspect coding-go:runtime | jq -e --arg sha "$SOURCE_SHA" \
            '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha and .[0].Config.Labels["io.heyditto.dittobench.coding-test-driver-profile"] == "go-call-ast-v1" and .[0].Config.Env == ["PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"]'
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint /bin/sh coding-go:runtime -c \
            'test ! -e /opt/probe && test ! -e /src && test ! -e /opt/private-probe && test ! -e /opt/go-private-probe'

  compiled-coding-bootstrap:
    name: compiled candidate pre-exec confinement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f services/dittobench-api/Dockerfile.coding-compiled-bootstrap -t coding-compiled-bootstrap:synthetic .
      - run: bash scripts/test-coding-compiled-bootstrap.sh coding-compiled-bootstrap:synthetic

  node-coding-driver:
    name: restricted Node TypeScript driver isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Closed oracle, channel and value-protocol regressions
        working-directory: services/dittobench-api/coding_runtime/node
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test '*.test.cjs'
      - run: docker build -f services/dittobench-api/Dockerfile.coding-node-confinement -t coding-node-confinement:synthetic .
      - run: bash scripts/test-coding-node-confinement.sh coding-node-confinement:synthetic
      - run: docker build -f services/dittobench-api/Dockerfile.coding-node --target test -t coding-node:synthetic .
      - run: bash scripts/test-coding-node-driver.sh coding-node:synthetic
      - name: Build production target with the exact checked-out revision
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build -f services/dittobench-api/Dockerfile.coding-node --target runtime --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" -t coding-node:runtime .
          docker image inspect coding-node:runtime | jq -e --arg sha "$SOURCE_SHA" \
            '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha and .[0].Config.Labels["io.heyditto.dittobench.coding-test-driver-profile"] == "node-call-ast-v2" and .[0].Config.Env == ["PATH=/usr/local/bin:/usr/bin:/bin"]'
      - name: Runtime contains no probes or credential-shaped environment
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/bin/node coding-node:runtime -e \
            'const fs=require("node:fs"),assert=require("node:assert/strict"); assert.equal(fs.existsSync("/opt/probe.cjs"),false); assert.equal(fs.readdirSync("/opt/coding-node").some(n=>/probe|test/.test(n)),false); assert.equal(Object.keys(process.env).some(n=>/KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL/.test(n)),false);'

  python-coding-driver:
    name: restricted Python driver isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: docker build -f services/dittobench-api/Dockerfile.coding-python --target test --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" -t coding-python:synthetic .
      - run: bash scripts/test-coding-python-driver.sh coding-python:synthetic
      - run: docker build -f services/dittobench-api/Dockerfile.coding-python --target runtime --build-arg DITTOBENCH_SOURCE_SHA="$SOURCE_SHA" -t coding-python:runtime .
      - name: Runtime image excludes synthetic probes and credential-shaped environment
        run: |
          docker image inspect coding-python:runtime | jq -e --arg sha "$SOURCE_SHA" \
            '.[0].Config.Labels["org.opencontainers.image.revision"] == $sha and .[0].Config.Labels["io.heyditto.dittobench.coding-test-driver-profile"] == "python-call-ast-v2" and .[0].Config.Labels["io.heyditto.dittobench.coding-supervisor-fixture"] == null'
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/bin/python3 coding-python:runtime -I -c \
            'import os; assert not os.path.exists("/opt/probe.py"); assert not any(any(k in name for k in ("KEY", "TOKEN", "SECRET", "PASSWORD", "CREDENTIAL")) for name in os.environ)'

  validator-stack-gateway:
    name: validator stack embedding gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-validator-embedding-gateway.sh

  test:
    name: build · vet · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify compatibility relay source manifest
        working-directory: services/dittobench-api/compat/model-relay
        run: sha256sum --check SHA256SUMS
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: services/dittobench-api/go.sum
      - run: go build ./...
        working-directory: ${{ env.SERVICE_DIR }}
      - run: go vet ./...
        working-directory: ${{ env.SERVICE_DIR }}
      - run: go test ./...
        working-directory: ${{ env.SERVICE_DIR }}

  docker-build:
    name: docker image builds (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [runtime, sandbox, coding-executor-scorer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/dittobench-api/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: false

  coding-supervisor-build:
    name: coding supervisor image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build public coding supervisor certification image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/dittobench-api/Dockerfile.coding-supervisor
          push: false
          load: false

  provenance:
    name: image reports its monorepo revision
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build scorer with stamped identity
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/dittobench-api/Dockerfile
          target: sandbox
          push: false
          load: true
          tags: dittobench-api:provenance-ci
          build-args: |
            DITTOBENCH_SOURCE_SHA=${{ github.event.pull_request.head.sha }}
            DITTOBENCH_SOFTWARE_VERSION=ci-${{ github.run_id }}
      - name: Verify compiled provenance wins over environment claims
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$(docker run --rm \
            -e DITTOBENCH_SOURCE_SHA=0000000000000000000000000000000000000001 \
            dittobench-api:provenance-ci version -json)"
          test "$(jq -r .source_revision <<<"$report")" = "$EXPECTED_SHA"
          test "$(jq -r .source_revision_origin <<<"$report")" = binary
          test "$(jq -r .source_revision_mismatch <<<"$report")" = true
          test "$(jq -r .software_version <<<"$report")" = "ci-${{ github.run_id }}"
          clean="$(docker run --rm dittobench-api:provenance-ci version -json)"
          test "$(jq -r .source_revision_mismatch <<<"$clean")" = false
