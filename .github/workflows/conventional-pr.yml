name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release-aware squash title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(fix|feat|chore|docs|perf)(\([^\)]+\))?\!?:\ .+ ]]; then
            echo "PR titles must start with fix:, feat:, chore:, docs:, or perf: (optional scope and ! are supported)."
            echo "docs: releases like chore: (no version bump); perf: releases like fix: (patch)."
            exit 1
          fi
