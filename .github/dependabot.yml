version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /services/dittobench-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/dittobench-api
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/dittobench-api/integrations/hermes
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/dittobench-api/integrations/openclaw
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /apps/platform
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/platform
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/platform/dashboard
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/platform/docker/embedder
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /workers/screener
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/screener-orchestrator
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /workers/screener
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /packages/ditto-screening-protocol
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /research/dittobench-coding-datagen
    schedule:
      interval: weekly
