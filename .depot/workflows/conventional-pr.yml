# Depot CI Migration
# Source: .github/workflows/conventional-pr.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Conventional PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Require a release-aware squash title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(fix|feat|chore)(\([^\)]+\))?\!?:\ .+ ]]; then
            echo "PR titles must start with fix:, feat:, or chore: (optional scope and ! are supported)."
            exit 1
          fi
