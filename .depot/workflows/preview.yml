# Unprivileged validation only; dashboard publication stays on GitHub.
name: Depot preview controls

# Resolve and test the source-checkout preview control harness. Unprivileged
# jobs never receive cloud credentials. For dashboard-only PRs this workflow
# emits a static artifact and calls the same-run publisher, which checks out
# only the default branch before entering the preview environment.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated profiles (dashboard, stack, stack-copy)
        required: true
        type: string
        default: dashboard
      attach_prod_api:
        description: Public dashboard against prod Platform (illegal with stack)
        type: boolean
        default: false
      ref:
        description: Branch or tag label (empty uses this workflow ref)
        type: string
        required: false
      sha:
        description: Exact 40-character commit to check out and test
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: depot-preview-${{ github.event.pull_request.number || github.ref }}
  queue: max

jobs:
  plan:
    runs-on: depot-ubuntu-24.04-4
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
      attach: ${{ steps.resolve.outputs.attach }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.sha || inputs.ref || github.sha }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Resolve profiles at the checked-out SHA
        id: resolve
        env:
          INPUT_PROFILES: ${{ inputs.profiles }}
          INPUT_ATTACH: ${{ inputs.attach_prod_api && 'true' || 'false' }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_REF: ${{ github.head_ref || github.ref_name }}
          PR_FILES: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$INPUT_SHA" ] && [ "$INPUT_SHA" != "$actual_sha" ]; then
            echo "requested SHA does not match checked out commit" >&2
            exit 2
          fi

          profiles="${INPUT_PROFILES:-}"
          attach="${INPUT_ATTACH}"
          if [ -z "$profiles" ] && [ "$PR_FILES" = true ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            profiles=""
            echo "$files" | grep -q '^apps/platform/dashboard/' && profiles="${profiles},dashboard"
            echo "$files" | grep -Eq '^(apps/backroom/|apps/platform/ditto/|apps/platform/alembic/|ditto/(api_models|chain|validator)/|services/dittobench-api/)' && profiles="${profiles},stack"
            echo "$files" | grep -q '^apps/platform/alembic/' && profiles="${profiles},stack-copy"
            profiles="${profiles#,}"
            [ -n "$profiles" ] || profiles="stack"
            if echo "$profiles" | grep -Eq '(^|,)stack'; then
              attach=false
            else
              attach=true
            fi
          fi

          [ -n "$profiles" ] || profiles="dashboard"
          if [ "$attach" = true ]; then
            plan_json="$(uv run --locked python -m ditto.preview compose "$profiles" \
              --attach-prod-api \
              --ref "${INPUT_REF:-$EVENT_REF}" \
              --sha "$actual_sha")"
          else
            plan_json="$(uv run --locked python -m ditto.preview compose "$profiles" \
              --ref "${INPUT_REF:-$EVENT_REF}" \
              --sha "$actual_sha")"
          fi
          printf '%s\n' "$plan_json"
          echo "profiles=$(jq -r '.profiles | join(",")' <<<"$plan_json")" >>"$GITHUB_OUTPUT"
          echo "attach=$(jq -r '.attach_prod_api' <<<"$plan_json")" >>"$GITHUB_OUTPUT"
          echo "sha=$actual_sha" >>"$GITHUB_OUTPUT"

  cheatcodes:
    if: github.event.action != 'closed'
    needs: plan
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Prove overlay cheatcodes
        run: uv run --locked pytest ditto/tests/preview -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Prove the trusted dashboard preview boundary
        run: node --test apps/platform/dashboard/preview/cloudflare-pages-worker.test.mjs

