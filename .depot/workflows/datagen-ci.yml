# Depot CI Migration
# Source: .github/workflows/datagen-ci.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: DittoBench datagen CI
on:
  pull_request:
    paths:
      - research/dittobench-datagen/**
      - .depot/workflows/datagen-ci.yml
  push:
    branches: [main]
    paths:
      - research/dittobench-datagen/**
      - .depot/workflows/datagen-ci.yml
permissions:
  contents: read
concurrency:
  group: datagen-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: research/dittobench-datagen
jobs:
  build-test:
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: research/dittobench-datagen/go.mod
      - name: Gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Validate release script syntax
        run: bash -n scripts/verify-generate-service-release.sh
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Determinism
        run: |
          go build -o "$RUNNER_TEMP/generate" ./cmd/generate
          a=$("$RUNNER_TEMP/generate" -bench-version 2 -seed 123456789 -run-size full -sha 2>/dev/null)
          b=$("$RUNNER_TEMP/generate" -bench-version 2 -seed 123456789 -run-size full -sha 2>/dev/null)
          test "$a" = "$b"
      - name: Cross-architecture known vector
        run: GOARCH=386 go test ./gen -run TestKnownVector -count=1
