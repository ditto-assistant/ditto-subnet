interface:
  display_name: "Scoring Infra Triage"
  short_description: "Find the failure behind a low SN118 score, fix ours, then retry"
  default_prompt: "Use $scoring-infra-triage to find every low sample for this agent, prove whether the failure is ours or the agent's, fix ours before any retry, and draft the miner reply."

dependencies:
  tools:
    - type: "mcp"
      value: "sn118-backroom"
      description: "OAuth-protected SN118 Backroom operator MCP"
      transport: "streamable_http"
      url: "https://backroom.dittobench.ai/mcp"

policy:
  allow_implicit_invocation: true
