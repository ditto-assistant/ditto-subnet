interface:
  display_name: "Miner comms"
  short_description: "Investigate miner Discord questions and draft a paste-ready reply"
  default_prompt: "Use $miner-comms to investigate the miner question against live Backroom state and draft a paste-ready Discord reply."

dependencies:
  tools:
    - type: "mcp"
      value: "sn118-backroom"
      description: "OAuth-protected SN118 Backroom operator MCP"
      transport: "streamable_http"
      url: "https://backroom.dittobench.ai/mcp"

policy:
  allow_implicit_invocation: true
