[package]
name = "dittobench-unified-starter-kit"
version = "0.1.0"
edition = "2021"
description = "Unified normal and shadow-coding DittoBench reference miner"
license = "MIT"
publish = false

[[bin]]
name = "dittobench-unified-miner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

dittobench-starter-kit = { path = "../dittobench-starter-kit" }
dittobench-coding-starter-kit = { path = "../dittobench-coding-starter-kit" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
