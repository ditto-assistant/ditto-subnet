[package]
name = "dittobench-coding-starter-kit"
version = "0.1.0"
edition = "2021"
description = "Shadow-only DittoBench coding miner reference harness"
license = "MIT"
publish = false

[[bin]]
name = "dittobench-coding-miner"
path = "src/bin/dittobench-coding-miner.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
ditto-harness = { git = "https://github.com/ditto-assistant/ditto-harness", rev = "ba5b463aecd8eec38ada6aa9c2e6e8fac9c5be1d" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
