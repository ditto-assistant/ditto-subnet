    <!--
    Public transparency dashboard for Bittensor Subnet 118 (Ditto).

    Static SPA built with Vite + SolidJS (npm run build -> dist/). No external
    requests at runtime, no secrets. All data comes from the platform's PUBLIC,
    aggregate-only read API and (for the deep dive) wandb.

    Configure the API base (in priority order):
      1. ?api=https://api.example.com/api/v1   (query string, handy for testing)
      2. <meta name="ditto:api-base" content="…">  (edit the tag below to bake in)
      3. same-origin "/api/v1"                  (default: dashboard served next to the API)

    wandb project link is configured the same way via ?wandb= or the meta tag.

    If the API can't be reached, the page renders an explicit unavailable state.
    It never substitutes example values for live subnet data.
  -->
    <meta name="ditto:api-base" content="" />
    <meta name="ditto:wandb-url" content="https://wandb.ai/" />


    <script>
      // Apply the saved appearance before CSS paints to avoid a flash: the
      // four-mode preference (system/light/dark/time) and the brand-kit
      // palette. Keep in sync with src/components/shell/ThemeSwitcher.tsx.
      (function () {
        "use strict";
        var STORAGE_KEY = "ditto:dashboard-theme";
        var PALETTE_KEY = "ditto:dashboard-palette";
        var DEFAULT_PALETTE = "carbon";
        var MODES = { system: true, light: true, dark: true, time: true };
        var PALETTES = { carbon: true, parchment: true, signal: true, vermilion: true, tide: true };

        function fromHour(hour) {
          if (hour >= 5 && hour < 8) return "dawn";
          if (hour >= 8 && hour < 12) return "morning";
          if (hour >= 12 && hour < 17) return "afternoon";
          if (hour >= 17 && hour < 20) return "dusk";
          return "night";
        }

        function readMode() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY);
            return MODES[saved] ? saved : "system";
          } catch (e) {
            return "system";
          }
        }

        function readPalette() {
          try {
            var saved = localStorage.getItem(PALETTE_KEY);
            return PALETTES[saved] ? saved : DEFAULT_PALETTE;
          } catch (e) {
            return DEFAULT_PALETTE;
          }
        }

        function apply(mode) {
          var next = MODES[mode] ? mode : "system";
          var root = document.documentElement;
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var phase = fromHour(new Date().getHours());
          root.dataset.theme = next;
          root.dataset.systemTheme = systemDark ? "dark" : "light";
          root.dataset.timePhase = phase;
          // The kit scopes its palettes on the resolved mode, never on "system".
          var dark =
            next === "dark" ||
            (next === "system" && systemDark) ||
            (next === "time" && phase === "night");
          root.dataset.dittoMode = dark ? "dark" : "light";
          if (!root.dataset.dittoTheme) root.dataset.dittoTheme = readPalette();
          return next;
        }

        function applyPalette(palette) {
          var next = PALETTES[palette] ? palette : DEFAULT_PALETTE;
          document.documentElement.dataset.dittoTheme = next;
          return next;
        }

        window.__dittoDashboardTheme = {
          storageKey: STORAGE_KEY,
          paletteStorageKey: PALETTE_KEY,
          fromHour: fromHour,
          readMode: readMode,
          readPalette: readPalette,
          apply: apply,
          applyPalette: applyPalette,
        };
        applyPalette(readPalette());
        apply(readMode());
      })();
    </script>
