[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ditto-platform"
version = "0.0.1"
description = "Ditto Platform — API server for Bittensor Subnet 118 (SN118): miner intake, payment verification, evaluation orchestration, and scoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "heyDitto" }]
dependencies = [
    "bittensor>=10.2.1",
    "bittensor-pylon-client",
    "async-substrate-interface",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.20",
    "tenacity>=8.0",
    "httpx>=0.27",
    "cryptography>=42",
    "aioboto3>=13.0",
    "ditto-screening-protocol==0.13.0",
]

[tool.uv.sources]
bittensor-pylon-client = { git = "https://github.com/bittensor-church/bittensor-pylon", subdirectory = "pylon_client" }
ditto-screening-protocol = { git = "https://github.com/ditto-assistant/ditto-screener.git", rev = "082c5304c9dd591cc0934149f4a4ceb176d434c5", subdirectory = "packages/ditto-screening-protocol" }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-xdist>=3.8",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["ditto"]

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["ditto", "ditto_screening_protocol"]

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ditto.tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["ditto/tests"]
markers = [
    "slow: long-running tests excluded by default",
    "integration: multi-session/concurrency tests against a real Postgres",
    "localnet: tests against a local Bittensor network",
    "e2e: end-to-end tests through the full stack",
    "needs_chain: requires a reachable Pylon backed by a live subtensor",
]
# `integration` and `e2e` are NOT deselected. They were, and the consequence
# was that `test_reservations_on_one_grant_serialize_and_respect_the_budget`
# -- the only signal that the ditto-platform#438 accounting bug has returned
# -- never ran in CI. `localnet` stays out because it needs a chain, and
# `slow` stays out because it is a wall-clock tier, not a fidelity tier.
#
# `needs_chain` is a *capability* gate, not a fidelity one, and it is
# deliberately tiny -- exactly two tests, both of which assert on data only a
# live subtensor can produce (cached recent-neuron sets). Everything a
# container can provide is provisioned in CI instead of excluded: the suite
# gets a real Postgres and a real MinIO, so the other 10 previously-excluded
# integration tests now run there. Resist widening this marker; the whole
# point of this change is that "the test needs a real dependency" stopped
# being a reason not to run it.
addopts = [
    "-n",
    "auto",
    "--dist=worksteal",
    "-m",
    "not slow and not localnet and not needs_chain",
]
