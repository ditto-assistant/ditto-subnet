title = "ditto-platform Gitleaks configuration"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Public SS58 address used by the integration-test fixture. An address is not a
# credential; require both the exact value and exact fixture path so no other
# generic API-key finding is suppressed.
[[allowlists]]
description = "Public integration-test coldkey address"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^5DhaT8U7LVwnnJNUU8VL1XEipicatoaDVVq7cHo227gogVZm$''']
paths = ['''^ditto/tests/integration/test_upload_agent_integration\.py$''']

# Fixed, non-secret literals used to exercise token validation and coldkey
# grouping. These were added after the original repository audit and are each
# constrained to an exact value, rule, and test file.
[[allowlists]]
description = "Deterministic benchmark run-token test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^0123456789abcdef$''']
paths = ['''^ditto/tests/api_models/test_benchmark_progress\.py$''']

[[allowlists]]
description = "Deliberately invalid coldkey owner test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^5ColdkeyOwner$''']
paths = ['''^ditto/tests/db/queries/test_scores\.py$''']

[[allowlists]]
description = "Payment-time coldkey owner in the ATH attest replay test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^5ChampionOwner$''']
paths = ['''^ditto/tests/api_server/endpoints/test_admin_ath_rulings\.py$''']

[[allowlists]]
description = "Git revision used by the dashboard entity-panel test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^[0-9a-f]{40}$''']
paths = ['''^dashboard/src/components/EntityPanel\.stack\.test\.tsx$''']

# The public SS58 address of the well-known Substrate development key //Bob,
# used as a bounty's fee escrow coldkey in the publication tests. An address is
# not a credential.
[[allowlists]]
description = "Public development-key escrow address in the bounty tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty$''']
paths = ['''^ditto/tests/api_server/endpoints/test_bounties\.py$''']

# Public SS58 addresses in the recorded bounty board fixtures: the //Bob
# development escrow and the payee coldkeys of the four deterministic test
# contributors (//Alice//cold, //Bob//cold, //Carol//cold, //Dave//cold). The
# fixtures are verbatim API recordings, and addresses are not credentials.
[[allowlists]]
description = "Public test-key addresses in the recorded bounty board fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty$''',
  '''^5FWfU64fUQG6iZGcxDEHfBSagweCcaFVbi3wgNBFkmFoZcNg$''',
  '''^5DRUZLgg59jWvH6nV1UCAUuYagfNyB9kpxzGykiA12TXr4nc$''',
  '''^5EALFU5zdK5Y8w32gxLrBnkaUnh7Dy8yu55jAwJnLTQpNmvh$''',
  '''^5CoQ1eiHdYkPjAJA449CRzaFdzAfNh3Lxem2dAFRxFMmLNpW$''',
]
paths = ['''^dashboard/fixtures/bounty-(board|detail|claims)\.json$''']
